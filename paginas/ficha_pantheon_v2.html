<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" data-pal="ouro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PANTHEON · Ficha</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Faustina:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--h:40;--acc:hsl(var(--h) 62% 55%);--on:#140f08;--bg:hsl(var(--h) 25% 6%);--card:hsl(var(--h) 22% 9.5%);--card2:hsl(var(--h) 20% 14%);--line:hsl(var(--h) 25% 22%);--txt:hsl(var(--h) 30% 85%);--mut:hsl(var(--h) 12% 58%)}
[data-theme=light]{--acc:hsl(var(--h) 65% 36%);--on:#fff;--bg:hsl(var(--h) 35% 91%);--card:hsl(var(--h) 40% 97%);--card2:hsl(var(--h) 30% 90%);--line:hsl(var(--h) 25% 76%);--txt:hsl(var(--h) 30% 12%);--mut:hsl(var(--h) 15% 38%)}
[data-pal=carmesim]{--h:355}[data-pal=esmeralda]{--h:150}[data-pal=safira]{--h:210}[data-pal=violeta]{--h:270}
*{box-sizing:border-box}
body{margin:0;padding:12px;background:var(--bg);color:var(--txt);font:14px/1.35 Faustina,Georgia,serif}
.cz,h2,.btn,.nome{font-family:Cinzel,Georgia,serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);display:flex;align-items:center;gap:6px}
.grip{cursor:grab;color:var(--mut);user-select:none;font-size:15px}
.r{margin-left:auto;display:flex;gap:6px;align-items:center}
button,input,select{font:inherit;color:inherit}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:3px 9px;cursor:pointer;font-size:11px}
.btn:hover,.btn.on{border-color:var(--acc);color:var(--acc)}
.pri{background:var(--acc)!important;color:var(--on)!important;border-color:var(--acc)!important;font-weight:700}
input,select{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:3px 6px;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--acc)}
input[type=number]{-moz-appearance:textfield}input::-webkit-inner-spin-button,input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.head{display:grid;gap:8px}.nome{font-size:22px;font-weight:700;width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;color:var(--acc);padding:2px 0}
.rz{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}.rz label{color:var(--mut)}
.chip{display:inline-flex;gap:4px;align-items:center;padding:2px 8px;border-radius:99px;border:1px solid var(--line);background:var(--card2);font:600 11px monospace}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.col{min-height:80px}@media(max-width:900px){.cols{grid-template-columns:1fr}}
.dragging{opacity:.4}.col.over{outline:1px dashed var(--acc);outline-offset:4px}
.res{margin-bottom:10px}.rt{display:flex;justify-content:space-between;font:700 12px monospace}
.bar{height:9px;border-radius:5px;background:var(--card2);border:1px solid var(--line);overflow:hidden;margin-top:2px}.bar i{display:block;height:100%;transition:width .25s}
.ctl{display:flex;gap:4px;margin-top:5px}.ctl input{width:64px;text-align:center}.sg{width:28px;font-weight:700;padding:0}.sg.add{color:#4cc36f}.sg.sub{color:#e05555}
.wheel{position:relative;width:min(100%,300px);aspect-ratio:1;margin:4px auto}.wheel svg{position:absolute;inset:0;width:100%;height:100%}
.ctr{position:absolute;left:50%;top:51.7%;transform:translate(-50%,-50%);text-align:center;color:var(--mut);font-size:10px;line-height:1.1}.ctr b{display:block;font:700 20px Cinzel,serif;color:var(--acc)}
.node{position:absolute;width:19%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:var(--card);border:2px solid var(--acc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 2px 8px #0006}
.node b{font:700 9px Cinzel,serif;letter-spacing:.04em}.node input{width:70%;text-align:center;background:transparent;border:0;font:700 17px Cinzel,serif;padding:0;color:var(--txt)}
.c-r{color:#e06a5a}.c-b{color:#4fb0e0}.c-p{color:#b480e6}
.node.on{background:var(--acc)}.node.on b,.node.on input{color:var(--on)}
.prow,.hcard,.mrow{background:var(--card2);border:1px solid var(--line);border-radius:7px;padding:5px 8px;margin-bottom:5px;font-size:13px}
.prow,.mrow{display:flex;align-items:center;gap:6px;justify-content:space-between}.prow input{width:42px;text-align:center}
.prow.on,.hcard.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.hcard p{margin:2px 0;font-size:12px;color:var(--mut)}.hcard .t{display:flex;justify-content:space-between;gap:6px;font-family:Cinzel,serif;font-weight:700;color:var(--acc);font-size:12px}
.tag{font:700 9px monospace;text-transform:uppercase;padding:1px 5px;border:1px solid var(--line);border-radius:4px;color:var(--mut)}
.x{background:none;border:0;color:var(--mut);cursor:pointer}.x:hover{color:#e05555}
.sl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px;min-height:28px}.sl>span.k{width:62px;font-size:11px;color:var(--mut);font-family:Cinzel,serif}
.hint{display:none;margin:4px 0;padding:5px 8px;border-radius:6px;background:var(--card2);border:1px dashed var(--acc);font-size:12px}
[data-arm] .hint{display:block}
[data-arm=attr] .node,[data-arm=per] .prow,[data-arm=hab] .hcard.el{cursor:crosshair;animation:pl 1.2s infinite}
[data-arm] .node input,[data-arm] .prow input{pointer-events:none}
@keyframes pl{50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 35%,transparent)}}
.pool{display:flex;justify-content:space-between;font:600 12px monospace;background:var(--card2);padding:5px 8px;border-radius:6px;margin:6px 0}
.out{margin-top:8px;padding:8px;border:1px solid var(--acc);border-radius:8px;background:var(--card2)}.tot{font:700 30px Cinzel,serif;color:var(--acc)}
.die{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:5px;font:700 11px monospace;margin:2px 2px 0 0;opacity:.55}.die.pk{opacity:1;border-color:var(--acc);color:var(--acc)}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}.ov[hidden]{display:none}.mod{width:min(440px,100%);max-height:85vh;overflow:auto;margin:0}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer}.sw.on{border-color:var(--txt)}
#toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);background:var(--acc);color:var(--on);padding:6px 14px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:10;font-weight:600}#toast.show{opacity:1;transform:translate(-50%,0)}
.mut{color:var(--mut);font-size:12px;font-style:italic}
</style>
</head>
<body>
<header class="card head">
  <div style="display:flex;gap:8px;align-items:center"><input class="nome" id="nome" placeholder="Nome do personagem"><button class="btn" onclick="openCfg()" title="Aparência">⚙ Aparência</button></div>
  <div class="rz">
    <label>Tipo</label>
    <select id="tipo"><option value="singular">Raiz Singular (misto)</option><option value="heranca">Herança Singular</option><option value="dupla">Raiz Dupla</option><option value="auto">Autodidata (Órfão)</option></select>
    <label id="l1">Raiz principal</label><select id="r1"></select>
    <label id="l2">Secundária</label><select id="r2"></select>
    <span class="chip" id="bonus"></span>
  </div>
</header>

<div class="cols" id="cols"><div class="col"></div><div class="col"></div><div class="col"></div></div>

<div id="store" hidden>
  <section class="card blk" id="b-recursos"><h2><span class="grip">⠿</span>Recursos de Vida</h2><div id="res"></div></section>
  <section class="card blk" id="b-atributos"><h2><span class="grip">⠿</span>Sigilo de Atributos</h2><div class="wheel" id="wheel"></div></section>
  <section class="card blk" id="b-teste"><h2><span class="grip">⠿</span>Motor de Teste<span class="r mut">d20s</span></h2>
    <div class="sl"><span class="k">Atributos</span><span id="s-attr"></span><button class="btn" data-add="attr">+ Atributo</button></div>
    <div class="sl"><span class="k">Perícia</span><span id="s-per"></span><button class="btn" data-add="per">+ Perícia</button></div>
    <div class="sl"><span class="k">Habilidade</span><span id="s-hab"></span><button class="btn" data-add="hab">+ Habilidade</button></div>
    <div class="hint" id="hint"></div>
    <div class="pool"><span id="pool"></span><span id="cost"></span></div>
    <div style="display:flex;gap:6px"><button class="btn pri" style="flex:1;padding:6px" onclick="roll()">🎲 Girar Teste</button><button class="btn" onclick="saveMacro()" title="Salvar como macro">🔖</button><button class="btn" onclick="clearSel()" title="Limpar">✕</button></div>
    <div class="out" id="out" hidden></div>
  </section>
  <section class="card blk" id="b-macros"><h2><span class="grip">⠿</span>Macros<span class="r mut">1 clique</span></h2><div id="macros"></div></section>
  <section class="card blk" id="b-pericias"><h2><span class="grip">⠿</span>Perícias<span class="r"><button class="btn" onclick="openPer()">+ Nova</button></span></h2><div id="pericias"></div></section>
  <section class="card blk" id="b-habilidades"><h2><span class="grip">⠿</span>Habilidades<span class="r"><button class="btn" onclick="openHab()">+ Aprender</button></span></h2><div id="habs"></div></section>
</div>

<div class="ov" id="modal" hidden><div class="card mod"><h2 id="mt"></h2><div id="mb"></div><div style="text-align:right;margin-top:8px"><button class="btn" onclick="closeM()">Fechar</button></div></div></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const ATTRS=[['potencia','POT','r'],['vigor','VIG','r'],['destreza','DES','r'],['percepcao','PER','b'],['erudicao','ERU','b'],['autoridade','AUT','p'],['impeto','ÍMP','p']];
const Z={hp:0,san:0,pef:0,pem:0};
// Bônus de Raiz (livro de regras): [HP, SAN, PE-F, PE-M]
const RAIZ={'Lenhador':[6,0,2,0],'Ferreiro':[4,0,2,2],'Guarda / Vigia':[4,2,2,0],'Caçador':[2,0,4,2],'Carpinteiro':[2,0,4,2],'Cozinheiro / Padeiro':[2,2,2,2],'Pastor / Criador':[2,4,2,0],'Mercador':[0,2,2,4],'Curandeiro':[0,4,0,4],'Escriba / Devoto':[0,6,0,2]};
const ORFAO=[2,-2,2,2];
const SLOTS={singular:2,heranca:1,dupla:2,auto:0}; // quantas raízes cada tipo permite
const RES=[['hp','HP','#d64545'],['san','SAN','#9b59d0'],['pef','PE-F (Físico)','#e0a030'],['pem','PE-M (Mental)','#3da5d9']];
const PERICIAS=["Sobrevivência","Furtividade","Encontrar","Atletismo","Tenacidade","Luta","Pontaria","Defesa","Reflexo","Investigação","Erudição","Doutrina","Sigilos","Ferramentas","Medicina","Culinária","Improviso","Persuasão","Enganação","Intimidação","Intuição","Vontade"];
const HABS=[
{id:'hab_tronco_calejado',nome:'Tronco Calejado',cat:'estatistico',f:0,m:0,desc:'Anos de labuta calejaram seus músculos. Soma +6 no HP máximo.',ef:{k:'hp',v:6}},
{id:'hab_folego_inabalavel',nome:'Fôlego Inabalável',cat:'estatistico',f:0,m:0,desc:'Expande a estamina física. Soma +3 no PE-F máximo.',ef:{k:'pef',v:3}},
{id:'hab_corte_profundo',nome:'Corte Profundo',cat:'ativo',f:1,m:0,desc:'Um golpe rasgante. +2 no teste de Luta.',ef:{k:'luta',v:2}},
{id:'hab_mira_focada',nome:'Mira Focada',cat:'ativo',f:0,m:1,desc:'Regula o fôlego antes de disparar. +3 no teste de Pontaria.',ef:{k:'pontaria',v:3}},
{id:'hab_aparo_com_cabo',nome:'Aparo com Cabo',cat:'reativo',f:1,m:0,desc:'Interpõe a ferramenta para absorver o golpe. +2 na Defesa.',ef:{k:'defesa',v:2}},
{id:'hab_sutura_emergencia',nome:'Sutura de Emergência',cat:'tecnico',f:0,m:0,desc:'Permite suturas cirúrgicas de emergência.',ef:null,teste:{nome:'Sutura de Emergência',attrs:['erudicao','destreza'],per:'Medicina'}}
];
const DEF_LAYOUT=[['recursos','atributos'],['teste','macros'],['pericias','habilidades']];
const DEF_P=()=>({nome:'',tipo:'heranca',r1:'Lenhador',r2:'',
 attr:{potencia:2,vigor:2,destreza:1,percepcao:2,erudicao:0,autoridade:1,impeto:1},cur:{},
 per:{Luta:2,Atletismo:2,Tenacidade:1},habs:['hab_tronco_calejado','hab_corte_profundo'],
 macros:[{nome:'Ataque Machado',attrs:['potencia','destreza'],per:'Luta',hab:'hab_corte_profundo'},{nome:'Escalar',attrs:['potencia','vigor'],per:'Atletismo',hab:null}]});
let P=DEF_P(),layout=DEF_LAYOUT,theme='dark',pal='ouro',armed=null,sel={attrs:[],per:null,hab:null};
const SG={hp:-1,san:-1,pef:-1,pem:-1};

try{const s=JSON.parse(localStorage.getItem('pantheon_ficha_v2'));if(s){P=Object.assign(DEF_P(),s.P);layout=s.layout||layout;theme=s.theme||theme;pal=s.pal||pal}}catch(e){}
function save(){try{localStorage.setItem('pantheon_ficha_v2',JSON.stringify({P,layout,theme,pal}))}catch(e){}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
const lbl=k=>ATTRS.find(a=>a[0]===k)[1];

/* ---------- aparência ---------- */
const PALS={ouro:40,carmesim:355,esmeralda:150,safira:210,violeta:270};
function applyLook(){document.documentElement.dataset.theme=theme;document.documentElement.dataset.pal=pal}
function openCfg(){
 $('#mt').textContent='Aparência';
 $('#mb').innerHTML=`<p class="mut" style="margin:0 0 4px">Tema</p><div style="display:flex;gap:6px;margin-bottom:12px">
 ${['dark','light'].map(t=>`<button class="btn ${theme===t?'on':''}" onclick="theme='${t}';applyLook();save();openCfg()">${t==='dark'?'🌙 Escuro':'☀ Claro'}</button>`).join('')}</div>
 <p class="mut" style="margin:0 0 4px">Paleta</p><div style="display:flex;gap:8px;margin-bottom:12px">
 ${Object.entries(PALS).map(([n,h])=>`<div class="sw ${pal===n?'on':''}" title="${n}" style="background:hsl(${h} 62% 50%)" onclick="pal='${n}';applyLook();save();openCfg()"></div>`).join('')}</div>
 <button class="btn" onclick="layout=DEF_LAYOUT;buildCols();save();closeM()">↺ Restaurar layout dos blocos</button>`;
 $('#modal').hidden=false}
function openM(t,h){$('#mt').textContent=t;$('#mb').innerHTML=h;$('#modal').hidden=false}
function closeM(){$('#modal').hidden=true}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};

/* ---------- blocos arrastáveis ---------- */
function buildCols(){
 const cols=[...document.querySelectorAll('.col')],store=$('#store'),all=[...document.querySelectorAll('.blk')];
 const used=new Set();
 layout.forEach((ids,i)=>ids.forEach(id=>{const b=$('#b-'+id);if(b&&cols[i]){cols[i].appendChild(b);used.add(b)}}));
 all.forEach(b=>{if(!used.has(b))cols[0].appendChild(b)});
}
function saveLayout(){layout=[...document.querySelectorAll('.col')].map(c=>[...c.querySelectorAll('.blk')].map(b=>b.id.slice(2)));save()}
function initDnD(){
 document.querySelectorAll('.blk').forEach(b=>{
  const g=b.querySelector('.grip');
  g.onmousedown=()=>b.draggable=true;
  b.ondragstart=e=>{b.classList.add('dragging');e.dataTransfer.effectAllowed='move'};
  b.ondragend=()=>{b.classList.remove('dragging');b.draggable=false;document.querySelectorAll('.col').forEach(c=>c.classList.remove('over'));saveLayout()};
 });
 document.querySelectorAll('.col').forEach(c=>{
  c.ondragover=e=>{e.preventDefault();const d=document.querySelector('.dragging');if(!d)return;
   document.querySelectorAll('.col').forEach(x=>x.classList.toggle('over',x===c));
   const after=[...c.querySelectorAll('.blk:not(.dragging)')].find(b=>{const r=b.getBoundingClientRect();return e.clientY<r.top+r.height/2});
   c.insertBefore(d,after||null)};
 });
}

/* ---------- cabeçalho / raízes ---------- */
function bonusRaiz(){return P.tipo==='auto'?ORFAO:(RAIZ[P.r1]||[0,0,0,0])}
function buildHead(){
 const opts=(sel,blank)=>(blank?'<option value="">—</option>':'')+Object.keys(RAIZ).map(r=>`<option ${r===sel?'selected':''}>${r}</option>`).join('');
 $('#r1').innerHTML=opts(P.r1);$('#r2').innerHTML=opts(P.r2,true);$('#tipo').value=P.tipo;$('#nome').value=P.nome;
 const n=SLOTS[P.tipo];
 $('#r1').hidden=$('#l1').hidden=n<1;$('#r2').hidden=$('#l2').hidden=n<2;
 $('#l1').textContent=n>1?'Raiz principal':'Raiz';
 const b=bonusRaiz(),nm=['HP','SAN','PE-F','PE-M'];
 $('#bonus').textContent=(P.tipo==='auto'?'Órfão: ':'Bônus: ')+nm.map((x,i)=>`${x} ${b[i]>=0?'+':''}${b[i]}`).join(' · ');
}
$('#nome').oninput=e=>{P.nome=e.target.value;save()};
$('#tipo').onchange=e=>{P.tipo=e.target.value;if(SLOTS[P.tipo]<2)P.r2='';buildHead();recalc()};
$('#r1').onchange=e=>{P.r1=e.target.value;buildHead();recalc()};
$('#r2').onchange=e=>{P.r2=e.target.value;save()};

/* ---------- recursos ---------- */
function maxes(){
 const a=P.attr,b=bonusRaiz();
 const m={hp:10+a.vigor*3+b[0],san:10+a.impeto*3+b[1],pef:5+a.destreza+a.vigor+b[2],pem:5+a.impeto+a.erudicao+b[3]};
 P.habs.forEach(id=>{const h=HABS.find(x=>x.id===id);if(h&&h.cat==='estatistico'&&m[h.ef.k]!=null)m[h.ef.k]+=h.ef.v});
 return m}
let MAX={};
function buildRes(){
 $('#res').innerHTML=RES.map(([k,n,c])=>`<div class="res"><div class="rt"><span style="color:${c}">${n}</span><span id="v-${k}"></span></div>
 <div class="bar"><i id="b-${k}" style="background:${c}"></i></div>
 <div class="ctl"><button class="btn sg sub" id="sg-${k}" onclick="togSg('${k}')" title="Alternar subtrair / somar">−</button>
 <input type="number" min="0" id="in-${k}" placeholder="0" onkeydown="if(event.key==='Enter')applyRes('${k}')">
 <button class="btn pri" onclick="applyRes('${k}')">Aplicar</button><button class="btn" style="margin-left:auto" onclick="P.cur.${k}=MAX.${k};updRes();save()">Máx</button></div></div>`).join('');
}
function togSg(k){SG[k]*=-1;const b=$('#sg-'+k);b.textContent=SG[k]<0?'−':'+';b.className='btn sg '+(SG[k]<0?'sub':'add')}
function applyRes(k){const i=$('#in-'+k),v=Math.abs(parseInt(i.value)||0);if(!v)return;
 P.cur[k]=Math.min(MAX[k],Math.max(0,P.cur[k]+SG[k]*v));i.value='';updRes();save()}
function updRes(){RES.forEach(([k])=>{$('#v-'+k).textContent=`${P.cur[k]} / ${MAX[k]}`;$('#b-'+k).style.width=Math.max(0,P.cur[k]/MAX[k]*100)+'%'})}
function recalc(){
 MAX=maxes();RES.forEach(([k])=>{if(P.cur[k]==null||P.cur[k]>MAX[k])P.cur[k]=MAX[k]});
 updRes();$('#wsum').textContent=Object.values(P.attr).reduce((a,b)=>a+b,0);renderSel();save()}

/* ---------- roda de atributos ---------- */
function buildWheel(){
 const R=35,cx=50,cy=51.7,pts=ATTRS.map((a,i)=>{const t=i*2*Math.PI/7-Math.PI/2;return[cx+R*Math.cos(t),cy+R*Math.sin(t)]});
 let l='';pts.forEach((p,i)=>{const n=pts[(i+1)%7],s=pts[(i+2)%7];
  l+=`<line x1="${p[0]}" y1="${p[1]}" x2="${n[0]}" y2="${n[1]}" stroke-width="1.2"/><line x1="${p[0]}" y1="${p[1]}" x2="${s[0]}" y2="${s[1]}" stroke-width=".6" opacity=".4"/>`});
 $('#wheel').innerHTML=`<svg viewBox="0 0 100 100" stroke="var(--acc)" fill="none"><circle cx="${cx}" cy="${cy}" r="${R}" stroke-width=".4" opacity=".3"/>${l}</svg><div class="ctr"><b id="wsum"></b>total</div>`+
 ATTRS.map((a,i)=>`<div class="node" data-k="${a[0]}" style="left:${pts[i][0]}%;top:${pts[i][1]}%" title="${a[0]}"><b class="c-${a[2]}">${a[1]}</b><input type="number" min="0" max="9" value="${P.attr[a[0]]}"></div>`).join('');
 document.querySelectorAll('.node').forEach(n=>{
  n.onclick=()=>{if(armed==='attr')pickAttr(n.dataset.k)};
  n.querySelector('input').onchange=e=>{P.attr[n.dataset.k]=Math.max(0,parseInt(e.target.value)||0);e.target.value=P.attr[n.dataset.k];recalc()};
 });
}

/* ---------- perícias & habilidades ---------- */
function renderPer(){
 const ks=Object.keys(P.per);
 $('#pericias').innerHTML=ks.length?'':'<span class="mut">Nenhuma perícia.</span>';
 ks.forEach(n=>{const d=document.createElement('div');d.className='prow';d.dataset.n=n;
  d.innerHTML=`<span>${n}</span><span>+<input type="number" min="0" max="10" value="${P.per[n]}"> <button class="x" title="Remover">✕</button></span>`;
  d.onclick=()=>{if(armed==='per')pickPer(n)};
  d.querySelector('input').onchange=e=>{P.per[n]=Math.max(0,parseInt(e.target.value)||0);save();renderSel()};
  d.querySelector('.x').onclick=e=>{e.stopPropagation();delete P.per[n];if(sel.per===n)sel.per=null;renderPer();renderSel();save()};
  $('#pericias').appendChild(d)});
}
function renderHab(){
 $('#habs').innerHTML=P.habs.length?'':'<span class="mut">Nenhuma habilidade.</span>';
 P.habs.forEach(id=>{const h=HABS.find(x=>x.id===id);if(!h)return;
  const d=document.createElement('div');d.className='hcard'+(h.cat==='ativo'||h.cat==='reativo'?' el':'');d.dataset.id=id;
  d.innerHTML=`<div class="t"><span>${h.nome}</span><span class="tag">${h.cat}</span></div><p>${h.desc}</p>
  <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--mut)"><span>PE F:${h.f} / M:${h.m}</span><button class="x" style="font-size:11px">Esquecer</button></div>`;
  d.onclick=()=>{if(armed==='hab'){h.cat==='ativo'||h.cat==='reativo'?pickHab(id):toast('Só habilidades ativas ou reativas entram no teste.')}};
  d.querySelector('.x').onclick=e=>{e.stopPropagation();P.habs=P.habs.filter(x=>x!==id);if(sel.hab===id)sel.hab=null;renderHab();recalc()};
  $('#habs').appendChild(d)});
}
function openPer(){
 const rest=PERICIAS.filter(p=>!(p in P.per));
 openM('Adicionar perícia',rest.length?`<div style="display:flex;flex-wrap:wrap;gap:6px">${rest.map(p=>`<button class="btn" onclick="P.per['${p}']=1;renderPer();renderSel();save();openPer()">${p}</button>`).join('')}</div>`:'<span class="mut">Você já tem todas.</span>')}
function openHab(){
 openM('Catálogo de Habilidades',HABS.map(h=>{const has=P.habs.includes(h.id);
  return `<div class="hcard"><div class="t"><span>${h.nome}</span><span class="tag">${h.cat}</span></div><p>${h.desc}</p>
  <div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mut)"><span>PE F:${h.f} / M:${h.m}</span>${has?'<b style="color:#4cc36f">✓ Adquirida</b>':`<button class="btn pri" onclick="learn('${h.id}')">Aprender</button>`}</div></div>`}).join(''))}
function learn(id){const h=HABS.find(x=>x.id===id);P.habs.push(id);
 if(h.teste&&!P.macros.some(m=>m.hab===id))P.macros.push({nome:h.teste.nome,attrs:h.teste.attrs,per:h.teste.per,hab:id});
 renderHab();renderMacros();recalc();openHab()}

/* ---------- seleção para o teste (modo "adicionar") ---------- */
const HINTS={attr:'Clique em até 2 atributos na roda.',per:'Clique em uma perícia da lista.',hab:'Clique em uma habilidade ativa ou reativa.'};
function arm(k){armed=armed===k?null:k;
 if(armed==='attr'&&sel.attrs.length>=2){armed=null;toast('Já são 2 atributos. Remova um primeiro.')}
 if(armed)document.body.dataset.arm=armed;else delete document.body.dataset.arm;
 $('#hint').textContent=armed?HINTS[armed]+' (Esc cancela)':'';
 document.querySelectorAll('[data-add]').forEach(b=>b.classList.toggle('on',b.dataset.add===armed))}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>arm(b.dataset.add));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(armed)arm(armed);closeM()}});
function pickAttr(k){const i=sel.attrs.indexOf(k);if(i>=0)sel.attrs.splice(i,1);else sel.attrs.push(k);
 renderSel();if(sel.attrs.length>=2)arm('attr')}
function pickPer(n){sel.per=sel.per===n?null:n;renderSel();arm('per')}
function pickHab(id){sel.hab=sel.hab===id?null:id;renderSel();arm('hab')}
function clearSel(){sel={attrs:[],per:null,hab:null};if(armed)arm(armed);renderSel()}
function chip(t,fn){const c=document.createElement('span');c.className='chip';c.innerHTML=`${t} <button class="x">✕</button>`;c.querySelector('button').onclick=fn;return c}
function renderSel(){
 const A=$('#s-attr'),Pe=$('#s-per'),H=$('#s-hab');A.innerHTML=Pe.innerHTML=H.innerHTML='';
 sel.attrs=sel.attrs.filter(k=>P.attr[k]!=null);
 sel.attrs.forEach(k=>A.appendChild(chip(`${lbl(k)} <b>${P.attr[k]}</b>`,()=>pickAttr(k))));
 if(sel.per&&!(sel.per in P.per))sel.per=null;
 if(sel.hab&&!P.habs.includes(sel.hab))sel.hab=null;
 if(sel.per)Pe.appendChild(chip(`${sel.per} <b>+${P.per[sel.per]}</b>`,()=>{sel.per=null;renderSel()}));
 const h=sel.hab&&HABS.find(x=>x.id===sel.hab);
 if(h)H.appendChild(chip(`${h.nome} <b>+${h.ef?h.ef.v:0}</b>`,()=>{sel.hab=null;renderSel()}));
 document.querySelectorAll('.node').forEach(n=>n.classList.toggle('on',sel.attrs.includes(n.dataset.k)));
 document.querySelectorAll('.prow').forEach(n=>n.classList.toggle('on',n.dataset.n===sel.per));
 document.querySelectorAll('.hcard[data-id]').forEach(n=>n.classList.toggle('on',n.dataset.id===sel.hab));
 const s=sel.attrs.reduce((t,k)=>t+P.attr[k],0);
 $('#pool').innerHTML=!sel.attrs.length?'Escolha um atributo':s===0?'<span style="color:#e05555">DEFICIÊNCIA 2d20 (menor)</span>':`${s}d20 (maior)`;
 $('#cost').textContent=h?`Custo: ${h.f} PE-F / ${h.m} PE-M`:'Custo: 0 PE';
}

/* ---------- rolagem & macros ---------- */
function roll(){
 if(!sel.attrs.length)return toast('Adicione ao menos um atributo.');
 const h=sel.hab&&HABS.find(x=>x.id===sel.hab);
 if(h){if(P.cur.pef<h.f||P.cur.pem<h.m)return toast('PE insuficiente!');P.cur.pef-=h.f;P.cur.pem-=h.m;updRes();save()}
 const n=sel.attrs.reduce((t,k)=>t+P.attr[k],0),d20=()=>1+Math.floor(Math.random()*20),def=n===0;
 const dice=def?[d20(),d20()]:Array.from({length:n},d20),pk=def?Math.min(...dice):Math.max(...dice);
 const crit=(dice.filter(d=>d===20).length-dice.filter(d=>d===1).length)*2;
 const pv=sel.per?P.per[sel.per]||0:0,hb=h&&h.ef?h.ef.v:0,tot=pk+pv+hb+crit,first=dice.indexOf(pk);
 const o=$('#out');o.hidden=false;
 o.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:baseline"><span class="tot">${tot}</span><span class="tag" style="${crit>0?'color:#4cc36f':crit<0?'color:#e05555':''}">${crit>0?'Crítico +'+crit:crit<0?'Desastre '+crit:'Padrão'}</span></div>
 <div class="mut" style="font-style:normal;font-family:monospace">[${sel.attrs.map(lbl).join('+')}] d20:${pk} + Per:${pv} + Hab:${hb} + Crít:${crit}</div>
 <div>${dice.map((d,i)=>`<span class="die ${i===first?'pk':''}">${d}</span>`).join('')}</div>`;
}
function saveMacro(){
 if(!sel.attrs.length)return toast('Adicione ao menos um atributo.');
 const nm=prompt('Nome da macro:',`${sel.attrs.map(lbl).join(' + ')} (${sel.per||'Geral'})`);if(!nm)return;
 P.macros.push({nome:nm,attrs:[...sel.attrs],per:sel.per,hab:sel.hab});renderMacros();save()}
function renderMacros(){
 $('#macros').innerHTML=P.macros.length?'':'<span class="mut">Nenhuma macro salva.</span>';
 P.macros.forEach((m,i)=>{const d=document.createElement('div');d.className='mrow';
  d.innerHTML=`<div style="min-width:0"><div class="cz" style="font-size:12px;font-weight:700">${m.nome}</div><div class="mut" style="font-style:normal;font-family:monospace;font-size:10px">${m.attrs.map(lbl).join('+')}${m.per?' | '+m.per:''}</div></div>
  <span style="display:flex;gap:6px;align-items:center"><button class="btn pri">Rolar</button><button class="x" title="Excluir">🗑</button></span>`;
  d.querySelector('.pri').onclick=()=>{sel={attrs:[...m.attrs],per:m.per&&m.per in P.per?m.per:null,hab:m.hab&&P.habs.includes(m.hab)?m.hab:null};renderSel();roll()};
  d.querySelector('.x').onclick=()=>{P.macros.splice(i,1);renderMacros();save()};
  $('#macros').appendChild(d)});
}

/* ---------- init ---------- */
applyLook();buildHead();buildRes();buildWheel();renderPer();renderHab();renderMacros();buildCols();initDnD();recalc();
</script>
</body>
</html>
