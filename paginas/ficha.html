      const temOpcoes = (node.tipoRecompensa === 'atributo' || node.tipoRecompensa === 'ambiguo') && node.opcoesAmbiguas?.length >= 2;

      box.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap">
          <div>
            <b class="cz" style="color:var(--acc)">${node.titulo}</b> <span class="tag">${node.custoPontos || 1} PT</span>
            <p style="margin:2px 0; font-size:12px">${node.conteudo?.descricao || ''}</p>
            ${node.herancaSingular?.descricao ? `<p style="margin:2px 0; font-size:11px; color:var(--acc)">★ Herança Singular: ${node.herancaSingular.descricao}</p>` : ''}
          </div>
          <div style="display:flex; gap:6px; align-items:center">
            ${temOpcoes ? `
              <select id="sel-opt-amb">
                <option value="a">${node.opcoesAmbiguas[0].efeito}</option>
                <option value="b">${node.opcoesAmbiguas[1].efeito}</option>
              </select>
            ` : ''}
            <button class="btn pri" id="btn-exec-compra" ${st.st !== 'avail' ? 'disabled' : ''}>${st.msg}</button>
          </div>
        </div>
      `;

      if (st.st === 'avail') {
        getEl('#btn-exec-compra').onclick = async () => {
          const custo = parseInt(node.custoPontos) || 1;
          const upd = {
            pontosEvolucao: (fichaDoc.pontosEvolucao || 0) - custo,
            [`nosDesbloqueados.${arvore.id}`]: [...((fichaDoc.nosDesbloqueados || {})[arvore.id] || []), node.id]
          };
          if (temOpcoes) {
            const esc = getEl('#sel-opt-amb').value;
            const opt = node.opcoesAmbiguas.find(o => o.idOpcao === esc);
            if (opt?.attr && (computado.attr[opt.attr] || 0) >= computado.teto) {
              return mostrarToast(`Atributo já atingiu o teto (${computado.teto})!`);
            }
            upd[`escolhasAmbiguas.${node.id}`] = esc;
          }
          await updateDoc(doc(db, "fichas", fichaId), upd);
          box.hidden = true;
          mostrarToast(`"${node.titulo}" desbloqueado!`);
        };
      }
    }

    /* ---------- Histórico Lateral ---------- */
    function renderizarHistoricoLateral(lista) {
      const cont = getEl('#hist-list');
      cont.innerHTML = lista.length ? lista.map(r => `
        <div class="hist-item">
          <div style="display:flex; justify-content:space-between; align-items:baseline">
            <b class="cz" style="color:var(--acc); font-size:11px">${r.personagemNome || 'Personagem'}</b>
            <b class="cz" style="font-size:16px; color:var(--acc)">${r.total}</b>
          </div>
          <div style="font-size:11px">${r.descricao || ''}</div>
          <div class="mut" style="font-style:normal; font-family:monospace; font-size:10px">${r.detalhes || ''}</div>
        </div>
      `).join('') : '<span class="mut">Nenhuma rolagem ainda.</span>';
    }

    /* ---------- Inicialização e Listeners Tempo Real ---------- */
    function sincronizarTelaCompleta() {
      if (!mesaDados || !fichaDoc) return;
      RAIZES = mesaDados.raizesDisponiveis || {};
      regras = {
        ...REGRAS_PADRAO,
        ...(mesaDados.regras || {}),
        tetosPorEstagio: { ...REGRAS_PADRAO.tetosPorEstagio, ...(mesaDados.regras?.tetosPorEstagio || {}) }
      };
      computado = calcularEstadoFicha();
      maximosRecursos = computado.maxRec;

      aplicarVisual();
      construirCabecalho();
      atualizarValoresRecursos();
      construirRodaAtributos();
      renderizarPericias();
      renderizarHabilidades();
      renderizarInventario();
      renderizarMacros();
      renderizarSelecaoTeste();

      if (!getEl('#modal').hidden && getEl('#modal-box').classList.contains('mod-tree')) {
        renderizarArvoreNoModal();
      }
    }

    onAuthStateChanged(auth, (user) => {
      if (!user) return window.location.href = '../index.html';
      usuarioAtual = user;

      construirInterfaceRecursos();
      montarColunasLayout();
      inicializarDragAndDrop();

      onSnapshot(doc(db, "mesas", mesaId), (snap) => {
        if (!snap.exists()) return window.location.href = '../index.html';
        mesaDados = snap.data();
        sincronizarTelaCompleta();
      });

      onSnapshot(doc(db, "fichas", fichaId), (snap) => {
        if (!snap.exists()) return window.location.href = `mesa.html?id=${mesaId}`;
        fichaDoc = snap.data();
        sincronizarTelaCompleta();
      });

      const qRolagens = query(collection(db, "rolagens"), where("mesaId", "==", mesaId));
      onSnapshot(qRolagens, (snap) => {
        const lista = [];
        snap.forEach(d => lista.push(d.data()));
        lista.sort((a, b) => (b.criadoEm?.toMillis?.() || Date.now()) - (a.criadoEm?.toMillis?.() || Date.now()));
        renderizarHistoricoLateral(lista.slice(0, 25));
      });
    });
  </script>
