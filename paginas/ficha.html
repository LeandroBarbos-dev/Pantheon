<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" data-pal="ouro">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PANTHEON · Ficha</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Faustina:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* Variáveis Globais de Cores e Temas */
    :root {
      --h: 40;
      --acc: hsl(var(--h) 70% 50%);
      --on: #140f08;
      --bg: hsl(var(--h) 10% 2%);
      --card: hsl(var(--h) 15% 4%);
      --card2: hsl(var(--h) 20% 14%);
      --line: hsl(var(--h) 35% 30%);
      --txt: hsl(var(--h) 30% 85%);
      --mut: hsl(var(--h) 12% 58%);
    }

    [data-theme="light"] {
      --acc: hsl(var(--h) 65% 36%);
      --on: #fff;
      --bg: hsl(var(--h) 35% 91%);
      --card: hsl(var(--h) 40% 97%);
      --card2: hsl(var(--h) 30% 90%);
      --line: hsl(var(--h) 25% 76%);
      --txt: hsl(var(--h) 30% 12%);
      --mut: hsl(var(--h) 15% 38%);
    }

    /* Paletas de Cor Primária */
    [data-pal="carmesim"] { --h: 355; }
    [data-pal="esmeralda"] { --h: 150; }
    [data-pal="safira"] { --h: 210; }
    [data-pal="violeta"] { --h: 270; }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 12px;
      background: var(--bg);
      color: var(--txt);
      font-family: Faustina, Georgia, serif;
      font-size: 14px;
      line-height: 1.35;
    }

    .cz, h2, .btn, .nome-personagem { font-family: Cinzel, Georgia, serif; }

    /* Cartões e Blocos Layout */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--acc);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .blk.minimized h2 { margin-bottom: 0; }
    .blk.minimized .blk-body { display: none; }

    .grip {
      cursor: grab;
      color: var(--mut);
      user-select: none;
      font-size: 15px;
    }

    .r {
      margin-left: auto;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* Formulários e Controles */
    button, input, select { font: inherit; color: inherit; }

    .btn {
      background: var(--card2);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 3px 9px;
      cursor: pointer;
      font-size: 11px;
    }

    .btn:hover:not(:disabled), .btn.on {
      border-color: var(--acc);
      color: var(--acc);
    }

    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn.pri {
      background: var(--acc) !important;
      color: var(--on) !important;
      border-color: var(--acc) !important;
      font-weight: 700;
    }

    input, select {
      background: var(--card2);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 3px 6px;
      min-width: 0;
    }

    input:focus, select:focus { outline: none; border-color: var(--acc); }
    input:disabled, select:disabled { opacity: 0.65; cursor: not-allowed; }
    input[type=number] { -moz-appearance: textfield; }
    input::-webkit-inner-spin-button, input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

    /* Cabeçalho */
    .head { display: grid; gap: 8px; }

    .nome-personagem {
      font-size: 22px;
      font-weight: 700;
      width: 100%;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      color: var(--acc);
      padding: 2px 0;
    }

    .rz {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      font-size: 12px;
    }

    .rz label { color: var(--mut); }

    .chip {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      padding: 2px 8px;
      border-radius: 99px;
      border: 1px solid var(--line);
      background: var(--card2);
      font: 600 11px monospace;
    }

    /* Layout Principal + Barra Lateral de Histórico */
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 290px;
      gap: 12px;
      align-items: start;
    }

    .workspace.no-hist { grid-template-columns: minmax(0, 1fr); }
    .workspace.no-hist .hist-side { display: none; }

    @media (max-width: 1120px) {
      .workspace { grid-template-columns: 1fr; }
    }

    /* Grid de Colunas Arrastáveis */
    .cols {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      align-items: start;
    }

    .col { min-height: 80px; }

    @media (max-width: 900px) {
      .cols { grid-template-columns: 1fr; }
    }

    .dragging { opacity: 0.4; }
    .col.over { outline: 1px dashed var(--acc); outline-offset: 4px; }

    /* Histórico Lateral */
    .hist-side { position: sticky; top: 12px; }
    .hist-list {
      max-height: 72vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .hist-item {
      background: var(--card2);
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 6px 8px;
      font-size: 12px;
    }

    /* Barras de Recursos */
    .res { margin-bottom: 10px; }
    .rt { display: flex; justify-content: space-between; font: 700 12px monospace; }
    .bar {
      height: 9px;
      border-radius: 5px;
      background: var(--card2);
      border: 1px solid var(--line);
      overflow: hidden;
      margin-top: 2px;
    }
    .bar i { display: block; height: 100%; transition: width 0.25s; }
    .ctl { display: flex; gap: 4px; margin-top: 5px; }
    .ctl input { width: 64px; text-align: center; }
    .sg { width: 28px; font-weight: 700; padding: 0; }
    .sg.add { color: #4cc36f; }
    .sg.sub { color: #e05555; }

    /* Sigilo / Roda de Atributos */
    .wheel {
      position: relative;
      width: min(100%, 300px);
      aspect-ratio: 1;
      margin: 4px auto;
    }
    .wheel svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .ctr {
      position: absolute;
      left: 50%;
      top: 51.7%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: var(--mut);
      font-size: 10px;
      line-height: 1.1;
    }
    .ctr b { display: block; font: 700 20px Cinzel, serif; color: var(--acc); }

    .node {
      position: absolute;
      width: 19%;
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: var(--card);
      border: 2px solid var(--acc);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      box-shadow: 0 2px 8px #0006;
    }
    .node b { font: 700 9px Cinzel, serif; letter-spacing: 0.04em; }
    .node input {
      width: 70%;
      text-align: center;
      background: transparent;
      border: 0;
      font: 700 17px Cinzel, serif;
      padding: 0;
      color: var(--txt);
    }
    .c-r { color: #e06a5a; }
    .c-b { color: #4fb0e0; }
    .c-p { color: #b480e6; }
    .node.on { background: var(--acc); }
    .node.on b, .node.on input { color: var(--on); }

    /* Perícias, Habilidades, Inventário e Macros */
    .prow, .hcard, .mrow {
      background: var(--card2);
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 5px 8px;
      margin-bottom: 5px;
      font-size: 13px;
    }
    .prow, .mrow {
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: space-between;
    }
    .prow.on, .hcard.on {
      border-color: var(--acc);
      box-shadow: 0 0 0 1px var(--acc);
    }
    .hcard p { margin: 2px 0; font-size: 12px; color: var(--mut); }
    .hcard .t {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      font-family: Cinzel, serif;
      font-weight: 700;
      color: var(--acc);
      font-size: 12px;
    }
    .tag {
      font: 700 9px monospace;
      text-transform: uppercase;
      padding: 1px 5px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--mut);
    }
    .x { background: none; border: 0; color: var(--mut); cursor: pointer; }
    .x:hover { color: #e05555; }

    /* Motor de Teste */
    .sl {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 6px;
      min-height: 28px;
    }
    .sl > span.k {
      width: 66px;
      font-size: 11px;
      color: var(--mut);
      font-family: Cinzel, serif;
    }
    .hint {
      display: none;
      margin: 4px 0;
      padding: 5px 8px;
      border-radius: 6px;
      background: var(--card2);
      border: 1px dashed var(--acc);
      font-size: 12px;
    }
    [data-arm] .hint { display: block; }
    [data-arm=attr] .node,
    [data-arm=per] .prow,
    [data-arm=hab] .hcard.el {
      cursor: crosshair;
      animation: pulsarm 1.2s infinite;
    }
    [data-arm] .node input { pointer-events: none; }

    @keyframes pulsarm {
      50% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 35%, transparent); }
    }

    .pool {
      display: flex;
      justify-content: space-between;
      font: 600 12px monospace;
      background: var(--card2);
      padding: 5px 8px;
      border-radius: 6px;
      margin: 6px 0;
    }
    .out {
      margin-top: 8px;
      padding: 8px;
      border: 1px solid var(--acc);
      border-radius: 8px;
      background: var(--card2);
    }
    .tot { font: 700 30px Cinzel, serif; color: var(--acc); }
    .die {
      display: inline-flex;
      width: 24px;
      height: 24px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 5px;
      font: 700 11px monospace;
      margin: 2px 2px 0 0;
      opacity: 0.55;
    }
    .die.pk { opacity: 1; border-color: var(--acc); color: var(--acc); }

    /* Modal e Toasts */
    .ov {
      position: fixed;
      inset: 0;
      background: #000b;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 9;
    }
    .ov[hidden] { display: none; }
    .mod {
      width: min(500px, 100%);
      max-height: 88vh;
      overflow: auto;
      margin: 0;
    }
    .mod.mod-tree {
      width: min(1150px, 98vw);
      height: 88vh;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
    }

    /* Visualizador de Árvores na Ficha */
    .tree-view-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: grab;
      user-select: none;
    }
    .tree-view-wrap.panning { cursor: grabbing; }
    .tree-stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
    .tree-grid { position: absolute; left: 320px; top: 320px; display: flex; flex-direction: column; gap: 82px; padding: 30px 0; }
    .tree-lvl { position: relative; height: 72px; width: 100%; }
    .tnode {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      width: 175px;
      min-height: 56px;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--card);
      cursor: pointer;
      font-size: 12px;
    }
    .tnode.done { border-color: #4cc36f; background: color-mix(in srgb, #4cc36f 14%, var(--card)); }
    .tnode.avail { border-color: var(--acc); box-shadow: 0 0 10px color-mix(in srgb, var(--acc) 35%, transparent); }
    .tnode.lock { opacity: 0.52; }
    .tnode.block { border-color: #e05555; opacity: 0.55; }

    .sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; }
    .sw.on { border-color: var(--txt); }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translate(-50%, 20px);
      background: var(--acc);
      color: var(--on);
      padding: 6px 14px;
      border-radius: 8px;
      opacity: 0;
      transition: 0.2s;
      pointer-events: none;
      z-index: 20;
      font-weight: 600;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    .mut { color: var(--mut); font-size: 12px; font-style: italic; }

    .sigla-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px; font-size: 12px; }
    .sigla-item { background: var(--card2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
    .sigla-item b { color: var(--acc); font-family: monospace; }
  </style>
</head>

<body>

  <!-- Cabeçalho Principal -->
  <header class="card head">
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap">
      <a id="btn-voltar" href="../index.html" class="btn" style="text-decoration:none">← Mesa</a>
      <input class="nome-personagem" id="nome" placeholder="Nome do personagem" style="flex:1; min-width:180px">
      <span class="chip" id="badge-etapa">Carregando...</span>
      <button class="btn pri" id="btn-finalizar" hidden onclick="finalizarCriacaoFicha()">🔒 Finalizar Criação</button>
      <button class="btn on" id="btn-arvores" onclick="abrirModalArvores()">🌳 Árvores (<span id="pt-badge">0</span> PT)</button>
      <button class="btn" onclick="abrirModalDescanso()" title="Descanso">🏕 Descanso</button>
      <button class="btn" onclick="abrirLegendaSiglas()" title="Legenda das siglas">? Siglas</button>
      <button class="btn" id="btn-toggle-hist" onclick="alternarHistoricoLateral()">📜 Histórico</button>
      <button class="btn" onclick="abrirConfiguracaoAparencia()" title="Aparência">⚙ Aparência</button>
    </div>

    <div class="rz">
      <label for="tipo">Tipo</label>
      <select id="tipo">
        <option value="singular">Raiz Singular (misto)</option>
        <option value="heranca">Herança Singular</option>
        <option value="dupla">Raiz Dupla</option>
        <option value="auto">Autodidata (Órfão)</option>
      </select>
      <label id="lbl-raiz1" for="raiz1">Raiz principal</label>
      <select id="raiz1"></select>
      <label id="lbl-raiz2" for="raiz2">Secundária</label>
      <select id="raiz2"></select>
      <span class="chip" id="bonus-raiz"></span>
      <span class="chip" id="chip-status-derivados">RD: 0 · DESL: 5m · Teto: 2</span>
    </div>

    <!-- Passatempos Infantis (Editáveis na Criação) -->
    <div id="box-passatempos" class="rz" style="border-top:1px solid var(--line); padding-top:6px"></div>
  </header>

  <!-- Área Principal (Colunas Arrastáveis + Histórico Lateral Recolhível) -->
  <div class="workspace" id="workspace">
    <div class="cols" id="cols">
      <div class="col"></div>
      <div class="col"></div>
      <div class="col"></div>
    </div>

    <!-- Lateral de Histórico de Rolagens -->
    <aside class="card hist-side" id="hist-side">
      <h2>
        📜 Histórico da Mesa
        <span class="r">
          <button class="btn" onclick="alternarHistoricoLateral()" title="Esconder histórico">✕</button>
        </span>
      </h2>
      <div class="hist-list" id="hist-list">
        <span class="mut">Carregando rolagens...</span>
      </div>
    </aside>
  </div>

  <!-- Blocos de Conteúdo (Gerenciados via JS) -->
  <div id="store" hidden>
    <section class="card blk" id="b-recursos">
      <h2>
        <span class="grip">⠿</span>Recursos de Vida
        <span class="r"><button class="btn min-btn" onclick="alternarMinBloco('recursos')">−</button></span>
      </h2>
      <div class="blk-body" id="res"></div>
    </section>

    <section class="card blk" id="b-atributos">
      <h2>
        <span class="grip">⠿</span>Sigilo de Atributos
        <span class="r">
          <span class="mut" id="info-pts-attr" style="font-style:normal; font-family:monospace; font-size:10px"></span>
          <button class="btn min-btn" onclick="alternarMinBloco('atributos')">−</button>
        </span>
      </h2>
      <div class="blk-body">
        <div class="wheel" id="wheel"></div>
      </div>
    </section>

    <section class="card blk" id="b-teste">
      <h2>
        <span class="grip">⠿</span>Motor de Teste
        <span class="r">
          <span class="mut">d20s</span>
          <button class="btn min-btn" onclick="alternarMinBloco('teste')">−</button>
        </span>
      </h2>
      <div class="blk-body">
        <div class="sl">
          <span class="k">Atributos</span>
          <span id="s-attr"></span>
          <button class="btn" data-add="attr">+ Atributo</button>
        </div>
        <div class="sl">
          <span class="k">Perícia</span>
          <span id="s-per"></span>
          <button class="btn" data-add="per">+ Perícia</button>
        </div>
        <div class="sl">
          <span class="k">Habilidade</span>
          <span id="s-hab"></span>
          <button class="btn" data-add="hab">+ Habilidade</button>
        </div>
        <div class="sl">
          <span class="k">Equip.</span>
          <select id="sel-equip-teste" style="flex:1; min-width:110px"></select>
          <select id="sel-modo-equip">
            <option value="ataque">⚔ GA×2</option>
            <option value="bloqueio">🛡 GD×2</option>
            <option value="none">Sem bônus</option>
          </select>
        </div>
        <div class="hint" id="hint"></div>
        <div class="pool">
          <span id="pool"></span>
          <span id="cost"></span>
        </div>
        <div style="display:flex; gap:6px">
          <button class="btn pri" style="flex:1; padding:6px" onclick="executarRolarDado()">🎲 Girar Teste</button>
          <button class="btn" id="btn-dano-arma" hidden onclick="rolarDanoArmaSelecionada()" title="Rolar dano da arma">💥 Dano</button>
          <button class="btn" onclick="salvarSelecaoComoMacro()" title="Salvar como macro">🔖</button>
          <button class="btn" onclick="limparSelecao()" title="Limpar">✕</button>
        </div>
        <div class="out" id="out" hidden></div>

        <!-- Rolador Livre Compacto -->
        <div style="display:flex; gap:4px; align-items:center; flex-wrap:wrap; margin-top:8px; padding-top:8px; border-top:1px solid var(--line)">
          <span class="mut" style="font-style:normal; font-size:11px">Livre:</span>
          <input type="number" id="lv-qtd" value="1" min="1" max="20" style="width:40px; text-align:center">
          <select id="lv-faces">
            <option value="4">d4</option>
            <option value="6" selected>d6</option>
            <option value="8">d8</option>
            <option value="10">d10</option>
            <option value="12">d12</option>
            <option value="16">d16</option>
            <option value="20">d20</option>
          </select>
          <input type="number" id="lv-mod" value="0" style="width:44px; text-align:center" title="Modificador">
          <select id="lv-modo">
            <option value="soma">Soma</option>
            <option value="maior">Maior</option>
            <option value="menor">Menor</option>
          </select>
          <button class="btn" onclick="executarDadoLivre()">Rolar</button>
        </div>
      </div>
    </section>

    <section class="card blk" id="b-macros">
      <h2>
        <span class="grip">⠿</span>Macros
        <span class="r">
          <span class="mut">1 clique</span>
          <button class="btn min-btn" onclick="alternarMinBloco('macros')">−</button>
        </span>
      </h2>
      <div class="blk-body" id="macros"></div>
    </section>

    <section class="card blk" id="b-pericias">
      <h2>
        <span class="grip">⠿</span>Perícias
        <span class="r">
          <span class="mut" style="font-size:10px">Passatempos & Árvores</span>
          <button class="btn min-btn" onclick="alternarMinBloco('pericias')">−</button>
        </span>
      </h2>
      <div class="blk-body" id="pericias"></div>
    </section>

    <section class="card blk" id="b-habilidades">
      <h2>
        <span class="grip">⠿</span>Habilidades
        <span class="r">
          <span class="mut" style="font-size:10px">Árvores & Itens</span>
          <button class="btn min-btn" onclick="alternarMinBloco('habilidades')">−</button>
        </span>
      </h2>
      <div class="blk-body" id="habs"></div>
    </section>

    <section class="card blk" id="b-inventario">
      <h2>
        <span class="grip">⠿</span>Inventário
        <span class="r">
          <button class="btn" onclick="abrirModalCatalogoItens()">+ Catálogo</button>
          <button class="btn min-btn" onclick="alternarMinBloco('inventario')">−</button>
        </span>
      </h2>
      <div class="blk-body">
        <div class="pool" id="slots-carga" style="font-size:11px; flex-wrap:wrap; gap:6px"></div>
        <div id="inv-list"></div>
      </div>
    </section>
  </div>

  <!-- Modal Genérico -->
  <div class="ov" id="modal" hidden>
    <div class="card mod" id="modal-box">
      <h2 id="modal-titulo"></h2>
      <div id="modal-conteudo" style="flex:1; min-height:0; display:flex; flex-direction:column"></div>
      <div style="text-align:right; margin-top:8px">
        <button class="btn" onclick="fecharModal()">Fechar</button>
      </div>
    </div>
  </div>

  <!-- Toast Notificação -->
  <div id="toast"></div>

  <script type="module">
    import {
      auth, db, onAuthStateChanged,
      doc, updateDoc, addDoc,
      collection, query, where, onSnapshot, serverTimestamp
    } from '../js/firebase-config.js';

    const params = new URLSearchParams(window.location.search);
    const mesaId = params.get('mesaId');
    const fichaId = params.get('fichaId');
    if (!mesaId || !fichaId) window.location.href = '../index.html';

    const getEl = selector => document.querySelector(selector);
    getEl('#btn-voltar').href = `mesa.html?id=${mesaId}`;

    const ATRIBUTOS = [
      ['potencia', 'POT', 'r'],
      ['vigor', 'VIG', 'r'],
      ['destreza', 'DES', 'r'],
      ['percepcao', 'PER', 'b'],
      ['erudicao', 'ERU', 'b'],
      ['autoridade', 'AUT', 'p'],
      ['impeto', 'ÍMP', 'p']
    ];

    const ESTRUTURA_RECURSOS = [
      ['hp', 'HP', '#d64545'],
      ['san', 'SAN', '#9b59d0'],
      ['pef', 'PE-F (Físico)', '#e0a030'],
      ['pem', 'PE-M (Mental)', '#3da5d9']
    ];

    const BONUS_ORFAO = [2, -2, 2, 2];
    const QTD_SLOTS_RAIZ = { singular: 2, heranca: 1, dupla: 1, auto: 0 };

    const LAYOUT_PADRAO = [
      ['recursos', 'atributos'],
      ['teste', 'macros'],
      ['pericias', 'habilidades', 'inventario']
    ];

    const REGRAS_PADRAO = {
      pontosAtributoIniciais: 5,
      estagioInicial: 1,
      tetosPorEstagio: { 1: 2, 2: 3, 3: 4, 4: 5 },
      pontosEvolucaoIniciais: 0,
      passatemposFocados: 1,
      passatemposMistos: 1,
      travaAscendenteCarga: true
    };

    // Estado Firebase
    let usuarioAtual = null;
    let mesaDados = null;
    let fichaDoc = null;
    let regras = { ...REGRAS_PADRAO };
    let RAIZES = {};
    let computado = null;

    // Preferências visuais locais do jogador
    let layoutAtual = LAYOUT_PADRAO;
    let temaAtual = 'dark';
    let paletaAtual = 'ouro';
    let blocosMinimizados = {};
    let historicoOculto = false;

    // Estado de interação
    let modoArmado = null;
    let selecaoTeste = { attrs: [], per: null, hab: null };
    let sinalRecursos = { hp: -1, san: -1, pef: -1, pem: -1 };
    let maximosRecursos = {};
    let arvoreAtivaId = null;
    let tZoom = 1, tPanX = 0, tPanY = 0;

    try {
      const prefs = JSON.parse(localStorage.getItem('pantheon_ui_prefs'));
      if (prefs) {
        layoutAtual = prefs.layout || layoutAtual;
        temaAtual = prefs.theme || temaAtual;
        paletaAtual = prefs.pal || paletaAtual;
        blocosMinimizados = prefs.min || {};
        historicoOculto = Boolean(prefs.histHide);
      }
    } catch (e) {}

    function salvarPrefsLocais() {
      try {
        localStorage.setItem('pantheon_ui_prefs', JSON.stringify({
          layout: layoutAtual,
          theme: temaAtual,
          pal: paletaAtual,
          min: blocosMinimizados,
          histHide: historicoOculto
        }));
      } catch (e) {}
    }

    function mostrarToast(mensagem) {
      const toast = getEl('#toast');
      toast.textContent = mensagem;
      toast.classList.add('show');
      clearTimeout(mostrarToast.timer);
      mostrarToast.timer = setTimeout(() => toast.classList.remove('show'), 2300);
    }

    const obterSiglaAtributo = chave => ATRIBUTOS.find(a => a[0] === chave)?.[1] || chave.toUpperCase();

    /* ---------- Aparência, Minimização e Histórico ---------- */
    const PALETAS_CORES = { ouro: 40, carmesim: 355, esmeralda: 150, safira: 210, violeta: 270 };

    function aplicarVisual() {
      document.documentElement.dataset.theme = temaAtual;
      document.documentElement.dataset.pal = paletaAtual;
      getEl('#workspace').classList.toggle('no-hist', historicoOculto);
      Object.entries(blocosMinimizados).forEach(([id, isMin]) => {
        const blk = getEl('#b-' + id);
        if (blk) {
          blk.classList.toggle('minimized', isMin);
          const btn = blk.querySelector('.min-btn');
          if (btn) btn.textContent = isMin ? '+' : '−';
        }
      });
    }

    window.alternarMinBloco = (id) => {
      blocosMinimizados[id] = !blocosMinimizados[id];
      aplicarVisual();
      salvarPrefsLocais();
    };

    window.alternarHistoricoLateral = () => {
      historicoOculto = !historicoOculto;
      aplicarVisual();
      salvarPrefsLocais();
    };

    window.abrirLegendaSiglas = () => {
      abrirModal('Legenda de Siglas do Sistema', `
        <div class="sigla-grid">
          <div class="sigla-item"><b>HP</b> — Pontos de Vida (Vitalidade física).</div>
          <div class="sigla-item"><b>SAN</b> — Sanidade (Estabilidade contra o Véu).</div>
          <div class="sigla-item"><b>PE-F</b> — Energia Física (Vigor e agilidade).</div>
          <div class="sigla-item"><b>PE-M</b> — Energia Mística / Mental.</div>
          <div class="sigla-item"><b>PT</b> — Pontos de Evolução das Árvores.</div>
          <div class="sigla-item"><b>GA / GD</b> — Grau de Ataque / Grau de Defesa.</div>
          <div class="sigla-item"><b>RD</b> — Redução de Dano (Armaduras).</div>
          <div class="sigla-item"><b>DESL</b> — Deslocamento em metros (5 + DES).</div>
        </div>
      `);
    };

    window.abrirConfiguracaoAparencia = () => {
      const botoesTema = ['dark', 'light'].map(t =>
        `<button class="btn ${temaAtual === t ? 'on' : ''}" onclick="mudarTema('${t}')">${t === 'dark' ? '🌙 Escuro' : '☀ Claro'}</button>`
      ).join('');

      const bolotasPaleta = Object.entries(PALETAS_CORES).map(([nome, hue]) =>
        `<div class="sw ${paletaAtual === nome ? 'on' : ''}" title="${nome}" style="background:hsl(${hue} 62% 50%)" onclick="mudarPaleta('${nome}')"></div>`
      ).join('');

      abrirModal('Aparência', `
        <p class="mut" style="margin:0 0 4px">Tema</p>
        <div style="display:flex; gap:6px; margin-bottom:12px">${botoesTema}</div>
        <p class="mut" style="margin:0 0 4px">Paleta</p>
        <div style="display:flex; gap:8px; margin-bottom:12px">${bolotasPaleta}</div>
        <button class="btn" onclick="restaurarLayout()">↺ Restaurar layout dos blocos</button>
      `);
    };

    window.mudarTema = (t) => { temaAtual = t; aplicarVisual(); salvarPrefsLocais(); abrirConfiguracaoAparencia(); };
    window.mudarPaleta = (p) => { paletaAtual = p; aplicarVisual(); salvarPrefsLocais(); abrirConfiguracaoAparencia(); };
    window.restaurarLayout = () => { layoutAtual = LAYOUT_PADRAO; montarColunasLayout(); salvarPrefsLocais(); fecharModal(); };

    function abrirModal(titulo, htmlConteudo, isTree = false) {
      getEl('#modal-box').classList.toggle('mod-tree', isTree);
      getEl('#modal-titulo').innerHTML = titulo;
      getEl('#modal-conteudo').innerHTML = htmlConteudo;
      getEl('#modal').hidden = false;
    }

    window.fecharModal = () => {
      getEl('#modal').hidden = true;
      getEl('#modal-box').classList.remove('mod-tree');
    };
    getEl('#modal').onclick = e => { if (e.target.id === 'modal') fecharModal(); };

    /* ---------- Drag & Drop do Layout ---------- */
    function montarColunasLayout() {
      const colunas = [...document.querySelectorAll('.col')];
      const blocos = [...document.querySelectorAll('.blk')];
      const usados = new Set();

      layoutAtual.forEach((idsBloco, i) => {
        idsBloco.forEach(id => {
          const bloco = getEl('#b-' + id);
          if (bloco && colunas[i]) {
            colunas[i].appendChild(bloco);
            usados.add(bloco);
          }
        });
      });

      blocos.forEach(bloco => {
        if (!usados.has(bloco)) colunas[0].appendChild(bloco);
      });
    }

    function salvarLayoutAtual() {
      layoutAtual = [...document.querySelectorAll('.col')].map(col =>
        [...col.querySelectorAll('.blk')].map(bloco => bloco.id.replace('b-', ''))
      );
      salvarPrefsLocais();
    }

    function inicializarDragAndDrop() {
      document.querySelectorAll('.blk').forEach(bloco => {
        const alca = bloco.querySelector('.grip');
        alca.onmousedown = () => bloco.draggable = true;
        bloco.ondragstart = e => {
          bloco.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        };
        bloco.ondragend = () => {
          bloco.classList.remove('dragging');
          bloco.draggable = false;
          document.querySelectorAll('.col').forEach(c => c.classList.remove('over'));
          salvarLayoutAtual();
        };
      });

      document.querySelectorAll('.col').forEach(col => {
        col.ondragover = e => {
          e.preventDefault();
          const blocoArrastando = document.querySelector('.dragging');
          if (!blocoArrastando) return;
          document.querySelectorAll('.col').forEach(c => c.classList.toggle('over', c === col));
          const proximoBloco = [...col.querySelectorAll('.blk:not(.dragging)')].find(b => {
            const rect = b.getBoundingClientRect();
            return e.clientY < rect.top + rect.height / 2;
          });
          col.insertBefore(blocoArrastando, proximoBloco || null);
        };
      });
    }

    /* ---------- Cálculo Consolidado da Ficha (Regras Pantheon) ---------- */
    function calcularEstadoFicha() {
      const f = fichaDoc;
      const h = f.raizesHeranca || { tipo: 'heranca', r1: '', r2: '' };
      const estagio = f.estagioBiologico || 1;
      const teto = f.tetoIndividualOverride || regras.tetosPorEstagio[estagio] || 2;

      const attrBase = {
        potencia: 0, vigor: 0, destreza: 0, percepcao: 0, erudicao: 0, autoridade: 0, impeto: 0,
        ...(f.atributosBase || {})
      };
      const attrArvore = { potencia: 0, vigor: 0, destreza: 0, percepcao: 0, erudicao: 0, autoridade: 0, impeto: 0 };
      const attrMaestria = { potencia: 0, vigor: 0, destreza: 0, percepcao: 0, erudicao: 0, autoridade: 0, impeto: 0 };

      (f.conversoesMaestria || []).forEach(c => {
        if (c.atributo && attrMaestria[c.atributo] !== undefined) attrMaestria[c.atributo] += 1;
      });

      const pericias = {}; // { Nome: { val, fontes } }
      const habilidades = [];
      const bonusRecArvore = { hp: 0, san: 0, pef: 0, pem: 0 };

      // 1. Nós desbloqueados nas Árvores
      const arvoresMesa = mesaDados?.arvores || [];
      Object.entries(f.nosDesbloqueados || {}).forEach(([arvId, nosIds]) => {
        const arv = arvoresMesa.find(a => a.id === arvId);
        if (!arv) return;
        const temSingular = h.tipo === 'heranca' && h.r1 === arv.raizAssociada;

        (nosIds || []).forEach(noId => {
          const no = (arv.nos || []).find(n => n.id === noId);
          if (!no) return;

          const singAtiva = temSingular && Boolean(no.herancaSingular);
          const bonusSing = singAtiva ? (parseInt(no.herancaSingular?.bonusExtra) || 0) : 0;
          const redPeSing = singAtiva ? (parseInt(no.herancaSingular?.reducaoPe) || 0) : 0;

          if (no.tipoRecompensa === 'atributo' || no.tipoRecompensa === 'ambiguo') {
            const esc = (f.escolhasAmbiguas || {})[no.id] || 'a';
            const opt = (no.opcoesAmbiguas || []).find(o => o.idOpcao === esc) || no.opcoesAmbiguas?.[0];
            if (opt?.attr && attrArvore[opt.attr] !== undefined) {
              attrArvore[opt.attr] += (parseInt(opt.val) || 1) + bonusSing;
            }
          }

          if (no.conteudo?.bonusPericia) {
            Object.entries(no.conteudo.bonusPericia).forEach(([pNome, pVal]) => {
              if (!pericias[pNome]) pericias[pNome] = { val: 0, fontes: [] };
              const add = (parseInt(pVal) || 0) + bonusSing;
              pericias[pNome].val += add;
              pericias[pNome].fontes.push(`${no.titulo} (+${add})`);
            });
          }

          if (no.tipoRecompensa === 'habilidade') {
            const c = no.conteudo || {};
            if (c.efTipo && ['hp', 'san', 'pef', 'pem'].includes(c.efTipo)) {
              bonusRecArvore[c.efTipo] += (parseInt(c.efVal) || 0) + bonusSing;
            }
            habilidades.push({
              id: no.id,
              nome: no.titulo,
              cat: c.cat || 'passivo',
              f: Math.max(0, (parseInt(c.f) || 0) - redPeSing),
              m: Math.max(0, (parseInt(c.m) || 0) - redPeSing),
              ef: c.efTipo === 'teste' ? { k: 'teste', v: (parseInt(c.efVal) || 0) + bonusSing } : null,
              critMod: parseInt(c.critMod) || 0,
              desc: singAtiva && no.herancaSingular?.descricao
                ? `${c.descricao || ''} [★ Herança: ${no.herancaSingular.descricao}]`
                : (c.descricao || '')
            });
          }
        });
      });

      // 2. Passatempos Infantis
      const pass = f.passatempos || { focados: [], mistos: [], extrasOrfao: [] };
      (pass.focados || []).forEach(pNome => {
        if (!pNome) return;
        if (!pericias[pNome]) pericias[pNome] = { val: 0, fontes: [] };
        pericias[pNome].val += 2;
        pericias[pNome].fontes.push('Focado (+2)');
      });
      (pass.mistos || []).forEach(par => {
        (par || []).forEach(pNome => {
          if (!pNome) return;
          if (!pericias[pNome]) pericias[pNome] = { val: 0, fontes: [] };
          pericias[pNome].val += 1;
          pericias[pNome].fontes.push('Misto (+1)');
        });
      });
      if (h.tipo === 'auto') {
        (pass.extrasOrfao || []).forEach(pNome => {
          if (!pNome) return;
          if (!pericias[pNome]) pericias[pNome] = { val: 0, fontes: [] };
          pericias[pNome].val += 1;
          pericias[pNome].fontes.push('Órfão (+1)');
        });
      }

      // 3. Conversão de Maestria (-5 perícia -> +1 atributo)
      (f.conversoesMaestria || []).forEach(c => {
        if (c.pericia && pericias[c.pericia]) {
          pericias[c.pericia].val = Math.max(0, pericias[c.pericia].val - 5);
          pericias[c.pericia].fontes.push('Maestria (-5)');
        }
      });

      // 4. Soma Final Atributos
      const attr = {};
      ATRIBUTOS.forEach(([k]) => {
        attr[k] = (attrBase[k] || 0) + (attrArvore[k] || 0) + (attrMaestria[k] || 0);
      });

      // 5. Recursos Máximos
      const b = h.tipo === 'auto' ? BONUS_ORFAO : (RAIZES[h.r1] || [0, 0, 0, 0]);
      const maxRec = {
        hp: 10 + attr.vigor * 3 + (b[0] || 0) + bonusRecArvore.hp,
        san: 10 + attr.impeto * 3 + (b[1] || 0) + bonusRecArvore.san,
        pef: 5 + attr.destreza + attr.vigor + (b[2] || 0) + bonusRecArvore.pef,
        pem: 5 + attr.impeto + attr.erudicao + (b[3] || 0) + bonusRecArvore.pem
      };

      // 6. Inventário (RD, Deslocamento e Habilidades de Itens Equipados)
      let rd = 0, penDesl = 0;
      (f.inventario || []).forEach(it => {
        if (!it.equipado) return;
        if (it.categoria === 'armadura') {
          rd += parseInt(it.rd) || 0;
          penDesl += parseInt(it.penalidadeDesl) || 0;
        }
        if (it.categoria === 'escudo' && it.peso === 'pesado') penDesl -= 1;
        if (it.habilidade?.nome) {
          habilidades.push({
            id: `item_${it.uid}`,
            nome: `${it.habilidade.nome} (${it.nome})`,
            cat: 'ativo',
            f: 0,
            m: 0,
            custoTxt: it.habilidade.custo || '',
            ef: null,
            critMod: 0,
            desc: it.habilidade.efeito || ''
          });
        }
      });

      return {
        estagio,
        teto,
        attrBase,
        attr,
        pericias,
        habilidades,
        maxRec,
        rd,
        desl: Math.max(1, 5 + attr.destreza + penDesl)
      };
    }

    /* ---------- Cabeçalho, Raízes e Passatempos ---------- */
    function construirCabecalho() {
      const f = fichaDoc;
      const travado = Boolean(f.criacaoFinalizada);
      const h = f.raizesHeranca || { tipo: 'heranca', r1: '', r2: '' };

      getEl('#nome').value = f.nome || '';
      getEl('#pt-badge').textContent = f.pontosEvolucao || 0;

      const badge = getEl('#badge-etapa');
      badge.textContent = travado ? '🔒 Finalizada' : '✏ Em Criação';
      getEl('#btn-finalizar').hidden = travado;

      const listaRaizes = Object.keys(RAIZES).filter(r => r !== 'Órfão');
      const gerarOpcoes = (selecionada, permitirVazio) =>
        (permitirVazio ? '<option value="">—</option>' : '') +
        listaRaizes.map(r => `<option value="${r}" ${r === selecionada ? 'selected' : ''}>${r}</option>`).join('');

      getEl('#raiz1').innerHTML = gerarOpcoes(h.r1, true);
      getEl('#raiz2').innerHTML = gerarOpcoes(h.r2, true);
      getEl('#tipo').value = h.tipo || 'heranca';

      getEl('#tipo').disabled = travado;
      getEl('#raiz1').disabled = travado;
      getEl('#raiz2').disabled = travado;

      const qtdSlots = QTD_SLOTS_RAIZ[h.tipo] ?? 1;
      getEl('#raiz1').hidden = getEl('#lbl-raiz1').hidden = qtdSlots < 1;
      getEl('#raiz2').hidden = getEl('#lbl-raiz2').hidden = qtdSlots < 2;
      getEl('#lbl-raiz1').textContent = qtdSlots > 1 ? 'Raiz principal' : 'Raiz';

      const bonus = h.tipo === 'auto' ? BONUS_ORFAO : (RAIZES[h.r1] || [0, 0, 0, 0]);
      const nomesStatus = ['HP', 'SAN', 'PE-F', 'PE-M'];
      getEl('#bonus-raiz').textContent = (h.tipo === 'auto' ? 'Órfão: ' : 'Bônus: ') +
        nomesStatus.map((nome, i) => `${nome} ${bonus[i] >= 0 ? '+' : ''}${bonus[i]}`).join(' · ');

      getEl('#chip-status-derivados').textContent = `RD: ${computado.rd} · DESL: ${computado.desl}m · Teto: ${computado.teto}`;

      // Passatempos Infantis
      const qtdFoc = regras.passatemposFocados || 0;
      const qtdMis = regras.passatemposMistos || 0;
      const pass = f.passatempos || { focados: [], mistos: [], extrasOrfao: [] };

      let htmlPass = `<label>Passatempos:</label>`;
      for (let i = 0; i < qtdFoc; i++) {
        htmlPass += `<input type="text" data-pfoc="${i}" value="${pass.focados?.[i] || ''}" ${travado ? 'disabled' : ''} placeholder="Focado #${i + 1} (+2)" style="width:135px">`;
      }
      for (let i = 0; i < qtdMis; i++) {
        const par = pass.mistos?.[i] || ['', ''];
        htmlPass += `<input type="text" data-pmis="${i}:0" value="${par[0] || ''}" ${travado ? 'disabled' : ''} placeholder="Misto A (+1)" style="width:110px">`;
        htmlPass += `<input type="text" data-pmis="${i}:1" value="${par[1] || ''}" ${travado ? 'disabled' : ''} placeholder="Misto B (+1)" style="width:110px">`;
      }
      if (h.tipo === 'auto') {
        for (let i = 0; i < 2; i++) {
          htmlPass += `<input type="text" data-porf="${i}" value="${pass.extrasOrfao?.[i] || ''}" ${travado ? 'disabled' : ''} placeholder="Órfão #${i + 1} (+1)" style="width:115px">`;
        }
      }
      getEl('#box-passatempos').innerHTML = htmlPass;

      if (!travado) {
        getEl('#box-passatempos').querySelectorAll('[data-pfoc]').forEach(inp => {
          inp.onchange = async () => {
            const arr = [...(fichaDoc.passatempos?.focados || [])];
            arr[parseInt(inp.dataset.pfoc)] = inp.value.trim();
            await updateDoc(doc(db, "fichas", fichaId), { "passatempos.focados": arr });
          };
        });
        getEl('#box-passatempos').querySelectorAll('[data-pmis]').forEach(inp => {
          inp.onchange = async () => {
            const [idx, pos] = inp.dataset.pmis.split(':').map(Number);
            const arr = JSON.parse(JSON.stringify(fichaDoc.passatempos?.mistos || []));
            if (!arr[idx]) arr[idx] = ['', ''];
            arr[idx][pos] = inp.value.trim();
            await updateDoc(doc(db, "fichas", fichaId), { "passatempos.mistos": arr });
          };
        });
        getEl('#box-passatempos').querySelectorAll('[data-porf]').forEach(inp => {
          inp.onchange = async () => {
            const arr = [...(fichaDoc.passatempos?.extrasOrfao || [])];
            arr[parseInt(inp.dataset.porf)] = inp.value.trim();
            await updateDoc(doc(db, "fichas", fichaId), { "passatempos.extrasOrfao": arr });
          };
        });
      }
    }

    getEl('#nome').onchange = async e => {
      const v = e.target.value.trim();
      if (v) await updateDoc(doc(db, "fichas", fichaId), { nome: v });
    };
    getEl('#tipo').onchange = async e => {
      const novoTipo = e.target.value;
      const upd = { "raizesHeranca.tipo": novoTipo };
      if ((QTD_SLOTS_RAIZ[novoTipo] ?? 1) < 2) upd["raizesHeranca.r2"] = '';
      await updateDoc(doc(db, "fichas", fichaId), upd);
    };
    getEl('#raiz1').onchange = async e => await updateDoc(doc(db, "fichas", fichaId), { "raizesHeranca.r1": e.target.value });
    getEl('#raiz2').onchange = async e => await updateDoc(doc(db, "fichas", fichaId), { "raizesHeranca.r2": e.target.value });

    window.finalizarCriacaoFicha = async () => {
      if (!confirm("Finalizar a criação da ficha? Atributos iniciais, raízes e passatempos ficarão travados.")) return;
      await updateDoc(doc(db, "fichas", fichaId), {
        criacaoFinalizada: true,
        recursosAtuais: { ...computado.maxRec }
      });
    };

    /* ---------- Recursos ---------- */
    function construirInterfaceRecursos() {
      getEl('#res').innerHTML = ESTRUTURA_RECURSOS.map(([chave, nome, cor]) => `
        <div class="res">
          <div class="rt"><span style="color:${cor}">${nome}</span><span id="v-${chave}"></span></div>
          <div class="bar"><i id="b-${chave}" style="background:${cor}"></i></div>
          <div class="ctl">
            <button class="btn sg sub" id="sg-${chave}" onclick="alternarSinalRecurso('${chave}')" title="Alternar subtrair / somar">−</button>
            <input type="number" min="0" id="in-${chave}" placeholder="0" onkeydown="if(event.key==='Enter') aplicarAlteracaoRecurso('${chave}')">
            <button class="btn pri" onclick="aplicarAlteracaoRecurso('${chave}')">Aplicar</button>
            <button class="btn" style="margin-left:auto" onclick="restaurarRecursoMax('${chave}')">Máx</button>
          </div>
        </div>
      `).join('');
    }

    window.alternarSinalRecurso = (chave) => {
      sinalRecursos[chave] *= -1;
      const btn = getEl('#sg-' + chave);
      btn.textContent = sinalRecursos[chave] < 0 ? '−' : '+';
      btn.className = 'btn sg ' + (sinalRecursos[chave] < 0 ? 'sub' : 'add');
    };

    window.aplicarAlteracaoRecurso = async (chave) => {
      const input = getEl('#in-' + chave);
      const valor = Math.abs(parseInt(input.value) || 0);
      if (!valor) return;
      input.value = '';

      const cur = obterRecursosAtuais();
      cur[chave] = Math.min(maximosRecursos[chave], Math.max(0, cur[chave] + sinalRecursos[chave] * valor));
      await updateDoc(doc(db, "fichas", fichaId), { recursosAtuais: cur });
    };

    window.restaurarRecursoMax = async (chave) => {
      const cur = obterRecursosAtuais();
      cur[chave] = maximosRecursos[chave];
      await updateDoc(doc(db, "fichas", fichaId), { recursosAtuais: cur });
    };

    function obterRecursosAtuais() {
      const r = fichaDoc.recursosAtuais || {};
      return {
        hp: r.hp ?? maximosRecursos.hp,
        san: r.san ?? maximosRecursos.san,
        pef: r.pef ?? maximosRecursos.pef,
        pem: r.pem ?? maximosRecursos.pem
      };
    }

    function atualizarValoresRecursos() {
      const cur = obterRecursosAtuais();
      ESTRUTURA_RECURSOS.forEach(([chave]) => {
        getEl('#v-' + chave).textContent = `${cur[chave]} / ${maximosRecursos[chave]}`;
        getEl('#b-' + chave).style.width = Math.max(0, (cur[chave] / maximosRecursos[chave]) * 100) + '%';
      });
    }

    /* ---------- Sigilo / Roda de Atributos ---------- */
    function construirRodaAtributos() {
      const raio = 35, centroX = 50, centroY = 51.7;
      const pontos = ATRIBUTOS.map((_, i) => {
        const angulo = i * 2 * Math.PI / 7 - Math.PI / 2;
        return [centroX + raio * Math.cos(angulo), centroY + raio * Math.sin(angulo)];
      });

      let linhasConexao = '';
      pontos.forEach((p, i) => {
        const proximo = pontos[(i + 1) % 7];
        const salto = pontos[(i + 2) % 7];
        linhasConexao += `<line x1="${p[0]}" y1="${p[1]}" x2="${proximo[0]}" y2="${proximo[1]}" stroke-width="1.2"/>
                          <line x1="${p[0]}" y1="${p[1]}" x2="${salto[0]}" y2="${salto[1]}" stroke-width=".6" opacity=".4"/>`;
      });

      const travado = Boolean(fichaDoc.criacaoFinalizada);
      const isOrfao = fichaDoc.raizesHeranca?.tipo === 'auto';
      const ptsMax = (regras.pontosAtributoIniciais || 5) + (isOrfao ? 1 : 0);
      const ptsGastos = Object.values(computado.attrBase).reduce((a, b) => a + (b || 0), 0);

      getEl('#info-pts-attr').textContent = travado
        ? `Teto ${computado.teto}`
        : `Pts: ${ptsMax - ptsGastos}/${ptsMax}`;

      const nosHtml = ATRIBUTOS.map((attr, i) => `
        <div class="node" data-k="${attr[0]}" style="left:${pontos[i][0]}%; top:${pontos[i][1]}%" title="${attr[0]} (Base: ${computado.attrBase[attr[0]]})">
          <b class="c-${attr[2]}">${attr[1]}</b>
          <input type="number" min="0" max="${computado.teto}" value="${computado.attr[attr[0]]}" ${travado ? 'disabled' : ''}>
        </div>
      `).join('');

      getEl('#wheel').innerHTML = `
        <svg viewBox="0 0 100 100" stroke="var(--acc)" fill="none">
          <circle cx="${centroX}" cy="${centroY}" r="${raio}" stroke-width=".4" opacity=".3"/>
          ${linhasConexao}
        </svg>
        <div class="ctr"><b id="wsum">${Object.values(computado.attr).reduce((a, b) => a + b, 0)}</b>total</div>
        ${nosHtml}
      `;

      document.querySelectorAll('.node').forEach(no => {
        no.onclick = () => { if (modoArmado === 'attr') selecionarAtributo(no.dataset.k); };
        const inp = no.querySelector('input');
        inp.onchange = async e => {
          if (travado) return;
          const key = no.dataset.k;
          const bonusNaoBase = computado.attr[key] - computado.attrBase[key];
          let novoTotal = Math.max(bonusNaoBase, Math.min(computado.teto, parseInt(e.target.value) || 0));
          let novoBase = novoTotal - bonusNaoBase;

          const outrosGastos = ptsGastos - (computado.attrBase[key] || 0);
          if (outrosGastos + novoBase > ptsMax) {
            novoBase = Math.max(0, ptsMax - outrosGastos);
            mostrarToast(`Limite de ${ptsMax} pontos de atributo iniciais!`);
          }
          await updateDoc(doc(db, "fichas", fichaId), { [`atributosBase.${key}`]: novoBase });
        };
      });
    }

    /* ---------- Perícias (Automáticas + Conversão de Maestria) ---------- */
    function renderizarPericias() {
      const chaves = Object.keys(computado.pericias);
      getEl('#pericias').innerHTML = chaves.length ? '' : '<span class="mut">Nenhuma perícia adquirida (preencha Passatempos ou evolua nas Árvores).</span>';

      chaves.forEach(nome => {
        const info = computado.pericias[nome];
        const div = document.createElement('div');
        div.className = 'prow';
        div.dataset.n = nome;
        div.title = info.fontes.join(' · ');
        div.innerHTML = `
          <span>${nome}</span>
          <span style="display:flex; align-items:center; gap:5px">
            <b style="font-family:monospace">+${info.val}</b>
            ${info.val >= 5 ? `<button class="btn pri" style="padding:1px 6px; font-size:10px" onclick="event.stopPropagation(); converterMaestria('${nome}')" title="Sacrificar 5 pts por +1 Atributo">5→+1</button>` : ''}
          </span>
        `;
        div.onclick = () => { if (modoArmado === 'per') selecionarPericia(nome); };
        getEl('#pericias').appendChild(div);
      });
    }

    window.converterMaestria = async (pericia) => {
      const disp = ATRIBUTOS.filter(([k]) => (computado.attr[k] || 0) < computado.teto);
      if (!disp.length) return mostrarToast(`Todos atributos estão no teto (${computado.teto})!`);

      const escolha = prompt(
        `Converter 5 pontos de "${pericia}" em +1 Atributo (Teto atual: ${computado.teto}):\n\nDigite a chave:\n` +
        disp.map(([k, sig]) => `${k} (${sig} - atual ${computado.attr[k]})`).join('\n')
      );
      if (!escolha) return;
      const key = escolha.trim().toLowerCase();
      if (!disp.some(([k]) => k === key)) return mostrarToast('Atributo inválido ou no teto.');

      const convs = [...(fichaDoc.conversoesMaestria || []), { pericia, atributo: key }];
      await updateDoc(doc(db, "fichas", fichaId), { conversoesMaestria: convs });
      mostrarToast(`+1 em ${obterSiglaAtributo(key)} via Maestria!`);
    };

    /* ---------- Habilidades (Árvores + Itens Equipados) ---------- */
    function renderizarHabilidades() {
      const lista = computado.habilidades;
      getEl('#habs').innerHTML = lista.length ? '' : '<span class="mut">Nenhuma habilidade desbloqueada.</span>';

      lista.forEach(hab => {
        const div = document.createElement('div');
        const elegivelTeste = hab.cat === 'ativo' || hab.cat === 'reativo' || Boolean(hab.ef) || Boolean(hab.critMod);
        div.className = 'hcard' + (elegivelTeste ? ' el' : '');
        div.dataset.id = hab.id;
        div.innerHTML = `
          <div class="t"><span>${hab.nome}</span><span class="tag">${hab.cat}</span></div>
          <p>${hab.desc}</p>
          <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--mut)">
            <span>${hab.custoTxt ? `Custo: ${hab.custoTxt}` : `PE F:${hab.f} / M:${hab.m}`}${hab.critMod ? ` · Crít ${hab.critMod}` : ''}</span>
            ${(hab.f > 0 || hab.m > 0) ? `<button class="btn" style="padding:1px 6px; font-size:10px" onclick="event.stopPropagation(); gastarPeHabilidade(${hab.f}, ${hab.m}, '${hab.nome.replace(/'/g, '')}')">Ativar</button>` : ''}
          </div>
        `;
        div.onclick = () => {
          if (modoArmado === 'hab') {
            elegivelTeste ? selecionarHabilidade(hab.id) : mostrarToast('Esta habilidade passiva não altera rolagens.');
          }
        };
        getEl('#habs').appendChild(div);
      });
    }

    window.gastarPeHabilidade = async (fCost, mCost, nome) => {
      const cur = obterRecursosAtuais();
      if (cur.pef < fCost || cur.pem < mCost) return mostrarToast('PE insuficiente!');
      cur.pef -= fCost;
      cur.pem -= mCost;
      await updateDoc(doc(db, "fichas", fichaId), { recursosAtuais: cur });
      mostrarToast(`"${nome}" ativada!`);
    };

    /* ---------- Inventário & Catálogo da Mesa ---------- */
    function renderizarInventario() {
      const vig = computado.attr.vigor || 0;
      const cap = { pesado: vig, medio: vig + 1, leve: vig + 2, miudeza: 10 };
      const inv = fichaDoc.inventario || [];
      const usados = { pesado: 0, medio: 0, leve: 0, miudeza: 0 };
      inv.forEach(it => { if (usados[it.peso] !== undefined) usados[it.peso]++; });

      getEl('#slots-carga').innerHTML = `
        <span>Pesado: ${usados.pesado}/${cap.pesado}</span>
        <span>Médio: ${usados.medio}/${cap.medio}</span>
        <span>Leve: ${usados.leve}/${cap.leve}</span>
        <span>Miud.: ${usados.miudeza}/${cap.miudeza}</span>
      `;

      const cont = getEl('#inv-list');
      cont.innerHTML = inv.length ? '' : '<span class="mut">Mochila vazia.</span>';

      inv.forEach(it => {
        const podeEquipar = ['arma', 'escudo', 'armadura'].includes(it.categoria);
        const div = document.createElement('div');
        div.className = 'hcard' + (it.equipado ? ' on' : '');
        div.innerHTML = `
          <div class="t"><span>${it.nome}</span><span class="tag">${it.peso}</span></div>
          <p>${it.descricao || ''}</p>
          <div style="display:flex; justify-content:space-between; align-items:center; font-size:11px; margin-top:4px">
            <span>
              ${podeEquipar ? `<button class="btn ${it.equipado ? 'pri' : ''}" onclick="alternarEquiparItem('${it.uid}')">${it.equipado ? '✓ Equipado' : 'Equipar'}</button>` : ''}
              ${it.categoria === 'cura' ? `<button class="btn pri" onclick="usarItemCura('${it.uid}')">🩹 Curar (${it.usosAtuais ?? it.usosMax}/${it.usosMax})</button>` : ''}
            </span>
            <button class="x" onclick="removerItemInventario('${it.uid}')">Remover</button>
          </div>
        `;
        cont.appendChild(div);
      });

      // Atualiza seletor de equipamento no Motor de Teste
      const selEq = getEl('#sel-equip-teste');
      const prev = selEq.value;
      const equips = inv.filter(i => i.equipado && (i.categoria === 'arma' || i.categoria === 'escudo'));
      selEq.innerHTML = `<option value="">Desarmado</option>` + equips.map(eq =>
        `<option value="${eq.uid}">${eq.nome} (${eq.categoria === 'arma' ? `GA:${eq.ga} GD:${eq.gd} Crít:${eq.criticoMargem}+` : `GD:${eq.gd}`})</option>`
      ).join('');
      if (prev) selEq.value = prev;
      atualizarBotaoDanoArma();
    }

    function atualizarBotaoDanoArma() {
      const uid = getEl('#sel-equip-teste').value;
      const eq = (fichaDoc?.inventario || []).find(i => i.uid === uid);
      getEl('#btn-dano-arma').hidden = !eq || eq.categoria !== 'arma';
    }
    getEl('#sel-equip-teste').onchange = atualizarBotaoDanoArma;

    window.alternarEquiparItem = async (uid) => {
      const inv = (fichaDoc.inventario || []).map(it => it.uid === uid ? { ...it, equipado: !it.equipado } : it);
      await updateDoc(doc(db, "fichas", fichaId), { inventario: inv });
    };

    window.removerItemInventario = async (uid) => {
      const inv = (fichaDoc.inventario || []).filter(it => it.uid !== uid);
      await updateDoc(doc(db, "fichas", fichaId), { inventario: inv });
    };

    window.usarItemCura = async (uid) => {
      const inv = [...(fichaDoc.inventario || [])];
      const item = inv.find(i => i.uid === uid);
      if (!item) return;
      const usos = item.usosAtuais ?? item.usosMax ?? 1;
      if (usos <= 0) return mostrarToast('Sem usos restantes!');

      const m = String(item.curaFormula || '1d4').match(/^(\d+)d(\d+)([+-]\d+)?$/i);
      const qtd = m ? parseInt(m[1]) : 1, faces = m ? parseInt(m[2]) : 4, b = m ? parseInt(m[3] || 0) : 0;
      const dados = Array.from({ length: qtd }, () => 1 + Math.floor(Math.random() * faces));
      const cura = dados.reduce((a, x) => a + x, 0) + b;

      item.usosAtuais = usos - 1;
      const cur = obterRecursosAtuais();
      cur.hp = Math.min(maximosRecursos.hp, cur.hp + cura);

      await updateDoc(doc(db, "fichas", fichaId), { inventario: inv, recursosAtuais: cur });
      await registrarRolagemMesa(cura, `Cura (${item.nome})`, `[${dados.join(',')}] → HP ${cur.hp}/${maximosRecursos.hp}`);
      mostrarToast(`+${cura} HP recuperados!`);
    };

    window.abrirModalCatalogoItens = () => {
      const cat = mesaDados?.catalogoItens || [];
      abrirModal('Catálogo de Itens da Mesa', cat.length ? cat.map(it => `
        <div class="hcard">
          <div class="t"><span>${it.nome}</span><span class="tag">${it.categoria} · ${it.peso}</span></div>
          <p>${it.descricao || ''}</p>
          <div style="text-align:right; margin-top:4px">
            <button class="btn pri" onclick="adicionarItemDaMesa('${it.id}')">+ Pegar Item</button>
          </div>
        </div>
      `).join('') : '<span class="mut">O Mestre ainda não cadastrou itens no catálogo desta mesa.</span>');
    };

    window.adicionarItemDaMesa = async (catId) => {
      const base = (mesaDados?.catalogoItens || []).find(i => i.id === catId);
      if (!base) return;
      const inv = [...(fichaDoc.inventario || []), { ...JSON.parse(JSON.stringify(base)), uid: 'inv_' + Date.now(), equipado: false, usosAtuais: base.usosMax || 1 }];
      await updateDoc(doc(db, "fichas", fichaId), { inventario: inv });
      mostrarToast(`${base.nome} adicionado!`);
    };

    /* ---------- Seleção para Testes (Modo "Armar") ---------- */
    const TEXTOS_AJUDA = {
      attr: 'Clique em até 2 atributos na roda.',
      per: 'Clique em uma perícia da lista.',
      hab: 'Clique em uma habilidade elegível.'
    };

    function alternarModoArmado(tipo) {
      modoArmado = modoArmado === tipo ? null : tipo;
      if (modoArmado === 'attr' && selecaoTeste.attrs.length >= 2) {
        modoArmado = null;
        mostrarToast('Já são 2 atributos. Remova um primeiro.');
      }

      if (modoArmado) document.body.dataset.arm = modoArmado;
      else delete document.body.dataset.arm;

      getEl('#hint').textContent = modoArmado ? TEXTOS_AJUDA[modoArmado] + ' (Esc cancela)' : '';
      document.querySelectorAll('[data-add]').forEach(b => b.classList.toggle('on', b.dataset.add === modoArmado));
    }

    document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => alternarModoArmado(b.dataset.add));
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (modoArmado) alternarModoArmado(modoArmado);
        fecharModal();
      }
    });

    function selecionarAtributo(chave) {
      const index = selecaoTeste.attrs.indexOf(chave);
      if (index >= 0) selecaoTeste.attrs.splice(index, 1);
      else selecaoTeste.attrs.push(chave);
      renderizarSelecaoTeste();
      if (selecaoTeste.attrs.length >= 2) alternarModoArmado('attr');
    }

    function selecionarPericia(nome) {
      selecaoTeste.per = selecaoTeste.per === nome ? null : nome;
      renderizarSelecaoTeste();
      alternarModoArmado('per');
    }

    function selecionarHabilidade(id) {
      selecaoTeste.hab = selecaoTeste.hab === id ? null : id;
      renderizarSelecaoTeste();
      alternarModoArmado('hab');
    }

    window.limparSelecao = () => {
      selecaoTeste = { attrs: [], per: null, hab: null };
      if (modoArmado) alternarModoArmado(modoArmado);
      renderizarSelecaoTeste();
    };

    function criarChip(texto, eventoRemover) {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = `${texto} <button class="x">✕</button>`;
      chip.querySelector('button').onclick = eventoRemover;
      return chip;
    }

    function renderizarSelecaoTeste() {
      const elAttr = getEl('#s-attr'), elPer = getEl('#s-per'), elHab = getEl('#s-hab');
      elAttr.innerHTML = elPer.innerHTML = elHab.innerHTML = '';

      selecaoTeste.attrs = selecaoTeste.attrs.filter(k => computado.attr[k] != null);
      selecaoTeste.attrs.forEach(k => elAttr.appendChild(criarChip(`${obterSiglaAtributo(k)} <b>${computado.attr[k]}</b>`, () => selecionarAtributo(k))));

      if (selecaoTeste.per && !(selecaoTeste.per in computado.pericias)) selecaoTeste.per = null;
      if (selecaoTeste.hab && !computado.habilidades.some(h => h.id === selecaoTeste.hab)) selecaoTeste.hab = null;

      if (selecaoTeste.per) {
        elPer.appendChild(criarChip(`${selecaoTeste.per} <b>+${computado.pericias[selecaoTeste.per].val}</b>`, () => { selecaoTeste.per = null; renderizarSelecaoTeste(); }));
      }

      const habObj = selecaoTeste.hab && computado.habilidades.find(x => x.id === selecaoTeste.hab);
      if (habObj) {
        const extraTxt = [habObj.ef ? `+${habObj.ef.v}` : '', habObj.critMod ? `Crít ${habObj.critMod}` : ''].filter(Boolean).join(' ');
        elHab.appendChild(criarChip(`${habObj.nome}${extraTxt ? ` <b>${extraTxt}</b>` : ''}`, () => { selecaoTeste.hab = null; renderizarSelecaoTeste(); }));
      }

      document.querySelectorAll('.node').forEach(n => n.classList.toggle('on', selecaoTeste.attrs.includes(n.dataset.k)));
      document.querySelectorAll('.prow').forEach(n => n.classList.toggle('on', n.dataset.n === selecaoTeste.per));
      document.querySelectorAll('.hcard[data-id]').forEach(n => n.classList.toggle('on', n.dataset.id === selecaoTeste.hab));

      const somaAtributos = selecaoTeste.attrs.reduce((t, k) => t + computado.attr[k], 0);
      getEl('#pool').innerHTML = !selecaoTeste.attrs.length ? 'Escolha um atributo' :
        somaAtributos === 0 ? '<span style="color:#e05555">DEFICIÊNCIA 2d20 (menor)</span>' : `${somaAtributos}d20 (maior)`;

      getEl('#cost').textContent = habObj ? `Custo: ${habObj.f} PE-F / ${habObj.m} PE-M` : 'Custo: 0 PE';
    }

    /* ---------- Rolagens (Motor Pantheon + Dano + Livre + Macros) ---------- */
    window.executarRolarDado = async () => {
      if (!selecaoTeste.attrs.length) return mostrarToast('Adicione ao menos um atributo.');

      const habObj = selecaoTeste.hab && computado.habilidades.find(x => x.id === selecaoTeste.hab);
      if (habObj && (habObj.f > 0 || habObj.m > 0)) {
        const cur = obterRecursosAtuais();
        if (cur.pef < habObj.f || cur.pem < habObj.m) return mostrarToast('PE insuficiente!');
        cur.pef -= habObj.f;
        cur.pem -= habObj.m;
        await updateDoc(doc(db, "fichas", fichaId), { recursosAtuais: cur });
      }

      const qtdDados = selecaoTeste.attrs.reduce((t, k) => t + computado.attr[k], 0);
      const rolard20 = () => 1 + Math.floor(Math.random() * 20);
      const ehDeficiencia = qtdDados === 0;
      const dadosRolados = ehDeficiencia ? [rolard20(), rolard20()] : Array.from({ length: qtdDados }, rolard20);

      const dadoEscolhido = ehDeficiencia ? Math.min(...dadosRolados) : Math.max(...dadosRolados);
      const eq = (fichaDoc.inventario || []).find(i => i.uid === getEl('#sel-equip-teste').value);
      const modoEq = getEl('#sel-modo-equip').value;

      // Margem de crítico: base da arma (ou 20) + modificador da habilidade selecionada
      const margemBase = eq?.categoria === 'arma' ? (parseInt(eq.criticoMargem) || 20) : 20;
      const margemCrit = Math.max(2, margemBase + (habObj?.critMod || 0));

      const critico = (dadosRolados.filter(d => d >= margemCrit).length - dadosRolados.filter(d => d === 1).length) * 2;
      const bonusPericia = selecaoTeste.per ? (computado.pericias[selecaoTeste.per]?.val || 0) : 0;
      const bonusHabilidade = habObj?.ef ? habObj.ef.v : 0;
      const bonusEquip = eq && modoEq === 'ataque' ? (parseInt(eq.ga) || 0) * 2 : (eq && modoEq === 'bloqueio' ? (parseInt(eq.gd) || 0) * 2 : 0);

      const total = dadoEscolhido + bonusPericia + bonusHabilidade + bonusEquip + critico;
      const indiceEscolhido = dadosRolados.indexOf(dadoEscolhido);

      const elOutput = getEl('#out');
      elOutput.hidden = false;
      elOutput.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:baseline">
          <span class="tot">${total}</span>
          <span class="tag" style="${critico > 0 ? 'color:#4cc36f' : critico < 0 ? 'color:#e05555' : ''}">
            ${critico > 0 ? 'Crítico +' + critico : critico < 0 ? 'Desastre ' + critico : `Padrão (${margemCrit}+)`}
          </span>
        </div>
        <div class="mut" style="font-style:normal; font-family:monospace">
          [${selecaoTeste.attrs.map(obterSiglaAtributo).join('+')}] d20:${dadoEscolhido} + Per:${bonusPericia} + Hab:${bonusHabilidade} + Eq:${bonusEquip} + Crít:${critico}
        </div>
        <div>
          ${dadosRolados.map((d, i) => `<span class="die ${i === indiceEscolhido ? 'pk' : ''}">${d}</span>`).join('')}
        </div>
      `;

      const desc = `[${selecaoTeste.attrs.map(obterSiglaAtributo).join('+')}]${selecaoTeste.per ? ` · ${selecaoTeste.per}` : ''}${habObj ? ` · ${habObj.nome}` : ''}`;
      const det = `Dados [${dadosRolados.join(',')}] · Per +${bonusPericia} · Hab +${bonusHabilidade} · Eq +${bonusEquip} · Crít ${critico}`;
      await registrarRolagemMesa(total, desc, det);
    };

    window.rolarDanoArmaSelecionada = async () => {
      const eq = (fichaDoc.inventario || []).find(i => i.uid === getEl('#sel-equip-teste').value);
      if (!eq || eq.categoria !== 'arma') return;

      const ehCrit = confirm(`O ataque com ${eq.nome} foi CRÍTICO (×${eq.criticoMult || 2})?\n\nOK = Dano Crítico\nCancelar = Dano Normal`);
      const m = String(eq.dano || '1d6').match(/^(\d+)d(\d+)([+-]\d+)?$/i);
      const qtd = m ? parseInt(m[1]) : 1, faces = m ? parseInt(m[2]) : 6, b = m ? parseInt(m[3] || 0) : 0;
      const dados = Array.from({ length: qtd }, () => 1 + Math.floor(Math.random() * faces));
      const mult = ehCrit ? (parseInt(eq.criticoMult) || 2) : 1;
      const pot = computado.attr.potencia || 0;
      const total = ((dados.reduce((a, x) => a + x, 0) + b) * mult) + pot;

      await registrarRolagemMesa(total, `Dano ${ehCrit ? 'CRÍTICO ' : ''}(${eq.nome})`, `${eq.dano} [${dados.join(',')}]${ehCrit ? ` ×${mult}` : ''} + POT(${pot})`);
    };

    window.executarDadoLivre = async () => {
      const qtd = Math.max(1, Math.min(20, parseInt(getEl('#lv-qtd').value) || 1));
      const faces = parseInt(getEl('#lv-faces').value) || 6;
      const mod = parseInt(getEl('#lv-mod').value) || 0;
      const modo = getEl('#lv-modo').value;
      const dados = Array.from({ length: qtd }, () => 1 + Math.floor(Math.random() * faces));
      const base = modo === 'soma' ? dados.reduce((a, b) => a + b, 0) : (modo === 'maior' ? Math.max(...dados) : Math.min(...dados));
      const total = base + mod;
      await registrarRolagemMesa(total, `Dado Livre: ${qtd}d${faces} (${modo})`, `[${dados.join(',')}]${mod ? ` + (${mod})` : ''}`);
    };

    async function registrarRolagemMesa(total, descricao, detalhes) {
      await addDoc(collection(db, "rolagens"), {
        mesaId,
        fichaId,
        personagemNome: fichaDoc.nome || 'Personagem',
        total,
        descricao,
        detalhes,
        criadoEm: serverTimestamp()
      });
    }

    window.salvarSelecaoComoMacro = async () => {
      if (!selecaoTeste.attrs.length) return mostrarToast('Adicione ao menos um atributo.');
      const nomeMacro = prompt('Nome da macro:', `${selecaoTeste.attrs.map(obterSiglaAtributo).join(' + ')} (${selecaoTeste.per || 'Geral'})`);
      if (!nomeMacro) return;
      const macros = [...(fichaDoc.macros || []), { nome: nomeMacro, attrs: [...selecaoTeste.attrs], per: selecaoTeste.per, hab: selecaoTeste.hab }];
      await updateDoc(doc(db, "fichas", fichaId), { macros });
    };

    function renderizarMacros() {
      const lista = fichaDoc.macros || [];
      getEl('#macros').innerHTML = lista.length ? '' : '<span class="mut">Nenhuma macro salva.</span>';

      lista.forEach((macro, i) => {
        const div = document.createElement('div');
        div.className = 'mrow';
        div.innerHTML = `
          <div style="min-width:0">
            <div class="cz" style="font-size:12px; font-weight:700">${macro.nome}</div>
            <div class="mut" style="font-style:normal; font-family:monospace; font-size:10px">
              ${macro.attrs.map(obterSiglaAtributo).join('+')}${macro.per ? ' | ' + macro.per : ''}
            </div>
          </div>
          <span style="display:flex; gap:6px; align-items:center">
            <button class="btn pri">Rolar</button>
            <button class="x" title="Excluir">🗑</button>
          </span>
        `;
        div.querySelector('.pri').onclick = () => {
          selecaoTeste = {
            attrs: [...macro.attrs],
            per: macro.per && macro.per in computado.pericias ? macro.per : null,
            hab: macro.hab && computado.habilidades.some(h => h.id === macro.hab) ? macro.hab : null
          };
          renderizarSelecaoTeste();
          executarRolarDado();
        };
        div.querySelector('.x').onclick = async () => {
          const novas = [...lista];
          novas.splice(i, 1);
          await updateDoc(doc(db, "fichas", fichaId), { macros: novas });
        };
        getEl('#macros').appendChild(div);
      });
    }

    /* ---------- Descanso ---------- */
    window.abrirModalDescanso = () => {
      abrirModal('Realizar Descanso', `
        <div style="display:grid; gap:8px">
          <button class="btn" style="text-align:left; padding:8px" onclick="executarDescanso('curto')">
            <b class="cz" style="color:var(--acc)">⏳ Pausa Curta</b><br>
            <span class="mut" style="font-style:normal">Recupera 1d6 + Vigor (PE-F) e 1d6 + Ímpeto (PE-M).</span>
          </button>
          <button class="btn" style="text-align:left; padding:8px" onclick="executarDescanso('longo')">
            <b class="cz" style="color:#4cc36f">🌙 Descanso Longo</b><br>
            <span class="mut" style="font-style:normal">Restaura PE-F e PE-M ao máximo, e recupera 1d4 + Vigor (HP) e 1d4 + Ímpeto (SAN).</span>
          </button>
        </div>
      `);
    };

    window.executarDescanso = async (tipo) => {
      const cur = obterRecursosAtuais();
      if (tipo === 'curto') {
        const r1 = (1 + Math.floor(Math.random() * 6)) + (computado.attr.vigor || 0);
        const r2 = (1 + Math.floor(Math.random() * 6)) + (computado.attr.impeto || 0);
        cur.pef = Math.min(maximosRecursos.pef, cur.pef + r1);
        cur.pem = Math.min(maximosRecursos.pem, cur.pem + r2);
        await updateDoc(doc(db, "fichas", fichaId), { recursosAtuais: cur });
        await registrarRolagemMesa(r1 + r2, 'Pausa Curta', `+${r1} PE-F e +${r2} PE-M`);
      } else {
        const rHp = (1 + Math.floor(Math.random() * 4)) + (computado.attr.vigor || 0);
        const rSan = (1 + Math.floor(Math.random() * 4)) + (computado.attr.impeto || 0);
        cur.hp = Math.min(maximosRecursos.hp, cur.hp + rHp);
        cur.san = Math.min(maximosRecursos.san, cur.san + rSan);
        cur.pef = maximosRecursos.pef;
        cur.pem = maximosRecursos.pem;
        await updateDoc(doc(db, "fichas", fichaId), { recursosAtuais: cur });
        await registrarRolagemMesa(rHp + rSan, 'Descanso Longo', `PEs restaurados · +${rHp} HP e +${rSan} SAN`);
      }
      fecharModal();
    };

    /* ---------- Visualizador de Árvores na Ficha ---------- */
    function obterArvoresAcessiveis() {
      const todas = mesaDados?.arvores || [];
      const h = fichaDoc?.raizesHeranca || {};
      const permitidas = new Set();
      if (h.tipo === 'auto') permitidas.add('Órfão');
      else {
        if (h.r1) permitidas.add(h.r1);
        if (h.tipo === 'dupla' && h.r2) permitidas.add(h.r2);
      }
      (fichaDoc?.raizesExtras || []).forEach(r => permitidas.add(r));
      return todas.filter(a => permitidas.has(a.raizAssociada));
    }

    window.abrirModalArvores = () => {
      const acessiveis = obterArvoresAcessiveis();
      if (!acessiveis.length) return mostrarToast('Nenhuma árvore vinculada às suas raízes.');

      if (!arvoreAtivaId || !acessiveis.some(a => a.id === arvoreAtivaId)) {
        arvoreAtivaId = acessiveis[0].id;
      }

      const selHtml = `<select id="sel-arv-modal" onchange="trocarArvoreModal(this.value)">${acessiveis.map(a => `<option value="${a.id}" ${a.id === arvoreAtivaId ? 'selected' : ''}>${a.nome} (${a.raizAssociada})</option>`).join('')}</select>`;
      abrirModal(`Árvores de Evolução · ${selHtml} <span class="chip" id="mod-pt">PT: ${fichaDoc.pontosEvolucao || 0}</span>`, `
        <div class="tree-view-wrap" id="tv-wrap">
          <div class="tree-stage" id="tv-stage">
            <svg id="tv-svg" style="position:absolute;top:0;left:0;pointer-events:none;overflow:visible"></svg>
            <div class="tree-grid" id="tv-grid"></div>
          </div>
          <div style="position:absolute; right:10px; bottom:10px; display:flex; gap:4px; z-index:5">
            <button class="btn" onclick="zoomArvore(0.85)">−</button>
            <button class="btn" onclick="zoomArvore(1.18)">+</button>
            <button class="btn" onclick="resetZoomArvore()">↺</button>
          </div>
        </div>
        <div id="tv-detalhes" class="card" style="margin:8px 0 0; padding:8px" hidden></div>
      `, true);

      iniciarPanZoomArvore();
      renderizarArvoreNoModal();
    };

    window.trocarArvoreModal = (id) => { arvoreAtivaId = id; renderizarArvoreNoModal(); };
    window.zoomArvore = (f) => { tZoom = Math.min(2, Math.max(0.35, tZoom * f)); aplicarTransformArvore(); };
    window.resetZoomArvore = () => { tZoom = 1; tPanX = 0; tPanY = 0; aplicarTransformArvore(); };
    function aplicarTransformArvore() {
      const st = getEl('#tv-stage');
      if (st) st.style.transform = `translate(${tPanX}px, ${tPanY}px) scale(${tZoom})`;
    }

    function iniciarPanZoomArvore() {
      const wrap = getEl('#tv-wrap');
      if (!wrap) return;
      let pan = false, sx = 0, sy = 0;
      wrap.onpointerdown = e => {
        if (e.target.closest('.tnode, button')) return;
        pan = true; sx = e.clientX - tPanX; sy = e.clientY - tPanY;
        wrap.classList.add('panning');
      };
      wrap.onpointermove = e => { if (!pan) return; tPanX = e.clientX - sx; tPanY = e.clientY - sy; aplicarTransformArvore(); };
      window.onpointerup = () => { pan = false; wrap.classList.remove('panning'); };
    }

    function contarSubarvore(arvore, rootId, desbSet) {
      if (!desbSet.has(rootId)) return 0;
      let c = 1;
      (arvore.nos || []).filter(n => (n.requisitos || []).includes(rootId)).forEach(ch => { c += contarSubarvore(arvore, ch.id, desbSet); });
      return c;
    }

    function statusNoArvore(arvore, node) {
      const desb = new Set((fichaDoc.nosDesbloqueados || {})[arvore.id] || []);
      if (desb.has(node.id)) return { st: 'done', msg: 'Desbloqueado' };

      const reqs = node.requisitos || [];
      if (reqs.length && !reqs.every(r => desb.has(r))) return { st: 'lock', msg: 'Requer nó anterior.' };

      const ehDupla = fichaDoc.raizesHeranca?.tipo === 'dupla';
      for (const paiId of reqs) {
        const pai = (arvore.nos || []).find(n => n.id === paiId);
        if (!pai) continue;
        const irmaos = (arvore.nos || []).filter(n => (n.requisitos || []).includes(paiId));
        const comp = irmaos.filter(ir => desb.has(ir.id));
        if (pai.tipoRamificacao === 'exclusiva' && comp.length > 0) return { st: 'block', msg: 'Bloqueado por Escolha Exclusiva.' };
        if (pai.tipoRamificacao === 'restritiva' && !ehDupla && comp.length > 0) {
          const lim = parseInt(pai.limiteNosSecundarios) || 1;
          const tot = comp.reduce((a, ir) => a + contarSubarvore(arvore, ir.id, desb), 0);
          if (tot >= lim) return { st: 'block', msg: `Limite restritivo (${lim}) atingido.` };
        }
      }

      if (node.tipoRecompensa === 'atributo') {
        const opts = node.opcoesAmbiguas || [];
        if (opts.length && !opts.some(o => o.attr && (computado.attr[o.attr] || 0) < computado.teto)) {
          return { st: 'block', msg: `Teto biológico (${computado.teto}) atingido.` };
        }
      }

      const custo = parseInt(node.custoPontos) || 1;
      if ((fichaDoc.pontosEvolucao || 0) < custo) return { st: 'lock', msg: `Requer ${custo} PT.` };
      return { st: 'avail', msg: `Comprar por ${custo} PT` };
    }

    function renderizarArvoreNoModal() {
      const arvore = (mesaDados?.arvores || []).find(a => a.id === arvoreAtivaId);
      const grid = getEl('#tv-grid');
      if (!arvore || !grid) return;

      getEl('#mod-pt').textContent = `PT: ${fichaDoc.pontosEvolucao || 0}`;
      grid.innerHTML = '';

      const nodeMap = new Map((arvore.nos || []).map(n => [n.id, n]));
      const children = new Map((arvore.nos || []).map(n => [n.id, []]));
      const parent = new Map();
      (arvore.nos || []).forEach(n => {
        const v = (n.requisitos || []).filter(id => nodeMap.has(id));
        if (v.length) { parent.set(n.id, v[0]); children.get(v[0]).push(n); }
      });

      const roots = (arvore.nos || []).filter(n => !parent.has(n.id));
      const pos = new Map(), vis = new Set(), step = 210;
      function place(n, d, cur) {
        if (vis.has(n.id)) return { cur, c: 0 };
        vis.add(n.id);
        const kids = children.get(n.id) || [];
        let c;
        if (!kids.length) { c = cur + step / 2; cur += step; }
        else {
          const cs = [];
          kids.forEach(k => { const r = place(k, d + 1, cur); cur = r.cur; cs.push(r.c); });
          c = (cs[0] + cs[cs.length - 1]) / 2;
        }
        pos.set(n.id, { x: c, d });
        return { cur, c };
      }

      let cur = 0;
      roots.forEach(r => { cur = place(r, 0, cur).cur + 60; });
      (arvore.nos || []).forEach(n => { if (!vis.has(n.id)) cur = place(n, 0, cur).cur + 60; });

      const maxD = Math.max(0, ...[...pos.values()].map(p => p.d));
      const levels = Array.from({ length: maxD + 1 }, () => []);
      (arvore.nos || []).forEach(n => { const p = pos.get(n.id); if (p) levels[p.d].push(n); });
      grid.style.width = `${Math.max(800, cur)}px`;

      for (let d = maxD; d >= 0; d--) {
        const row = document.createElement('div');
        row.className = 'tree-lvl';
        (levels[d] || []).forEach(n => {
          const st = statusNoArvore(arvore, n);
          const el = document.createElement('div');
          el.id = `tv-n-${n.id}`;
          el.className = `tnode ${st.st}`;
          el.style.left = `${pos.get(n.id).x}px`;
          el.innerHTML = `
            <div style="display:flex; justify-content:space-between; font-weight:700" class="cz">
              <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${n.titulo}</span>
              <span class="tag">${st.st === 'done' ? '✓' : `${n.custoPontos || 1}PT`}</span>
            </div>
            <div class="mut" style="font-style:normal; font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${n.conteudo?.descricao || ''}</div>
          `;
          el.onclick = () => selecionarNoParaCompra(arvore, n, st);
          row.appendChild(el);
        });
        grid.appendChild(row);
      }

      setTimeout(() => {
        const svg = getEl('#tv-svg');
        if (!svg) return;
        svg.setAttribute('width', grid.offsetWidth + 640);
        svg.setAttribute('height', grid.offsetHeight + 640);
        svg.innerHTML = '';
        const desb = new Set((fichaDoc.nosDesbloqueados || {})[arvore.id] || []);
        (arvore.nos || []).forEach(n => {
          const tEl = getEl(`#tv-n-${n.id}`);
          if (!tEl) return;
          (n.requisitos || []).forEach(rId => {
            const sEl = getEl(`#tv-n-${rId}`);
            if (!sEl) return;
            const x1 = grid.offsetLeft + sEl.offsetLeft, y1 = grid.offsetTop + sEl.parentElement.offsetTop + sEl.offsetTop;
            const x2 = grid.offsetLeft + tEl.offsetLeft, y2 = grid.offsetTop + tEl.parentElement.offsetTop + tEl.offsetTop + tEl.offsetHeight;
            const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            p.setAttribute('d', `M ${x1} ${y1} C ${x1} ${y1 - 30}, ${x2} ${y2 + 30}, ${x2} ${y2}`);
            p.setAttribute('stroke', desb.has(n.id) && desb.has(rId) ? '#4cc36f' : '#665');
            p.setAttribute('stroke-width', '2');
            p.setAttribute('fill', 'none');
            svg.appendChild(p);
          });
        });
      }, 30);
    }

    function selecionarNoParaCompra(arvore, node, st) {
      const box = getEl('#tv-detalhes');
      box.hidden = false;
