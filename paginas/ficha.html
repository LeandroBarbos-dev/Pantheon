            <div class="hcard ${it.equipado ? 'on' : ''}">
              <div class="t">
                <span style="cursor:pointer" onclick="abrirModalDetalhesItem('${it.uid}')">${ICONE_CAT[it.categoria] || '🎒'} ${it.nome}</span>
                <span class="tag">${it.peso}</span>
              </div>
              <p>${it.descricao || ''}</p>
              <div style="display:flex; justify-content:space-between; align-items:center; font-size:11px; margin-top:4px">
                <span>
                  ${podeEquipar ? `<button class="btn ${it.equipado ? 'pri' : ''}" onclick="alternarEquiparItem('${it.uid}')">${it.equipado ? '✓ Equipado' : 'Equipar'}</button>` : ''}
                  ${it.categoria === 'cura' ? `<button class="btn pri" onclick="usarItemCura('${it.uid}')">🩹 Curar (${it.usosAtuais ?? it.usosMax}/${it.usosMax})</button>` : ''}
                </span>
                <span style="display:flex; gap:6px">
                  <button class="btn" onclick="abrirModalDetalhesItem('${it.uid}')">Detalhes</button>
                  <button class="x" onclick="removerItemInventario('${it.uid}')">✕</button>
                </span>
              </div>
            </div>
          `;
        }).join('') : '<span class="mut">Mochila vazia. Clique em "+ Catálogo" para pegar itens.</span>';
      } else {
        const grupos = [
          { key: 'pesado',  titulo: 'Blocos Pesados (Vigor)',     cor: '#f87171', lista: blocosBase.pesado },
          { key: 'medio',   titulo: 'Blocos Médios (Vigor + 1)',  cor: '#facc15', lista: blocosBase.medio },
          { key: 'leve',    titulo: 'Blocos Leves (Vigor + 2)',   cor: '#4ade80', lista: blocosBase.leve },
          { key: 'miudeza', titulo: 'Bolso de Miudezas (10)',     cor: '#38bdf8', lista: blocosBase.miudeza }
        ];

        let html = grupos.map(g => {
          if (!g.lista.length) {
            return `
              <div class="inv-group">
                <div class="inv-group-hdr"><span style="color:${g.cor}">${g.titulo}</span><span>0 blocos</span></div>
                <span class="mut" style="font-size:11px">Vigor 0: sem blocos pesados disponíveis.</span>
              </div>
            `;
          }

          const cardsHtml = g.lista.map(blk => {
            return blk.slots.map((sl, subIdx) => {
              const labelTopo = sl.peso === 'pesado' ? 'PESADO'
                : sl.peso === 'medio' ? 'MÉDIO'
                : sl.peso === 'leve' ? 'LEVE' : 'MIUD';

              const isConvertido = blk.modo === 'conv';
              return `
                <div class="inv-block ${g.key === 'miudeza' ? 'miudeza' : ''} ${isConvertido ? 'conv-child' : ''} b-${sl.peso}"
                     data-drop-orig="${blk.origKey}" data-drop-sub="${subIdx}" data-slot-peso="${sl.peso}" data-orig-peso="${blk.origPeso}">
                  <div class="inv-block-top">
                    <span>${labelTopo}${isConvertido ? ' ↳' : ''}</span>
                  </div>
                  ${sl.item ? renderizarTileItem(sl.item) : `<div class="inv-empty-cell">Vazio</div>`}
                </div>
              `;
            }).join('');
          }).join('');

          return `
            <div class="inv-group">
              <div class="inv-group-hdr"><span style="color:${g.cor}">${g.titulo}</span><span>${g.lista.length}</span></div>
              <div class="${g.key === 'miudeza' ? 'inv-grid-miudeza' : 'inv-row-blocks'}">${cardsHtml}</div>
            </div>
          `;
        }).join('');

        if (excedentes.length > 0) {
          html += `
            <div class="inv-group" style="border:1px dashed #e05555; border-radius:8px; padding:6px">
              <div class="inv-group-hdr"><span style="color:#f87171">⚠ Sobrecarga (Sem Bloco Livre)</span><span>${excedentes.length}</span></div>
              <div class="inv-row-blocks">${excedentes.map(it => `<div class="inv-block b-${it.peso}">${renderizarTileItem(it)}</div>`).join('')}</div>
            </div>
          `;
        }

        cont.innerHTML = html;
        vincularEventosBlocosInventario(cont, blocosBase);
      }

      const selEq = getEl('#sel-equip-teste');
      const prev = selEq.value;
      const equips = inv.filter(i => i.equipado && (i.categoria === 'arma' || i.categoria === 'escudo'));
      selEq.innerHTML = `<option value="">Desarmado</option>` + equips.map(eq =>
        `<option value="${eq.uid}">${eq.nome} (${eq.categoria === 'arma' ? `GA:${eq.ga} GD:${eq.gd} Crít:${eq.criticoMargem}+` : `GD:${eq.gd}`})</option>`
      ).join('');
      if (prev) selEq.value = prev;
      atualizarBotaoDanoArma();
    }

    function vincularEventosBlocosInventario(cont, blocosBase) {
      cont.querySelectorAll('[data-open-uid]').forEach(tile => {
        tile.onclick = (e) => {
          e.stopPropagation();
          abrirModalDetalhesItem(tile.dataset.openUid);
        };
        tile.ondragstart = (e) => {
          e.stopPropagation();
          e.dataTransfer.setData('text/inv-uid', tile.dataset.dragUid);
          e.dataTransfer.effectAllowed = 'move';
        };
      });

      const todosBlocos = [...blocosBase.pesado, ...blocosBase.medio, ...blocosBase.leve, ...blocosBase.miudeza];

      cont.querySelectorAll('[data-drop-orig]').forEach(zone => {
        zone.ondragover = (e) => {
          if (!e.dataTransfer.types.includes('text/inv-uid')) return;
          e.preventDefault();
          e.stopPropagation();
          zone.classList.add('drag-over');
        };
        zone.ondragleave = () => zone.classList.remove('drag-over');
        zone.ondrop = async (e) => {
          e.preventDefault();
          e.stopPropagation();
          zone.classList.remove('drag-over');

          const uid = e.dataTransfer.getData('text/inv-uid');
          if (!uid) return;
          const item = (fichaDoc.inventario || []).find(x => x.uid === uid);
          if (!item) return;

          const origKey = zone.dataset.dropOrig;
          const subIdx = parseInt(zone.dataset.dropSub);
          const blk = todosBlocos.find(b => b.origKey === origKey);
          if (!blk) return;

          const slotAlvo = blk.slots[subIdx];
          if (!slotAlvo) return;

          if (slotAlvo.peso === item.peso) {
            if (slotAlvo.item && slotAlvo.item.uid !== uid) {
              return mostrarToast('Já existe um item neste bloco!');
            }
            await moverItemParaSlot(uid, origKey, subIdx);
            return;
          }

          const vazio = blk.slots.every(s => !s.item || s.item.uid === uid);
          if (!vazio) {
            return mostrarToast(`Este bloco aceita apenas item "${slotAlvo.peso.toUpperCase()}"!`);
          }

          if (blk.origPeso === 'pesado' && item.peso === 'medio') {
            await moverItemParaSlot(uid, origKey, 0);
            return;
          }
          if (blk.origPeso === 'pesado' && item.peso === 'leve') {
            await moverItemParaSlot(uid, origKey, 1);
            return;
          }
          if (blk.origPeso === 'medio' && item.peso === 'leve') {
            await moverItemParaSlot(uid, origKey, 0);
            return;
          }

          mostrarToast(`Item "${item.peso}" não cabe em bloco "${blk.origPeso}" (Trava Ascendente).`);
        };
      });
    }

    async function moverItemParaSlot(uid, slotKey, subIdx) {
      const invAtualizado = (fichaDoc.inventario || []).map(it =>
        it.uid === uid ? { ...it, slotKey, subIdx } : it
      );
      await updateDoc(doc(db, "fichas", fichaId), { inventario: invAtualizado });
    }

    window.abrirModalDetalhesItem = (uid) => {
      const it = (fichaDoc.inventario || []).find(i => i.uid === uid);
      if (!it) return;

      const podeEquipar = ['arma', 'escudo', 'armadura'].includes(it.categoria);
      let stats = '';
      if (it.categoria === 'arma') {
        stats = `Dano: <b>${it.dano}</b> · Crítico: <b>${it.criticoMargem}+ (×${it.criticoMult})</b> · GA: <b>${it.ga}</b> · GD: <b>${it.gd}</b>`;
      } else if (it.categoria === 'escudo') {
        stats = `Escudo · Grau de Defesa (GD): <b>${it.gd}</b> (+${it.gd * 2} Bloqueio)`;
      } else if (it.categoria === 'armadura') {
        stats = `Armadura · Redução de Dano (RD): <b>${it.rd}</b>${it.penalidadeDesl ? ` · Deslocamento: <b>${it.penalidadeDesl}m</b>` : ''}`;
      } else if (it.categoria === 'cura') {
        stats = `Cura: <b>${it.curaFormula}</b> · Bônus Medicina: <b>${it.curaBonus >= 0 ? '+' + it.curaBonus : it.curaBonus}</b> · Usos: <b>${it.usosAtuais ?? it.usosMax}/${it.usosMax}</b>`;
      }

      abrirModal(`${ICONE_CAT[it.categoria] || '🎒'} ${it.nome}`, `
        <div style="display:flex; gap:12px; align-items:flex-start; margin-bottom:10px">
          ${it.imagem
            ? `<img src="${it.imagem}" alt="${it.nome}" style="width:84px; height:84px; object-fit:cover; border-radius:8px; border:1px solid var(--acc)">`
            : `<div style="width:84px; height:84px; border-radius:8px; background:var(--card2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:34px">${ICONE_CAT[it.categoria] || '🎒'}</div>`
          }
          <div style="flex:1">
            <div><span class="tag">${it.categoria}</span> <span class="tag">Peso: ${it.peso}</span> ${it.equipado ? '<span class="chip" style="color:var(--acc)">✓ Equipado</span>' : ''}</div>
            ${stats ? `<p style="margin:6px 0; font-family:monospace; font-size:12px">${stats}</p>` : ''}
            <p style="margin:4px 0; font-size:13px">${it.descricao || 'Sem descrição adicional.'}</p>
            ${it.habilidade?.nome ? `<div class="hcard" style="margin-top:6px"><div class="t"><span>✨ ${it.habilidade.nome}</span><span class="tag">${it.habilidade.custo || ''}</span></div><p>${it.habilidade.efeito || ''}</p></div>` : ''}
          </div>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--line); padding-top:8px">
          <div style="display:flex; gap:6px">
            ${podeEquipar ? `<button class="btn pri" onclick="alternarEquiparItem('${it.uid}'); fecharModal()">${it.equipado ? 'Desequipar' : '✓ Equipar Item'}</button>` : ''}
            ${it.categoria === 'cura' ? `<button class="btn pri" onclick="usarItemCura('${it.uid}'); fecharModal()">🩹 Usar Cura</button>` : ''}
          </div>
          <button class="btn" style="color:#e05555; border-color:#e0555566" onclick="removerItemInventario('${it.uid}'); fecharModal()">🗑 Descartar Item</button>
        </div>
      `);
    };

    function atualizarBotaoDanoArma() {
      const uid = getEl('#sel-equip-teste').value;
      const eq = (fichaDoc?.inventario || []).find(i => i.uid === uid);
      getEl('#btn-dano-arma').hidden = !eq || eq.categoria !== 'arma';
    }
    getEl('#sel-equip-teste').onchange = atualizarBotaoDanoArma;

    window.alternarEquiparItem = async (uid) => {
      const inv = (fichaDoc.inventario || []).map(it => it.uid === uid ? { ...it, equipado: !it.equipado } : it);
      await updateDoc(doc(db, "fichas", fichaId), { inventario: inv });
    };

    window.removerItemInventario = async (uid) => {
      const inv = (fichaDoc.inventario || []).filter(it => it.uid !== uid);
      await updateDoc(doc(db, "fichas", fichaId), { inventario: inv });
    };

    window.usarItemCura = async (uid) => {
      const inv = [...(fichaDoc.inventario || [])];
      const item = inv.find(i => i.uid === uid);
      if (!item) return;
      const usos = item.usosAtuais ?? item.usosMax ?? 1;
      if (usos <= 0) return mostrarToast('Sem usos restantes!');

      const m = String(item.curaFormula || '1d4').match(/^(\d+)d(\d+)([+-]\d+)?$/i);
      const qtd = m ? parseInt(m[1]) : 1, faces = m ? parseInt(m[2]) : 4, b = m ? parseInt(m[3] || 0) : 0;
      const dados = Array.from({ length: qtd }, () => 1 + Math.floor(Math.random() * faces));
      const cura = dados.reduce((a, x) => a + x, 0) + b;

      item.usosAtuais = usos - 1;
      const cur = obterRecursosAtuais();
      cur.hp = Math.min(maximosRecursos.hp, cur.hp + cura);

      await updateDoc(doc(db, "fichas", fichaId), { inventario: inv, recursosAtuais: cur });
      await registrarRolagemMesa(cura, `Cura (${item.nome})`, `[${dados.join(',')}] → HP ${cur.hp}/${maximosRecursos.hp}`);
      mostrarToast(`+${cura} HP recuperados!`);
    };

    window.abrirModalCatalogoItens = () => {
      const cat = obterCatalogoItensMesclado();
      abrirModal('Catálogo de Itens (Sistema & Mesa)', cat.length ? cat.map(it => `
        <div class="hcard" style="display:flex; gap:10px; align-items:center">
          ${it.imagem
            ? `<img src="${it.imagem}" alt="${it.nome}" style="width:44px; height:44px; object-fit:cover; border-radius:6px; border:1px solid var(--line)">`
            : `<div style="width:44px; height:44px; border-radius:6px; background:var(--card); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:20px">${ICONE_CAT[it.categoria] || '🎒'}</div>`
          }
          <div style="flex:1; min-width:0">
            <div class="t"><span>${it.nome}</span><span class="tag">${it.categoria} · ${it.peso}</span></div>
            <p>${it.descricao || ''}</p>
          </div>
          <button class="btn pri" onclick="adicionarItemDaMesa('${it.id}')">+ Pegar</button>
        </div>
      `).join('') : '<span class="mut">Nenhum item disponível no catálogo.</span>');
    };

    window.adicionarItemDaMesa = async (catId) => {
      const base = obterCatalogoItensMesclado().find(i => i.id === catId);
      if (!base) return;
      const inv = [...(fichaDoc.inventario || []), { ...JSON.parse(JSON.stringify(base)), uid: 'inv_' + Date.now(), equipado: false, usosAtuais: base.usosMax || 1 }];
      await updateDoc(doc(db, "fichas", fichaId), { inventario: inv });
      mostrarToast(`${base.nome} adicionado à mochila!`);
    };

    /* ---------- Seleção para Testes ---------- */
    const TEXTOS_AJUDA = {
      attr: 'Clique em até 2 atributos na roda.',
      per: 'Clique em uma perícia da lista.',
      hab: 'Clique em uma habilidade elegível.'
    };

    function alternarModoArmado(tipo) {
      modoArmado = modoArmado === tipo ? null : tipo;
      if (modoArmado === 'attr' && selecaoTeste.attrs.length >= 2) {
        modoArmado = null;
        mostrarToast('Já são 2 atributos. Remova um primeiro.');
      }

      if (modoArmado) document.body.dataset.arm = modoArmado;
      else delete document.body.dataset.arm;

      getEl('#hint').textContent = modoArmado ? TEXTOS_AJUDA[modoArmado] + ' (Esc cancela)' : '';
      document.querySelectorAll('[data-add]').forEach(b => b.classList.toggle('on', b.dataset.add === modoArmado));
    }

    document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => alternarModoArmado(b.dataset.add));
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (modoArmado) alternarModoArmado(modoArmado);
        fecharModal();
      }
    });

    function selecionarAtributo(chave) {
      const index = selecaoTeste.attrs.indexOf(chave);
      if (index >= 0) selecaoTeste.attrs.splice(index, 1);
      else selecaoTeste.attrs.push(chave);
      renderizarSelecaoTeste();
      if (selecaoTeste.attrs.length >= 2) alternarModoArmado('attr');
    }

    function selecionarPericia(nome) {
      selecaoTeste.per = selecaoTeste.per === nome ? null : nome;
      renderizarSelecaoTeste();
      alternarModoArmado('per');
    }

    function selecionarHabilidade(id) {
      selecaoTeste.hab = selecaoTeste.hab === id ? null : id;
      renderizarSelecaoTeste();
      alternarModoArmado('hab');
    }

    window.limparSelecao = () => {
      selecaoTeste = { attrs: [], per: null, hab: null };
      if (modoArmado) alternarModoArmado(modoArmado);
      renderizarSelecaoTeste();
    };

    function criarChip(texto, eventoRemover) {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = `${texto} <button class="x">✕</button>`;
      chip.querySelector('button').onclick = eventoRemover;
      return chip;
    }

    function renderizarSelecaoTeste() {
      const elAttr = getEl('#s-attr'), elPer = getEl('#s-per'), elHab = getEl('#s-hab');
      elAttr.innerHTML = elPer.innerHTML = elHab.innerHTML = '';

      selecaoTeste.attrs = selecaoTeste.attrs.filter(k => computado.attr[k] != null);
      selecaoTeste.attrs.forEach(k => elAttr.appendChild(criarChip(`${obterSiglaAtributo(k)} <b>${computado.attr[k]}</b>`, () => selecionarAtributo(k))));

      if (selecaoTeste.per && !(selecaoTeste.per in computado.pericias)) selecaoTeste.per = null;
      if (selecaoTeste.hab && !computado.habilidades.some(h => h.id === selecaoTeste.hab)) selecaoTeste.hab = null;

      if (selecaoTeste.per) {
        elPer.appendChild(criarChip(`${selecaoTeste.per} <b>+${computado.pericias[selecaoTeste.per].val}</b>`, () => { selecaoTeste.per = null; renderizarSelecaoTeste(); }));
      }

      const habObj = selecaoTeste.hab && computado.habilidades.find(x => x.id === selecaoTeste.hab);
      if (habObj) {
        const extraTxt = [habObj.ef ? `+${habObj.ef.v}` : '', habObj.critMod ? `Crít ${habObj.critMod}` : ''].filter(Boolean).join(' ');
        elHab.appendChild(criarChip(`${habObj.nome}${extraTxt ? ` <b>${extraTxt}</b>` : ''}`, () => { selecaoTeste.hab = null; renderizarSelecaoTeste(); }));
      }

      document.querySelectorAll('.node').forEach(n => n.classList.toggle('on', selecaoTeste.attrs.includes(n.dataset.k)));
      document.querySelectorAll('.prow').forEach(n => n.classList.toggle('on', n.dataset.n === selecaoTeste.per));
      document.querySelectorAll('.hcard[data-id]').forEach(n => n.classList.toggle('on', n.dataset.id === selecaoTeste.hab));

      const somaAtributos = selecaoTeste.attrs.reduce((t, k) => t + computado.attr[k], 0);
      getEl('#pool').innerHTML = !selecaoTeste.attrs.length ? 'Escolha um atributo' :
        somaAtributos === 0 ? '<span style="color:#e05555">DEFICIÊNCIA 2d20 (menor)</span>' : `${somaAtributos}d20 (maior)`;

      getEl('#cost').textContent = habObj ? `Custo: ${habObj.f} PE-F / ${habObj.m} PE-M` : 'Custo: 0 PE';
    }

    /* ---------- Rolagens ---------- */
    window.executarRolarDado = async () => {
      if (!selecaoTeste.attrs.length) return mostrarToast('Adicione ao menos um atributo.');

      const habObj = selecaoTeste.hab && computado.habilidades.find(x => x.id === selecaoTeste.hab);
      if (habObj && (habObj.f > 0 || habObj.m > 0)) {
        const cur = obterRecursosAtuais();
        if (cur.pef < habObj.f || cur.pem < habObj.m) return mostrarToast('PE insuficiente!');
        cur.pef -= habObj.f;
        cur.pem -= habObj.m;
        await updateDoc(doc(db, "fichas", fichaId), { recursosAtuais: cur });
      }

      const qtdDados = selecaoTeste.attrs.reduce((t, k) => t + computado.attr[k], 0);
      const rolard20 = () => 1 + Math.floor(Math.random() * 20);
      const ehDeficiencia = qtdDados === 0;
      const dadosRolados = ehDeficiencia ? [rolard20(), rolard20()] : Array.from({ length: qtdDados }, rolard20);

      const dadoEscolhido = ehDeficiencia ? Math.min(...dadosRolados) : Math.max(...dadosRolados);
      const eq = (fichaDoc.inventario || []).find(i => i.uid === getEl('#sel-equip-teste').value);
      const modoEq = getEl('#sel-modo-equip').value;

      const margemBase = eq?.categoria === 'arma' ? (parseInt(eq.criticoMargem) || 20) : 20;
      const margemCrit = Math.max(2, margemBase + (habObj?.critMod || 0));

      const critico = (dadosRolados.filter(d => d >= margemCrit).length - dadosRolados.filter(d => d === 1).length) * 2;
      const bonusPericia = selecaoTeste.per ? (computado.pericias[selecaoTeste.per]?.val || 0) : 0;
      const bonusHabilidade = habObj?.ef ? habObj.ef.v : 0;
      const bonusEquip = eq && modoEq === 'ataque' ? (parseInt(eq.ga) || 0) * 2 : (eq && modoEq === 'bloqueio' ? (parseInt(eq.gd) || 0) * 2 : 0);

      const total = dadoEscolhido + bonusPericia + bonusHabilidade + bonusEquip + critico;
      const indiceEscolhido = dadosRolados.indexOf(dadoEscolhido);

      const elOutput = getEl('#out');
      elOutput.hidden = false;
      elOutput.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:baseline">
          <span class="tot">${total}</span>
          <span class="tag" style="${critico > 0 ? 'color:#4cc36f' : critico < 0 ? 'color:#e05555' : ''}">
            ${critico > 0 ? 'Crítico +' + critico : critico < 0 ? 'Desastre ' + critico : `Padrão (${margemCrit}+)`}
          </span>
        </div>
        <div class="mut" style="font-style:normal; font-family:monospace">
          [${selecaoTeste.attrs.map(obterSiglaAtributo).join('+')}] d20:${dadoEscolhido} + Per:${bonusPericia} + Hab:${bonusHabilidade} + Eq:${bonusEquip} + Crít:${critico}
        </div>
        <div>
          ${dadosRolados.map((d, i) => `<span class="die ${i === indiceEscolhido ? 'pk' : ''}">${d}</span>`).join('')}
        </div>
      `;

      const desc = `[${selecaoTeste.attrs.map(obterSiglaAtributo).join('+')}]${selecaoTeste.per ? ` · ${selecaoTeste.per}` : ''}${habObj ? ` · ${habObj.nome}` : ''}`;
      const det = `Dados [${dadosRolados.join(',')}] · Per +${bonusPericia} · Hab +${bonusHabilidade} · Eq +${bonusEquip} · Crít ${critico}`;
      await registrarRolagemMesa(total, desc, det);
    };

    window.rolarDanoArmaSelecionada = async () => {
      const eq = (fichaDoc.inventario || []).find(i => i.uid === getEl('#sel-equip-teste').value);
      if (!eq || eq.categoria !== 'arma') return;

      const ehCrit = confirm(`O ataque com ${eq.nome} foi CRÍTICO (×${eq.criticoMult || 2})?\n\nOK = Dano Crítico\nCancelar = Dano Normal`);
      const m = String(eq.dano || '1d6').match(/^(\d+)d(\d+)([+-]\d+)?$/i);
      const qtd = m ? parseInt(m[1]) : 1, faces = m ? parseInt(m[2]) : 6, b = m ? parseInt(m[3] || 0) : 0;
      const dados = Array.from({ length: qtd }, () => 1 + Math.floor(Math.random() * faces));
      const mult = ehCrit ? (parseInt(eq.criticoMult) || 2) : 1;
      const pot = computado.attr.potencia || 0;
      const total = ((dados.reduce((a, x) => a + x, 0) + b) * mult) + pot;

      await registrarRolagemMesa(total, `Dano ${ehCrit ? 'CRÍTICO ' : ''}(${eq.nome})`, `${eq.dano} [${dados.join(',')}]${ehCrit ? ` ×${mult}` : ''} + POT(${pot})`);
    };

    window.executarDadoLivre = async () => {
      const qtd = Math.max(1, Math.min(20, parseInt(getEl('#lv-qtd').value) || 1));
      const faces = parseInt(getEl('#lv-faces').value) || 6;
      const mod = parseInt(getEl('#lv-mod').value) || 0;
      const modo = getEl('#lv-modo').value;
      const dados = Array.from({ length: qtd }, () => 1 + Math.floor(Math.random() * faces));
      const base = modo === 'soma' ? dados.reduce((a, b) => a + b, 0) : (modo === 'maior' ? Math.max(...dados) : Math.min(...dados));
      const total = base + mod;
      await registrarRolagemMesa(total, `Dado Livre: ${qtd}d${faces} (${modo})`, `[${dados.join(',')}]${mod ? ` + (${mod})` : ''}`);

    window.executarDescanso = async (tipo) => {

    window.trocarArvoreModal = (id) => {
      arvoreAtivaId = id;

    window.zoomArvore = (f) => { tZoom = Math.min(2, Math.max(0.35, tZoom * f)); aplicarTransformArvore(); };
    window.resetZoomArvore = () => { tZoom = 1; tPanX = 0; tPanY = 0; aplicarTransformArvore(); };
    function aplicarTransformArvore() {
      const st = getEl('#tv-stage');
      if (st) st.style.transform = `translate(${tPanX}px, ${tPanY}px) scale(${tZoom})`;
    }

    function iniciarPanZoomArvore() {
      const wrap = getEl('#tv-wrap');
      if (!wrap) return;
      let pan = false, sx = 0, sy = 0;
      wrap.onpointerdown = e => {
        if (e.target.closest('.tnode, button, select')) return;
        pan = true; sx = e.clientX - tPanX; sy = e.clientY - tPanY;
        wrap.classList.add('panning');
        wrap.setPointerCapture(e.pointerId);
      };
      wrap.onpointermove = e => { if (!pan) return; tPanX = e.clientX - sx; tPanY = e.clientY - sy; aplicarTransformArvore(); };
      const stopPan = () => { pan = false; wrap.classList.remove('panning'); };
      wrap.onpointerup = stopPan;
      wrap.onpointercancel = stopPan;
    }

    function contarSubarvore(arvore, rootId, desbSet, visitados = new Set()) {
      if (!desbSet.has(rootId) || visitados.has(rootId)) return 0;
      visitados.add(rootId);
      let c = 1;
      (arvore.nos || [])
        .filter(n => (n.requisitos || []).includes(rootId))
        .forEach(ch => { c += contarSubarvore(arvore, ch.id, desbSet, visitados); });
      return c;
    }

    function noPertenceSubarvore(arvore, rootId, targetId, visitados = new Set()) {
      if (rootId === targetId) return true;
      if (visitados.has(rootId)) return false;
      visitados.add(rootId);
      const filhos = (arvore.nos || []).filter(n => (n.requisitos || []).includes(rootId));
      return filhos.some(ch => noPertenceSubarvore(arvore, ch.id, targetId, visitados));
    }

    function obterAncestraisNo(arvore, nodeId, visitados = new Set()) {
      const no = (arvore.nos || []).find(n => n.id === nodeId);
      if (!no) return [];
      const res = [];
      (no.requisitos || []).forEach(paiId => {
        if (visitados.has(paiId)) return;
        visitados.add(paiId);
        const pai = (arvore.nos || []).find(n => n.id === paiId);
        if (pai) {
          res.push(pai, ...obterAncestraisNo(arvore, paiId, visitados));
        }
      });
      return res;
    }

    function opcaoEstaDisponivel(opt) {
      if (!opt) return false;
      const tipo = opt.tipo || (opt.attr ? 'atributo' : 'outro');
      if (tipo === 'atributo' && opt.attr) {
        return (computado.attr[opt.attr] || 0) < computado.teto;
      }
      return true;
    }

    function statusNoArvore(arvore, node) {
      if (!fichaDoc?.criacaoFinalizada) {
        return { st: 'lock', msg: 'Finalize a criação da ficha para evoluir' };
      }

      const desb = new Set((fichaDoc.nosDesbloqueados || {})[arvore.id] || []);
      if (desb.has(node.id)) return { st: 'done', msg: 'Desbloqueado' };

      const ehDupla = fichaDoc.raizesHeranca?.tipo === 'dupla';
      const ancestrais = obterAncestraisNo(arvore, node.id);

      // Verifica bloqueios exclusivos e restritivos em toda a cadeia ancestral
      for (const anc of ancestrais) {
        const caminhos = (arvore.nos || []).filter(n => (n.requisitos || []).includes(anc.id));
        if (caminhos.length <= 1) continue;

        const meusCaminhos = caminhos.filter(c => noPertenceSubarvore(arvore, c.id, node.id));
        const outrosCaminhos = caminhos.filter(c => !meusCaminhos.some(mc => mc.id === c.id));

        if (anc.tipoRamificacao === 'exclusiva') {
          const outroEscolhido = outrosCaminhos.some(oc => contarSubarvore(arvore, oc.id, desb) > 0);
          if (outroEscolhido) {
            return { st: 'block', msg: 'Bloqueado por Escolha Exclusiva.' };
          }
        }

        if (anc.tipoRamificacao === 'restritiva' && !ehDupla) {
          const lim = parseInt(anc.limiteNosSecundarios) || 1;
          const outroPassouLimite = outrosCaminhos.some(oc => contarSubarvore(arvore, oc.id, desb) > lim);
          if (outroPassouLimite) {
            const nosNoMeuCaminho = meusCaminhos.reduce((acc, mc) => Math.max(acc, contarSubarvore(arvore, mc.id, desb)), 0);
            if (nosNoMeuCaminho >= lim) {
              return { st: 'block', msg: `Bloqueado: limite restritivo de ${lim} nó(s) atingido neste caminho.` };
            }
          }
        }
      }

      const reqs = node.requisitos || [];
      if (reqs.length && !reqs.every(r => desb.has(r))) return { st: 'lock', msg: 'Requer nó anterior.' };

      if (node.tipoRecompensa === 'atributo' || node.tipoRecompensa === 'ambiguo') {
        const opts = node.opcoesAmbiguas || [];
        if (opts.length && !opts.some(opcaoEstaDisponivel)) {
          return { st: 'block', msg: `Atributo no teto biológico (${computado.teto}).` };
        }
      }

      const custo = parseInt(node.custoPontos) || 1;
      if ((fichaDoc.pontosEvolucao || 0) < custo) return { st: 'lock', msg: `Requer ${custo} PT.` };
      return { st: 'avail', msg: `Comprar por ${custo} PT` };
    }

    function arvoreConcedeBonusRaizUnica(arvore) {
      if (!arvore || ehArvorePadrao(arvore)) return false;
      const h = fichaDoc?.raizesHeranca || {};
      return (h.tipo === 'heranca' || h.tipo === 'dupla') && Boolean(h.r1) && arvore.raizAssociada === h.r1;
    }

    function formatarResumoStatsHabilidade(c, herancaSing = null, singAtiva = false, bonusRaizUnicaRec = 0) {
      if (!c) return [];
      const pills = [];
      const redPe = singAtiva ? (parseInt(herancaSing?.reducaoPe) || 0) : 0;
      const bonusSing = singAtiva ? (parseInt(herancaSing?.bonusExtra) || 0) : 0;

      const catMap = { ativo: 'Ativo', reativo: 'Reativo', passivo: 'Passivo', estatistico: 'Estatístico' };
      if (c.cat) pills.push({ cls: '', txt: `Tipo: ${catMap[c.cat] || c.cat}` });

      const fVal = Math.max(0, (parseInt(c.f) || 0) - redPe);
      const mVal = Math.max(0, (parseInt(c.m) || 0) - redPe);
      if (fVal > 0) pills.push({ cls: 'pef', txt: `Custo: ${fVal} PE-F` });
      if (mVal > 0) pills.push({ cls: 'pem', txt: `Custo: ${mVal} PE-M` });
      if (fVal === 0 && mVal === 0 && (c.cat === 'ativo' || c.cat === 'reativo')) {
        pills.push({ cls: 'bonus', txt: 'Custo: 0 PE' });
      }

      if (c.efTipo && c.efTipo !== 'nenhum') {
        const ehRecurso = ['hp', 'san', 'pef', 'pem'].includes(c.efTipo);
        const extraUnica = ehRecurso ? bonusRaizUnicaRec : 0;
        const vTotal = (parseInt(c.efVal) || 0) + bonusSing + extraUnica;
        const sufixoUnica = extraUnica > 0 ? ' (inclui +2 Raiz Única)' : '';
        const mapaEf = {
          hp: `+${vTotal} HP Máx${sufixoUnica}`,
          san: `+${vTotal} SAN Máx${sufixoUnica}`,
          pef: `+${vTotal} PE-F Máx${sufixoUnica}`,
          pem: `+${vTotal} PE-M Máx${sufixoUnica}`,
          teste: `+${vTotal} no Teste`
        };
        pills.push({ cls: 'bonus', txt: `Efeito: ${mapaEf[c.efTipo] || `${c.efTipo} +${vTotal}`}` });
      }

      if (c.bonusPericia) {
        Object.entries(c.bonusPericia).forEach(([k, v]) => {
          pills.push({ cls: 'bonus', txt: `Perícia: +${(parseInt(v) || 0) + bonusSing} ${k}` });
        });
      }

      const crit = parseInt(c.critMod) || 0;
      if (crit !== 0) {
        pills.push({ cls: 'crit', txt: `Margem Crít.: ${crit > 0 ? '+' + crit : crit}` });
      }

      if (herancaSing && (herancaSing.descricao || herancaSing.reducaoPe || herancaSing.bonusExtra)) {
        const extras = [];
        if (herancaSing.reducaoPe) extras.push(`-${herancaSing.reducaoPe} PE`);
        if (herancaSing.bonusExtra) extras.push(`+${herancaSing.bonusExtra} Bônus`);
        pills.push({
          cls: 'sing',
          txt: `★ Herança${singAtiva ? ' (Ativa)' : ''}${extras.length ? ': ' + extras.join(', ') : ''}`
        });
      }

      return pills;
    }

    function infoVisualTipoNo(n) {
      const t = n.tipoRecompensa || 'habilidade';
      if (t === 'atributo' || t === 'ambiguo') {
        const opA = n.opcoesAmbiguas?.[0]?.efeito || 'Opção A';
        const opB = n.opcoesAmbiguas?.[1]?.efeito || 'Opção B';
        return {
          badge: t === 'atributo' ? 'ATRIBUTO / ALT' : 'AMBÍGUO',
          cls: t === 'atributo' ? 'tb-atributo' : 'tb-ambiguo',
          resumo: `A: ${opA} · B: ${opB}`
        };
      }
      if (t === 'pericia') {
        const perTxt = n.conteudo?.bonusPericia
          ? Object.entries(n.conteudo.bonusPericia).map(([k, v]) => `+${v} ${k}`).join(' · ')
          : '';
        return { badge: 'PERÍCIA', cls: 'tb-pericia', resumo: perTxt || n.conteudo?.descricao || '' };
      }
      const c = n.conteudo || {};
      const custos = [];
      if (parseInt(c.f) > 0) custos.push(`${c.f} PE-F`);
      if (parseInt(c.m) > 0) custos.push(`${c.m} PE-M`);
      const prefixo = custos.length ? `[${custos.join(' + ')}] ` : '';
      return { badge: 'HABILIDADE', cls: 'tb-habilidade', resumo: prefixo + (c.descricao || '') };
    }

    function renderizarArvoreNoModal() {
      const arvore = obterArvoresMescladas().find(a => a.id === arvoreAtivaId);
      const grid = getEl('#tv-grid');
      const stage = getEl('#tv-stage');
      if (!arvore || !grid || !stage) return;

      const elPt = getEl('#mod-pt');
      if (elPt) elPt.textContent = `PT: ${fichaDoc.pontosEvolucao || 0}`;
      grid.innerHTML = '';

      const nodeMap = new Map((arvore.nos || []).map(n => [n.id, n]));
      const children = new Map((arvore.nos || []).map(n => [n.id, []]));
      const parent = new Map();
      (arvore.nos || []).forEach(n => {
        const v = (n.requisitos || []).filter(id => nodeMap.has(id));
        if (v.length) { parent.set(n.id, v[0]); children.get(v[0]).push(n); }
      });

      const roots = (arvore.nos || []).filter(n => !parent.has(n.id));
      const pos = new Map(), vis = new Set(), step = 245;
      function place(n, d, cur) {
        if (vis.has(n.id)) return { cur, c: 0 };
        vis.add(n.id);
        const kids = children.get(n.id) || [];
        let c;
        if (!kids.length) { c = cur + step / 2; cur += step; }
        else {
          const cs = [];
          kids.forEach(k => { const r = place(k, d + 1, cur); cur = r.cur; cs.push(r.c); });
          c = (cs[0] + cs[cs.length - 1]) / 2;
        }
        pos.set(n.id, { x: c, d });
        return { cur, c };
      }

      let cur = 0;
      roots.forEach(r => { cur = place(r, 0, cur).cur + 65; });
      (arvore.nos || []).forEach(n => { if (!vis.has(n.id)) cur = place(n, 0, cur).cur + 65; });

      const maxD = Math.max(0, ...[...pos.values()].map(p => p.d));
      const levels = Array.from({ length: maxD + 1 }, () => []);
      (arvore.nos || []).forEach(n => { const p = pos.get(n.id); if (p) levels[p.d].push(n); });

      const gridW = Math.max(880, cur);
      grid.style.width = `${gridW}px`;
      stage.style.width = `${gridW + 640}px`;
      stage.style.height = `${(maxD + 1) * 180 + 640}px`;

      for (let d = maxD; d >= 0; d--) {
        const row = document.createElement('div');
        row.className = 'tree-lvl';
        (levels[d] || []).forEach(n => {
          const st = statusNoArvore(arvore, n);
          const visTipo = infoVisualTipoNo(n);
          const el = document.createElement('div');
          el.id = `tv-n-${n.id}`;
          el.className = `tnode ${st.st}${noInspecionadoId === n.id ? ' selected' : ''}`;
          el.style.left = `${pos.get(n.id).x}px`;
          el.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; gap:4px; margin-bottom:3px">
              <span class="tbadge ${visTipo.cls}">${visTipo.badge}</span>
              <span class="tag">${st.st === 'done' ? '✓ Obtido' : `${n.custoPontos || 1} PT`}</span>
            </div>
            <div class="cz" style="font-weight:700; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${n.titulo}</div>
            <div class="mut" style="font-style:normal; font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${visTipo.resumo}</div>
          `;
          el.onclick = () => selecionarNoParaCompra(arvore, n, st);
          row.appendChild(el);
        });
        grid.appendChild(row);
      }

      requestAnimationFrame(() => {
        const svg = getEl('#tv-svg');
        const badgesLayer = getEl('#tv-badges');
        if (!svg || !badgesLayer) return;

        svg.setAttribute('width', grid.offsetWidth + 640);
        svg.setAttribute('height', grid.offsetHeight + 640);
        svg.innerHTML = '';
        badgesLayer.innerHTML = '';

        const desb = new Set((fichaDoc.nosDesbloqueados || {})[arvore.id] || []);

        (arvore.nos || []).forEach(n => {
          const tEl = getEl(`#tv-n-${n.id}`);
          if (!tEl) return;

          const filhos = (arvore.nos || []).filter(f => (f.requisitos || []).includes(n.id));
          if (filhos.length > 1 && (n.tipoRamificacao === 'exclusiva' || n.tipoRamificacao === 'restritiva')) {
            const px = grid.offsetLeft + tEl.offsetLeft;
            const py = grid.offsetTop + tEl.parentElement.offsetTop + tEl.offsetTop - 12;
            const pill = document.createElement('div');
            pill.className = `branch-pill bp-${n.tipoRamificacao}`;
            pill.style.left = `${px}px`;
            pill.style.top = `${py}px`;
            pill.textContent = n.tipoRamificacao === 'exclusiva'
              ? '⚡ EXCLUSIVA (Escolha 1)'
              : `🔒 RESTRITIVA (Máx ${n.limiteNosSecundarios || 1} nó)`;
            badgesLayer.appendChild(pill);
          }

          (n.requisitos || []).forEach(rId => {
            const sEl = getEl(`#tv-n-${rId}`);
            const paiObj = nodeMap.get(rId);
            if (!sEl) return;

            const x1 = grid.offsetLeft + sEl.offsetLeft;
            const y1 = grid.offsetTop + sEl.parentElement.offsetTop + sEl.offsetTop;
            const x2 = grid.offsetLeft + tEl.offsetLeft;
            const y2 = grid.offsetTop + tEl.parentElement.offsetTop + tEl.offsetTop + tEl.offsetHeight;
            const deltaY = Math.max(26, Math.abs(y2 - y1) / 2);

            const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            p.setAttribute('d', Math.abs(x1 - x2) < 5
              ? `M ${x1} ${y1} L ${x2} ${y2}`
              : `M ${x1} ${y1} C ${x1} ${y1 - deltaY}, ${x2} ${y2 + deltaY}, ${x2} ${y2}`);

            const comprado = desb.has(n.id) && desb.has(rId);
            const corLinha = comprado ? '#4cc36f'
              : paiObj?.tipoRamificacao === 'exclusiva' ? '#ff8c5a'
              : paiObj?.tipoRamificacao === 'restritiva' ? '#c78aff'
              : '#776';

            p.setAttribute('stroke', corLinha);
            p.setAttribute('stroke-width', comprado ? '2.5' : '2');
            if (!comprado && paiObj?.tipoRamificacao === 'exclusiva') p.setAttribute('stroke-dasharray', '6 4');
            p.setAttribute('fill', 'none');
            svg.appendChild(p);
          });
        });
      });
    }

    function selecionarNoParaCompra(arvore, node, st) {
      noInspecionadoId = node.id;
      document.querySelectorAll('.tnode').forEach(el => el.classList.toggle('selected', el.id === `tv-n-${node.id}`));

      const box = getEl('#tv-detalhes');
      box.hidden = false;
      const visTipo = infoVisualTipoNo(node);
      const temOpcoes = (node.tipoRecompensa === 'atributo' || node.tipoRecompensa === 'ambiguo') && node.opcoesAmbiguas?.length >= 2;
      const jaDesbloqueado = st.st === 'done';
      const escolhaSalva = (fichaDoc.escolhasAmbiguas || {})[node.id];

      let seletorHtml = '';
      if (temOpcoes) {
        if (jaDesbloqueado) {
          const optEsc = node.opcoesAmbiguas.find(o => o.idOpcao === escolhaSalva) || node.opcoesAmbiguas[0];
          seletorHtml = `<span class="chip">Escolhido: ${optEsc.efeito}</span>`;
        } else {
          const optsHtml = node.opcoesAmbiguas.map(o => {
            const disp = opcaoEstaDisponivel(o);
            return `<option value="${o.idOpcao}" ${!disp ? 'disabled' : ''}>${o.efeito}${!disp ? ` (Teto ${computado.teto})` : ''}</option>`;
          }).join('');
          seletorHtml = `<select id="sel-opt-amb" ${st.st !== 'avail' ? 'disabled' : ''}>${optsHtml}</select>`;
        }
      }

      const h = fichaDoc?.raizesHeranca || {};
      const singAtiva = h.tipo === 'heranca' && h.r1 === arvore.raizAssociada && Boolean(node.herancaSingular);
      const bonusRaizUnicaRec = arvoreConcedeBonusRaizUnica(arvore) ? 2 : 0;
      const pills = formatarResumoStatsHabilidade(node.conteudo || {}, node.herancaSingular, singAtiva, bonusRaizUnicaRec);
      const pillsHtml = pills.length
        ? `<div class="hab-stats-row">${pills.map(p => `<span class="stat-pill ${p.cls}">${p.txt}</span>`).join('')}</div>`
        : '';

      const infoOpcoesTexto = temOpcoes
        ? `<div style="margin-top:5px; font-size:12px; display:grid; gap:3px">${node.opcoesAmbiguas.map((op, i) => {
            const letra = op.idOpcao ? op.idOpcao.toUpperCase() : String.fromCharCode(65 + i);
            const descOp = op.habilidade?.descricao ? ` — <span class="mut" style="font-style:normal">${op.habilidade.descricao}</span>` : '';
            const pillsOp = op.habilidade ? formatarResumoStatsHabilidade(op.habilidade, null, false, bonusRaizUnicaRec).map(p => `<span class="stat-pill ${p.cls}">${p.txt}</span>`).join(' ') : '';
            return `<div><b>Opção ${letra}:</b> ${op.efeito}${descOp} ${pillsOp}</div>`;
          }).join('')}</div>`
        : '';

      const reqNomes = (node.requisitos || [])
        .map(rId => (arvore.nos || []).find(x => x.id === rId)?.titulo)
        .filter(Boolean);

      box.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap">
          <div style="flex:1; min-width:260px">
            <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap">
              <span class="tbadge ${visTipo.cls}">${visTipo.badge}</span>
              <b class="cz" style="color:var(--acc); font-size:14px">${node.titulo}</b>
              <span class="tag">Custo: ${node.custoPontos || 1} PT</span>
              ${reqNomes.length ? `<span class="tag">Req.: ${reqNomes.join(', ')}</span>` : '<span class="tag">Nó Inicial</span>'}
            </div>
            ${pillsHtml}
            <p style="margin:6px 0 3px; font-size:12.5px; line-height:1.45">${node.conteudo?.descricao || visTipo.resumo}</p>
            ${infoOpcoesTexto}
            ${node.herancaSingular?.descricao ? `<p style="margin:4px 0 0; font-size:11.5px; color:var(--acc)">★ <b>Herança Singular${singAtiva ? ' (Ativa no seu personagem)' : ''}:</b> ${node.herancaSingular.descricao}</p>` : ''}
          </div>
          <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:2px">
            ${seletorHtml}
            <button class="btn pri" id="btn-exec-compra" ${st.st !== 'avail' ? 'disabled' : ''}>${st.msg}</button>
          </div>
        </div>
      `;

      if (temOpcoes && !jaDesbloqueado) {
        const sel = getEl('#sel-opt-amb');
        const primeiraValida = node.opcoesAmbiguas.find(opcaoEstaDisponivel);
        if (sel && primeiraValida) sel.value = primeiraValida.idOpcao;
      }

      if (st.st === 'avail') {
        getEl('#btn-exec-compra').onclick = async () => {
          const custo = parseInt(node.custoPontos) || 1;
          const upd = {
            pontosEvolucao: (fichaDoc.pontosEvolucao || 0) - custo,
            [`nosDesbloqueados.${arvore.id}`]: [...((fichaDoc.nosDesbloqueados || {})[arvore.id] || []), node.id]
          };
          if (temOpcoes) {
            const esc = getEl('#sel-opt-amb').value;
            const opt = node.opcoesAmbiguas.find(o => o.idOpcao === esc);
            if (!opcaoEstaDisponivel(opt)) {
              return mostrarToast(`Atributo já atingiu o teto (${computado.teto})! Escolha a alternativa.`);
            }
            upd[`escolhasAmbiguas.${node.id}`] = esc;
          }
          await updateDoc(doc(db, "fichas", fichaId), upd);
          box.hidden = true;
          noInspecionadoId = null;
          mostrarToast(`"${node.titulo}" desbloqueado!`);
        };
      }
    }

    /* ---------- Histórico Lateral ---------- */
    function renderizarHistoricoLateral(lista) {
      const cont = getEl('#hist-list');
      cont.innerHTML = lista.length ? lista.map(r => `
        <div class="hist-item">
          <div style="display:flex; justify-content:space-between; align-items:baseline">
            <b class="cz" style="color:var(--acc); font-size:11px">${r.personagemNome || 'Personagem'}</b>
            <b class="cz" style="font-size:16px; color:var(--acc)">${r.total}</b>
          </div>
          <div style="font-size:11px">${r.descricao || ''}</div>
          <div class="mut" style="font-style:normal; font-family:monospace; font-size:10px">${r.detalhes || ''}</div>
        </div>
      `).join('') : '<span class="mut">Nenhuma rolagem ainda.</span>';
    }

    /* ---------- Inicialização e Listeners Tempo Real ---------- */
    function sincronizarTelaCompleta() {
      if (!mesaDados || !fichaDoc) return;
      RAIZES = {
        ...RAIZES_PADRAO,
        ...(mesaDados.raizesDisponiveis || {})
      };
      regras = {
        ...REGRAS_PADRAO,
        ...(mesaDados.regras || {}),
        tetosPorEstagio: { ...REGRAS_PADRAO.tetosPorEstagio, ...(mesaDados.regras?.tetosPorEstagio || {}) }
      };
      computado = calcularEstadoFicha();
      maximosRecursos = computado.maxRec;

      aplicarVisual();
      construirCabecalho();
      atualizarValoresRecursos();
      construirRodaAtributos();
      renderizarPericias();
      renderizarHabilidades();
      renderizarInventario();
      renderizarMacros();
      renderizarSelecaoTeste();

      // Atualiza modais dinâmicos abertos em tempo real
      if (!getEl('#modal').hidden) {
        if (modalContextoAtual === 'arvore') renderizarArvoreNoModal();
        else if (modalContextoAtual === 'passatempos') abrirModalPassatempos();
        else if (modalContextoAtual === 'raizes') abrirModalSeletorRaizes();
      }
    }

    onAuthStateChanged(auth, (user) => {
      if (!user) return window.location.href = '../index.html';

      construirInterfaceRecursos();
      montarColunasLayout();
      inicializarDragAndDrop();

      onSnapshot(doc(db, "mesas", mesaId), (snap) => {
        if (!snap.exists()) return window.location.href = '../index.html';
        mesaDados = snap.data();
        sincronizarTelaCompleta();
      });

      onSnapshot(doc(db, "fichas", fichaId), (snap) => {
        if (!snap.exists()) return window.location.href = `mesa.html?id=${mesaId}`;
        fichaDoc = snap.data();
        sincronizarTelaCompleta();
      });

      const qRolagens = query(collection(db, "rolagens"), where("mesaId", "==", mesaId));
      onSnapshot(qRolagens, (snap) => {
        const lista = [];
        snap.forEach(d => lista.push(d.data()));
        lista.sort((a, b) => (b.criadoEm?.toMillis?.() || Date.now()) - (a.criadoEm?.toMillis?.() || Date.now()));
        renderizarHistoricoLateral(lista.slice(0, 25));
      });
    });
  </script>
</body>
