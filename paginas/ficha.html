<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" data-pal="ouro">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PANTHEON · Ficha</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Faustina:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --h: 40;
      --acc: hsl(var(--h) 70% 50%);
      --on: #140f08;
      --bg: hsl(var(--h) 10% 3%);
      --card: hsl(var(--h) 15% 6%);
      --card2: hsl(var(--h) 20% 13%);
      --line: hsl(var(--h) 30% 26%);
      --txt: hsl(var(--h) 25% 88%);
      --mut: hsl(var(--h) 12% 60%);
    }

    [data-theme="light"] {
      --acc: hsl(var(--h) 65% 36%);
      --on: #fff;
      --bg: hsl(var(--h) 35% 92%);
      --card: hsl(var(--h) 40% 98%);
      --card2: hsl(var(--h) 30% 91%);
      --line: hsl(var(--h) 25% 76%);
      --txt: hsl(var(--h) 30% 12%);
      --mut: hsl(var(--h) 15% 38%);
    }

    [data-pal="carmesim"] { --h: 355; }
    [data-pal="esmeralda"] { --h: 150; }
    [data-pal="safira"] { --h: 210; }
    [data-pal="violeta"] { --h: 270; }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 14px;
      background: var(--bg);
      color: var(--txt);
      font-family: Faustina, Georgia, serif;
      font-size: 14px;
      line-height: 1.4;
    }

    .cz, h2, .btn, .nome-personagem { font-family: Cinzel, Georgia, serif; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--acc);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .blk.minimized h2 { margin-bottom: 0; }
    .blk.minimized .blk-body { display: none; }

    .grip { cursor: grab; color: var(--mut); user-select: none; font-size: 15px; }
    .r { margin-left: auto; display: flex; gap: 5px; align-items: center; }

    button, input, select { font: inherit; color: inherit; }

    .btn {
      background: var(--card2);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 11px;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn:hover:not(:disabled), .btn.on { border-color: var(--acc); color: var(--acc); }
    .btn:disabled { opacity: 0.42; cursor: not-allowed; }
    .btn.pri {
      background: var(--acc) !important;
      color: var(--on) !important;
      border-color: var(--acc) !important;
      font-weight: 700;
    }

    input, select {
      background: var(--card2);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 8px;
      min-width: 0;
    }
    input:focus, select:focus { outline: none; border-color: var(--acc); }
    input:disabled, select:disabled { opacity: 0.65; cursor: not-allowed; }
    input[type=number] { -moz-appearance: textfield; }
    input::-webkit-inner-spin-button, input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

    /* Cabeçalho */
    .head { display: grid; gap: 8px; }

    .nome-personagem {
      font-size: 21px;
      font-weight: 700;
      width: 100%;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      color: var(--acc);
      padding: 2px 0;
    }

    .rz {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
      font-size: 12px;
    }
    .rz label { color: var(--mut); font-weight: 600; }

    .chip {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      padding: 3px 9px;
      border-radius: 99px;
      border: 1px solid var(--line);
      background: var(--card2);
      font: 600 11px monospace;
    }
    .chip.acc { border-color: var(--acc); }

    .form-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding-top: 7px;
      border-top: 1px solid var(--line);
      font-size: 12px;
    }
    .form-group {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
    }
    .form-lbl {
      font-family: Cinzel, serif;
      font-size: 10px;
      font-weight: 700;
      color: var(--acc);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Grade Visual de Passatempos e Raízes no Modal */
    .pass-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }
    .pass-card {
      background: var(--card2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 11px;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.12s;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .pass-card:hover {
      border-color: var(--acc);
      transform: translateY(-2px);
    }
    .pass-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .pass-card-title {
      font-family: Cinzel, serif;
      font-weight: 700;
      font-size: 12px;
      color: var(--acc);
      text-transform: uppercase;
    }
    .pass-card-desc {
      font-family: monospace;
      font-size: 11px;
      color: var(--txt);
    }

    .raiz-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 9px;
      margin-top: 8px;
    }
    .raiz-card {
      background: var(--card2);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .raiz-card.r-pri { border-color: var(--acc); box-shadow: inset 0 0 0 1px var(--acc); }
    .raiz-card.r-sec { border-color: #4fb0e0; box-shadow: inset 0 0 0 1px #4fb0e0; }

    /* Layout Principal */
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 290px;
      gap: 12px;
      align-items: start;
    }
    .workspace.no-hist { grid-template-columns: minmax(0, 1fr); }
    .workspace.no-hist .hist-side { display: none; }
    @media (max-width: 1120px) { .workspace { grid-template-columns: 1fr; } }

    .cols {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      align-items: start;
    }
    .col { min-height: 80px; }
    @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }

    .dragging { opacity: 0.4; }
    .col.over { outline: 1px dashed var(--acc); outline-offset: 4px; }

    /* Histórico Lateral */
    .hist-side { position: sticky; top: 12px; }
    .hist-list { max-height: 72vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .hist-item { background: var(--card2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; font-size: 12px; }

    /* Recursos */
    .res { margin-bottom: 11px; }
    .rt { display: flex; justify-content: space-between; font: 700 12px monospace; }
    .bar { height: 9px; border-radius: 5px; background: var(--card2); border: 1px solid var(--line); overflow: hidden; margin-top: 3px; }
    .bar i { display: block; height: 100%; transition: width 0.25s; }
    .ctl { display: flex; gap: 5px; margin-top: 5px; }
    .ctl input { width: 64px; text-align: center; }
    .sg { width: 28px; font-weight: 700; padding: 0; }
    .sg.add { color: #4cc36f; }
    .sg.sub { color: #e05555; }

    /* Roda de Atributos */
    .wheel { position: relative; width: min(100%, 295px); aspect-ratio: 1; margin: 6px auto; }
    .wheel svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .ctr { position: absolute; left: 50%; top: 51.7%; transform: translate(-50%, -50%); text-align: center; color: var(--mut); font-size: 10px; line-height: 1.1; }
    .ctr b { display: block; font: 700 20px Cinzel, serif; color: var(--acc); }
    .node {
      position: absolute;
      width: 19.5%;
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: var(--card);
      border: 2px solid var(--acc);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      box-shadow: 0 2px 8px #0006;
    }
    .node b { font: 700 9px Cinzel, serif; letter-spacing: 0.04em; }
    .node input { width: 72%; text-align: center; background: transparent; border: 0; font: 700 17px Cinzel, serif; padding: 0; color: var(--txt); }
    .c-r { color: #e06a5a; }
    .c-b { color: #4fb0e0; }
    .c-p { color: #b480e6; }
    .node.on { background: var(--acc); }
    .node.on b, .node.on input { color: var(--on); }

    /* Perícias, Habilidades e Macros */
    .prow, .hcard, .mrow {
      background: var(--card2);
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 6px 9px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .prow, .mrow { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
    .prow.on, .hcard.on { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc); }
    .hcard p { margin: 3px 0; font-size: 12px; color: var(--mut); }
    .hab-filters {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }
    .hab-filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
    }
    .hab-stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 5px;
    }
    .stat-pill {
      font: 700 10px monospace;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--card2);
      border: 1px solid var(--line);
      color: var(--txt);
    }
    .stat-pill.pef { border-color: #e0a03088; color: #f5b949; }
    .stat-pill.pem { border-color: #3da5d988; color: #5cc2f5; }
    .stat-pill.bonus { border-color: #4cc36f88; color: #67df89; }
    .stat-pill.crit { border-color: #e0555588; color: #f87171; }
    .stat-pill.sing { border-color: var(--acc); color: var(--acc); }
    .hcard .t { display: flex; justify-content: space-between; gap: 6px; font-family: Cinzel, serif; font-weight: 700; color: var(--acc); font-size: 12px; }
    .tag { font: 700 9px monospace; text-transform: uppercase; padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; color: var(--mut); }
    .x { background: none; border: 0; color: var(--mut); cursor: pointer; }
    .x:hover { color: #e05555; }

    /* ============================================================ */
    /* INVENTÁRIO EM BLOCOS DINÂMICOS (SEM DIVISÃO INTERNA)         */
    /* ============================================================ */
    .inv-group { margin-bottom: 10px; }
    .inv-group-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font: 700 10px monospace;
      text-transform: uppercase;
      margin-bottom: 4px;
      color: var(--mut);
    }
    .inv-row-blocks {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: stretch;
    }
    .inv-grid-miudeza {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 5px;
    }

    .inv-block {
      flex: 1 1 88px;
      min-width: 78px;
      max-width: 140px;
      min-height: 74px;
      border-radius: 8px;
      background: var(--card2);
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      position: relative;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .inv-block.conv-child {
      flex: 1 1 68px;
      min-width: 64px;
    }
    .inv-block.miudeza {
      min-width: 0;
      max-width: none;
      min-height: 52px;
      padding: 3px;
    }

    .inv-block.b-pesado  { border: 2px solid #e05252; }
    .inv-block.b-medio   { border: 2px solid #eab308; }
    .inv-block.b-leve    { border: 2px solid #22c55e; }
    .inv-block.b-miudeza { border: 2px solid #38bdf8; }

    .inv-block.drag-over {
      box-shadow: 0 0 0 2px #fff, 0 0 12px var(--acc);
      transform: scale(1.03);
    }

    .inv-block-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font: 700 8px monospace;
      color: var(--mut);
      line-height: 1;
    }

    .inv-empty-cell {
      flex: 1;
      border-radius: 5px;
      border: 1px dashed var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font: 700 8px monospace;
      color: var(--mut);
    }

    .inv-item-tile {
      flex: 1;
      width: 100%;
      border-radius: 5px;
      background: var(--card);
      border: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      text-align: center;
    }
    .inv-item-tile.equipped {
      border-color: var(--acc);
      box-shadow: inset 0 0 0 1px var(--acc);
    }
    .inv-item-tile img {
      width: 32px;
      height: 32px;
      object-fit: cover;
      border-radius: 4px;
    }
    .inv-block.miudeza .inv-item-tile img { width: 22px; height: 22px; }

    .inv-item-name {
      font-size: 9.5px;
      font-weight: 600;
      line-height: 1.1;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 2px;
    }
    .inv-eq-dot {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--acc);
    }

    /* Motor de Teste */
    .sl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 7px; min-height: 28px; }
    .sl > span.k { width: 68px; font-size: 11px; color: var(--mut); font-family: Cinzel, serif; }
    .hint { display: none; margin: 5px 0; padding: 6px 9px; border-radius: 6px; background: var(--card2); border: 1px dashed var(--acc); font-size: 12px; }
    [data-arm] .hint { display: block; }
    [data-arm=attr] .node,
    [data-arm=per] .prow,
    [data-arm=hab] .hcard.el { cursor: crosshair; animation: pulsarm 1.2s infinite; }
    [data-arm] .node input { pointer-events: none; }

    @keyframes pulsarm {
      50% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 35%, transparent); }
    }

    .pool { display: flex; justify-content: space-between; font: 600 12px monospace; background: var(--card2); padding: 6px 9px; border-radius: 6px; margin: 7px 0; }
    .out { margin-top: 8px; padding: 8px; border: 1px solid var(--acc); border-radius: 8px; background: var(--card2); }
    .tot { font: 700 30px Cinzel, serif; color: var(--acc); }
    .die { display: inline-flex; width: 24px; height: 24px; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 5px; font: 700 11px monospace; margin: 2px 2px 0 0; opacity: 0.55; }
    .die.pk { opacity: 1; border-color: var(--acc); color: var(--acc); }

    /* Modal & Árvores */
    .ov { position: fixed; inset: 0; background: #000c; display: flex; align-items: center; justify-content: center; padding: 14px; z-index: 9; }
    .ov[hidden] { display: none; }
    .mod { width: min(860px, 96vw); max-height: 88vh; overflow: auto; margin: 0; }
    .mod.mod-tree { width: min(1220px, 98vw); height: 90vh; max-height: 90vh; display: flex; flex-direction: column; }

    .tree-legend { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 11px; padding: 6px 10px; margin-bottom: 8px; background: var(--card2); border: 1px solid var(--line); border-radius: 7px; }
    .leg-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; }

    .tree-view-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--line) 45%, transparent) 1px, transparent 0) 0 0 / 24px 24px,
        var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    .tree-view-wrap.panning { cursor: grabbing; }
    .tree-stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
    .tree-grid { position: absolute; left: 320px; top: 320px; display: flex; flex-direction: column; gap: 96px; padding: 30px 0; }
    .tree-lvl { position: relative; height: 84px; width: 100%; }

    .tnode {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      width: 210px;
      min-height: 74px;
      padding: 7px 9px;
      border-radius: 9px;
      border: 2px solid var(--line);
      background: var(--card);
      cursor: pointer;
      font-size: 12px;
      box-shadow: 0 3px 10px #0007;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .tnode:hover { transform: translateX(-50%) translateY(-2px); }
    .tnode.done { border-color: #4cc36f; background: color-mix(in srgb, #4cc36f 14%, var(--card)); }
    .tnode.avail { border-color: var(--acc); box-shadow: 0 0 12px color-mix(in srgb, var(--acc) 35%, transparent); }
    .tnode.lock { opacity: 0.82; }
    .tnode.block { border-color: #e05555; opacity: 0.62; }
    .tnode.selected { outline: 2px solid #fff; outline-offset: 2px; }

    .tbadge { display: inline-block; font: 700 9px monospace; padding: 1px 5px; border-radius: 4px; text-transform: uppercase; }
    .tb-atributo { background: #3da5d928; color: #5cc2f5; border: 1px solid #3da5d966; }
    .tb-pericia  { background: #4cc36f28; color: #67df89; border: 1px solid #4cc36f66; }
    .tb-habilidade { background: #e0a03028; color: #f5b949; border: 1px solid #e0a03066; }
    .tb-ambiguo  { background: #b480e628; color: #cfa6f7; border: 1px solid #b480e666; }

    .branch-pill { position: absolute; transform: translate(-50%, -50%); font: 700 9px monospace; padding: 2px 6px; border-radius: 99px; pointer-events: none; white-space: nowrap; z-index: 2; }
    .bp-exclusiva { background: #2c1810; color: #ff8c5a; border: 1px solid #ff8c5a; }
    .bp-restritiva { background: #221430; color: #c78aff; border: 1px solid #c78aff; }

    .sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; }
    .sw.on { border-color: var(--txt); }

    #toast { position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 20px); background: var(--acc); color: var(--on); padding: 6px 14px; border-radius: 8px; opacity: 0; transition: 0.2s; pointer-events: none; z-index: 20; font-weight: 600; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    .mut { color: var(--mut); font-size: 12px; font-style: italic; }

    .sigla-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 6px; font-size: 12px; }
    .sigla-item { background: var(--card2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
    .sigla-item b { color: var(--acc); font-family: monospace; }
  </style>
</head>

<body>

  <!-- Cabeçalho Principal -->
  <header class="card head">
    <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap">
      <a id="btn-voltar" href="../index.html" class="btn" style="text-decoration:none">← Mesa</a>
      <input class="nome-personagem" id="nome" placeholder="Nome do personagem" style="flex:1; min-width:180px">
      <span class="chip" id="badge-etapa">Carregando...</span>
      <button class="btn pri" id="btn-finalizar" hidden onclick="finalizarCriacaoFicha()">🔒 Finalizar Criação</button>
      <button class="btn on" id="btn-arvores" onclick="abrirModalArvores('raiz')">🌳 Árvores (<span id="pt-badge">0</span> PT)</button>
      <button class="btn" id="btn-arvore-padrao" onclick="abrirModalArvorePadrao()" title="Árvore comum a todos os personagens">🧭 Padrão</button>
      <button class="btn" onclick="abrirModalDescanso()" title="Descanso">🏕 Descanso</button>
      <button class="btn" onclick="abrirLegendaSiglas()" title="Legenda das siglas e atributos">? Siglas</button>
      <button class="btn" id="btn-toggle-hist" onclick="alternarHistoricoLateral()">📜 Histórico</button>
      <button class="btn" onclick="abrirConfiguracaoAparencia()" title="Aparência">⚙</button>
    </div>

    <!-- Linha 2: Condição Familiar + Chips de Raiz + Botão Explorador de Raízes -->
    <div class="rz" id="linha-raizes"></div>

    <!-- Linha 3: Chips Limpos de Passatempos Infantis + Botão de Seleção -->
    <div class="form-bar" id="linha-passatempos"></div>
  </header>

  <!-- Área Principal -->
  <div class="workspace" id="workspace">
    <div class="cols" id="cols">
      <div class="col"></div>
      <div class="col"></div>
      <div class="col"></div>
    </div>

    <aside class="card hist-side" id="hist-side">
      <h2>
        📜 Histórico da Mesa
        <span class="r">
          <button class="btn" onclick="alternarHistoricoLateral()" title="Esconder histórico">✕</button>
        </span>

  <!-- Toast Notificação -->

  <script type="module">
    import {
      auth, db, onAuthStateChanged,
      doc, updateDoc, addDoc,
      collection, query, where, onSnapshot, serverTimestamp
    } from '../js/firebase-config.js';

    import {
      REGRAS_PADRAO,
      PERICIAS_LIVRO,
      RAIZES_PADRAO,
      PROFISSOES_LIVRO,
      PASSATEMPOS_PADRAO,
      ITENS_PADRAO,
      ARVORES_PADRAO
    } from '../js/sistema-padrao.js';

    const params = new URLSearchParams(window.location.search);
    const mesaId = params.get('mesaId');
    const fichaId = params.get('fichaId');
    if (!mesaId || !fichaId) window.location.href = '../index.html';

    const getEl = selector => document.querySelector(selector);
    getEl('#btn-voltar').href = `mesa.html?id=${mesaId}`;

    const ATRIBUTOS = [
      ['potencia', 'POT', 'r'],
      ['vigor', 'VIG', 'r'],
      ['destreza', 'DES', 'r'],
      ['percepcao', 'PER', 'b'],
      ['erudicao', 'ERU', 'b'],
      ['autoridade', 'AUT', 'p'],
      ['impeto', 'ÍMP', 'p']
    ];

    const ESTRUTURA_RECURSOS = [
      ['hp', 'HP (Vida)', '#d64545'],
      ['san', 'SAN (Sanidade)', '#9b59d0'],
      ['pef', 'PE-F (Energia Física)', '#e0a030'],
      ['pem', 'PE-M (Energia Mental)', '#3da5d9']
    ];

    const BONUS_ORFAO = RAIZES_PADRAO["Órfão"] || [2, -2, 2, 2];

    const LAYOUT_PADRAO = [
      ['recursos', 'atributos'],
      ['teste', 'macros'],
      ['pericias', 'habilidades', 'inventario']
    ];

    const ICONE_CAT = { arma: '⚔️', escudo: '🛡️', armadura: '🦺', cura: '🩹', utilitario: '🎒' };

    // Estado Firebase
    let mesaDados = null;
    let fichaDoc = null;
    let regras = { ...REGRAS_PADRAO };
    let RAIZES = { ...RAIZES_PADRAO };
    let computado = null;

    // Preferências visuais locais
    let layoutAtual = LAYOUT_PADRAO;
    let temaAtual = 'dark';
    let paletaAtual = 'ouro';
    let blocosMinimizados = {};
    let historicoOculto = false;
    let modoInvLista = false;

    // Estado de interação
    let modoArmado = null;
    let selecaoTeste = { attrs: [], per: null, hab: null };
    let sinalRecursos = { hp: -1, san: -1, pef: -1, pem: -1 };
    let maximosRecursos = {};
    let arvoreAtivaId = null;
    let noInspecionadoId = null;
    let modalContextoAtual = null;
    let tZoom = 1, tPanX = 0, tPanY = 0;

    try {
      const prefs = JSON.parse(localStorage.getItem('pantheon_ui_prefs'));
      if (prefs) {
        layoutAtual = prefs.layout || layoutAtual;
        temaAtual = prefs.theme || temaAtual;
        paletaAtual = prefs.pal || paletaAtual;
        blocosMinimizados = prefs.min || {};
        historicoOculto = Boolean(prefs.histHide);
        modoInvLista = Boolean(prefs.invLista);
      }
    } catch (e) {}

    function salvarPrefsLocais() {
      try {
        localStorage.setItem('pantheon_ui_prefs', JSON.stringify({
          layout: layoutAtual,
          theme: temaAtual,
          pal: paletaAtual,
          min: blocosMinimizados,
          histHide: historicoOculto,
          invLista: modoInvLista
        }));
      } catch (e) {}
    }

    function mostrarToast(mensagem) {
      const toast = getEl('#toast');
      toast.textContent = mensagem;
      toast.classList.add('show');
      clearTimeout(mostrarToast.timer);
      mostrarToast.timer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    const obterSiglaAtributo = chave => ATRIBUTOS.find(a => a[0] === chave)?.[1] || chave.toUpperCase();

    function ehArvorePadrao(arv) {
      if (!arv) return false;
      if (arv.isPadrao) return true;
      const raizNorm = String(arv.raizAssociada || '').trim().toLowerCase();
      return ['padrão', 'padrao', 'comum', 'geral'].includes(raizNorm);
    }

    /* ============================================================ */
    /* MESCLAGEM: BASE DO SISTEMA + ADICIONAIS DA MESA              */
    /* ============================================================ */
    function obterProfissoesMescladas() {
      return {
        ...PROFISSOES_LIVRO,
        ...(mesaDados?.profissoesDisponiveis || {})
      };
    }

    function obterArvoresMescladas() {
      const daMesa = mesaDados?.arvores || [];
      const idsMesa = new Set(daMesa.map(a => a.id));
      const baseFaltantes = ARVORES_PADRAO.filter(a => !idsMesa.has(a.id));
      return [...baseFaltantes, ...daMesa];
    }

    function obterCatalogoItensMesclado() {
      const daMesa = mesaDados?.catalogoItens || [];
      const idsMesa = new Set(daMesa.map(i => i.id));
      const baseFaltantes = ITENS_PADRAO.filter(i => !idsMesa.has(i.id));
      return [...baseFaltantes, ...daMesa];
    }

    function obterCatalogoPassatempos() {
      const mapa = new Map(PASSATEMPOS_PADRAO.map(p => [p.nome, p]));
      const listaMesa = mesaDados?.passatemposDisponiveis || [];

      listaMesa.forEach(item => {
        if (typeof item === 'string') {
          if (!mapa.has(item)) {
            mapa.set(item, { nome: item, tipo: 'focado', pericias: [item], desc: `+2 ${item}` });
          }
        } else if (item && item.nome) {
          mapa.set(item.nome, item);
        }
      });

      return [...mapa.values()];
    }

    /* ---------- Aparência, Minimização e Histórico ---------- */
    const PALETAS_CORES = { ouro: 40, carmesim: 355, esmeralda: 150, safira: 210, violeta: 270 };

    function aplicarVisual() {
      document.documentElement.dataset.theme = temaAtual;
      document.documentElement.dataset.pal = paletaAtual;
      getEl('#workspace').classList.toggle('no-hist', historicoOculto);
      getEl('#btn-modo-inv').textContent = modoInvLista ? '⊞ Blocos' : '☰ Lista';

      Object.entries(blocosMinimizados).forEach(([id, isMin]) => {
        const blk = getEl('#b-' + id);
        if (blk) {
          blk.classList.toggle('minimized', isMin);
          const btn = blk.querySelector('.min-btn');
          if (btn) btn.textContent = isMin ? '+' : '−';
        }
      });
    }

    window.alternarMinBloco = (id) => {
      blocosMinimizados[id] = !blocosMinimizados[id];
      aplicarVisual();
      salvarPrefsLocais();
    };

    window.alternarHistoricoLateral = () => {
      historicoOculto = !historicoOculto;
      aplicarVisual();
      salvarPrefsLocais();
    };

    window.alternarModoInventario = () => {
      modoInvLista = !modoInvLista;
      aplicarVisual();
      salvarPrefsLocais();
      renderizarInventario();
    };

    window.abrirLegendaSiglas = () => {
      abrirModal('Siglas e Atributos do Sistema', `
        <p class="cz" style="color:var(--acc); font-size:11px; margin:0 0 6px">7 Atributos Fundamentais</p>
        <div class="sigla-grid" style="margin-bottom:12px">
          <div class="sigla-item"><b class="c-r">POT (Potência)</b> — Força física bruta, impacto e dano corpo a corpo.</div>
          <div class="sigla-item"><b class="c-r">VIG (Vigor)</b> — Resistência corporal, HP máximo, PE-F e capacidade de carga.</div>
          <div class="sigla-item"><b class="c-r">DES (Destreza)</b> — Agilidade, reflexos, pontaria, PE-F e deslocamento.</div>
          <div class="sigla-item"><b class="c-b">PER (Percepção)</b> — Sentidos apurados, atenção aos detalhes e iniciativa.</div>
          <div class="sigla-item"><b class="c-b">ERU (Erudição)</b> — Conhecimento teórico, raciocínio lógico e PE-M.</div>
          <div class="sigla-item"><b class="c-p">AUT (Autoridade)</b> — Presença social, liderança, persuasão e comando.</div>
          <div class="sigla-item"><b class="c-p">ÍMP (Ímpeto)</b> — Força de vontade, resiliência mental, SAN e PE-M.</div>
        </div>
        <p class="cz" style="color:var(--acc); font-size:11px; margin:0 0 6px">Recursos e Combate</p>
        <div class="sigla-grid">
          <div class="sigla-item"><b>HP</b> — Pontos de Vida (Vitalidade física).</div>
          <div class="sigla-item"><b>SAN</b> — Sanidade (Estabilidade mental contra o Véu).</div>
          <div class="sigla-item"><b>PE-F</b> — Pontos de Energia Física (habilidades corporais).</div>
          <div class="sigla-item"><b>PE-M</b> — Pontos de Energia Mental (habilidades místicas).</div>
          <div class="sigla-item"><b>PT</b> — Pontos de Evolução para desbloquear nós nas Árvores.</div>
          <div class="sigla-item"><b>GA / GD</b> — Grau de Ataque / Grau de Defesa da arma ou escudo.</div>
          <div class="sigla-item"><b>RD</b> — Redução de Dano fornecida por armaduras.</div>
          <div class="sigla-item"><b>DESL</b> — Deslocamento em metros por turno (5 + DES).</div>
        </div>
      `);
    };

    window.abrirConfiguracaoAparencia = () => {
      const botoesTema = ['dark', 'light'].map(t =>
        `<button class="btn ${temaAtual === t ? 'on' : ''}" onclick="mudarTema('${t}')">${t === 'dark' ? '🌙 Escuro' : '☀ Claro'}</button>`
      ).join('');

      const bolotasPaleta = Object.entries(PALETAS_CORES).map(([nome, hue]) =>
        `<div class="sw ${paletaAtual === nome ? 'on' : ''}" title="${nome}" style="background:hsl(${hue} 62% 50%)" onclick="mudarPaleta('${nome}')"></div>`
      ).join('');

      abrirModal('Aparência', `
        <p class="mut" style="margin:0 0 4px">Tema</p>
        <div style="display:flex; gap:6px; margin-bottom:12px">${botoesTema}</div>
        <p class="mut" style="margin:0 0 4px">Paleta</p>
        <div style="display:flex; gap:8px; margin-bottom:12px">${bolotasPaleta}</div>
        <button class="btn" onclick="restaurarLayout()">↺ Restaurar layout dos blocos</button>
      `);
    };

    window.mudarTema = (t) => { temaAtual = t; aplicarVisual(); salvarPrefsLocais(); abrirConfiguracaoAparencia(); };
    window.mudarPaleta = (p) => { paletaAtual = p; aplicarVisual(); salvarPrefsLocais(); abrirConfiguracaoAparencia(); };
    window.restaurarLayout = () => { layoutAtual = LAYOUT_PADRAO; montarColunasLayout(); salvarPrefsLocais(); fecharModal(); };

    function abrirModal(titulo, htmlConteudo, isTree = false, contexto = null) {
      modalContextoAtual = contexto;
      getEl('#modal-box').classList.toggle('mod-tree', isTree);
      getEl('#modal-titulo').innerHTML = titulo;
      getEl('#modal-conteudo').innerHTML = htmlConteudo;
      getEl('#modal').hidden = false;
    }

    window.fecharModal = () => {
      getEl('#modal').hidden = true;
      getEl('#modal-box').classList.remove('mod-tree');
      noInspecionadoId = null;
      modalContextoAtual = null;
    };
    getEl('#modal').onclick = e => { if (e.target.id === 'modal') fecharModal(); };

    /* ---------- Drag & Drop do Layout ---------- */
    function montarColunasLayout() {
      const colunas = [...document.querySelectorAll('.col')];
      const blocos = [...document.querySelectorAll('.blk')];
      const usados = new Set();

      layoutAtual.forEach((idsBloco, i) => {
        idsBloco.forEach(id => {
          const bloco = getEl('#b-' + id);
          if (bloco && colunas[i]) {
            colunas[i].appendChild(bloco);
            usados.add(bloco);
          }
        });
      });

      blocos.forEach(bloco => {
        if (!usados.has(bloco)) colunas[0].appendChild(bloco);
      });
    }

    function salvarLayoutAtual() {
      layoutAtual = [...document.querySelectorAll('.col')].map(col =>
        [...col.querySelectorAll('.blk')].map(bloco => bloco.id.replace('b-', ''))
      );
      salvarPrefsLocais();
    }

    function inicializarDragAndDrop() {
      document.querySelectorAll('.blk').forEach(bloco => {
        const alca = bloco.querySelector('.grip');
        alca.onmousedown = () => bloco.draggable = true;
        bloco.ondragstart = e => {
          bloco.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        };
        bloco.ondragend = () => {
          bloco.classList.remove('dragging');
          bloco.draggable = false;
          document.querySelectorAll('.col').forEach(c => c.classList.remove('over'));
          salvarLayoutAtual();
        };
      });

      document.querySelectorAll('.col').forEach(col => {
        col.ondragover = e => {
          e.preventDefault();
          const blocoArrastando = document.querySelector('.dragging');
          if (!blocoArrastando) return;
          document.querySelectorAll('.col').forEach(c => c.classList.toggle('over', c === col));
          const proximoBloco = [...col.querySelectorAll('.blk:not(.dragging)')].find(b => {
            const rect = b.getBoundingClientRect();
            return e.clientY < rect.top + rect.height / 2;
          });
          col.insertBefore(blocoArrastando, proximoBloco || null);
        };
      });
    }

    /* ---------- Lista Unificada de Passatempos ---------- */
    function obterListaPassatemposSelecionados() {
      const pass = fichaDoc?.passatempos || {};
      if (Array.isArray(pass.lista)) {
        return pass.lista;
      }
      const cat = new Map(obterCatalogoPassatempos().map(p => [p.nome, p]));
      const out = [];
      (pass.focados || []).filter(Boolean).forEach(nome => out.push({ nome, tipo: 'focado', escolha: '' }));
      (pass.mistos || []).forEach((nome, i) => {
        if (nome) out.push({ nome, tipo: 'misto', escolha: (pass.mistosEscolha || [])[i] || '' });
      });
      (pass.extrasOrfao || []).forEach((nome, i) => {
        if (nome) {
          const obj = cat.get(nome);
          out.push({ nome, tipo: obj?.tipo || 'misto', escolha: (pass.extrasOrfaoEscolha || [])[i] || '' });
        }
      });
      return out;
    }

    function calcularLimitesPassatempos() {
      const isOrfao = fichaDoc?.raizesHeranca?.tipo === 'auto';
      const baseFoc = regras.passatemposFocados ?? 1;
      const baseMis = regras.passatemposMistos ?? 1;
      const coringas = isOrfao ? 2 : 0;
      const lista = obterListaPassatemposSelecionados();

      const usadosFoc = lista.filter(p => p.tipo === 'focado').length;
      const usadosMis = lista.filter(p => p.tipo === 'misto').length;
      const totalMax = baseFoc + baseMis + coringas;
      const totalUsado = lista.length;

      const maxFocPermitido = baseFoc + coringas - Math.max(0, usadosMis - baseMis);
      const maxMisPermitido = baseMis + coringas - Math.max(0, usadosFoc - baseFoc);

      return {
        isOrfao,
        totalMax,
        totalUsado,
        usadosFoc,
        usadosMis,
        podeMaisFocado: totalUsado < totalMax && usadosFoc < maxFocPermitido,
        podeMaisMisto: totalUsado < totalMax && usadosMis < maxMisPermitido
      };
    }

    /* ---------- Cálculo Consolidado da Ficha ---------- */
    function calcularEstadoFicha() {
      const f = fichaDoc;
      const h = f.raizesHeranca || { tipo: 'heranca', r1: '', r2: '', secEscolhida: '', secEscolhida2: '' };
      const estagio = f.estagioBiologico || 1;
      const teto = f.tetoIndividualOverride || regras.tetosPorEstagio[estagio] || 2;
      const profissoes = obterProfissoesMescladas();

      const attrBase = {
        potencia: 0, vigor: 0, destreza: 0, percepcao: 0, erudicao: 0, autoridade: 0, impeto: 0,
        ...(f.atributosBase || {})
      };
      const attrArvore = { potencia: 0, vigor: 0, destreza: 0, percepcao: 0, erudicao: 0, autoridade: 0, impeto: 0 };
      const attrMaestria = { potencia: 0, vigor: 0, destreza: 0, percepcao: 0, erudicao: 0, autoridade: 0, impeto: 0 };

      (f.conversoesMaestria || []).forEach(c => {
        if (c.atributo && attrMaestria[c.atributo] !== undefined) attrMaestria[c.atributo] += 1;
      });

      const pericias = {};
      const habilidades = [];
      const bonusRecArvore = { hp: 0, san: 0, pef: 0, pem: 0 };

      const addPericia = (pNome, pVal, fonte) => {
        if (!pNome || pNome === 'ESCOLHA') return;
        if (!pericias[pNome]) pericias[pNome] = { val: 0, fontes: [] };
        pericias[pNome].val += pVal;
        pericias[pNome].fontes.push(`${fonte} (+${pVal})`);
      };

      // 1. Perícias da Raiz / Condição Familiar
      if (h.tipo === 'auto') {
        addPericia('Sobrevivência', 2, 'Órfão');
        addPericia('Atletismo', 2, 'Órfão');
        addPericia('Reflexo', 2, 'Órfão');
        addPericia('Intuição', 2, 'Órfão');
      } else {
        if (h.r1 && profissoes[h.r1]) {
          const prof1 = profissoes[h.r1];
          const sec1 = prof1.sec.includes(h.secEscolhida) ? h.secEscolhida : prof1.sec[0];

          if (h.tipo === 'singular') {
            addPericia(prof1.main[0], 2, `Raiz 1 (${h.r1})`);
            addPericia(prof1.main[1], 2, `Raiz 1 (${h.r1})`);
            if (sec1) addPericia(sec1, 1, `Sec. Raiz 1 (${h.r1})`);
            addPericia(prof1.world, 1, `Mundo Raiz 1 (${h.r1})`);
          } else if (h.tipo === 'heranca') {
            addPericia(prof1.main[0], 3, `Herança (${h.r1})`);
            addPericia(prof1.main[1], 2, `Herança (${h.r1})`);
            if (sec1) addPericia(sec1, 2, `Secundária (${h.r1})`);
            addPericia(prof1.world, 2, `Mundo (${h.r1})`);
          } else if (h.tipo === 'dupla') {
            addPericia(prof1.main[0], 2, `Raiz Dupla (${h.r1})`);
            addPericia(prof1.main[1], 2, `Raiz Dupla (${h.r1})`);
            prof1.sec.forEach(s => addPericia(s, 1, `Secundária (${h.r1})`));
            addPericia(prof1.world, 1, `Mundo (${h.r1})`);
          }
        }

        if (h.tipo === 'singular' && h.r2 && profissoes[h.r2]) {
          const prof2 = profissoes[h.r2];
          const sec2 = prof2.sec.includes(h.secEscolhida2) ? h.secEscolhida2 : prof2.sec[0];
          addPericia(prof2.main[0], 2, `Raiz 2 (${h.r2})`);
          addPericia(prof2.main[1], 2, `Raiz 2 (${h.r2})`);
          if (sec2) addPericia(sec2, 1, `Sec. Raiz 2 (${h.r2})`);
          addPericia(prof2.world, 1, `Mundo Raiz 2 (${h.r2})`);
        }
      }

      // 2. Perícias dos Passatempos Infantis
      const catPass = obterCatalogoPassatempos();
      const mapPass = new Map(catPass.map(p => [p.nome, p]));
      const listaPass = obterListaPassatemposSelecionados();

      listaPass.forEach(item => {
        const obj = mapPass.get(item.nome);
        if (!obj) {
          addPericia(item.nome, item.tipo === 'focado' ? 2 : 1, item.nome);
          return;
        }
        if (obj.tipo === 'focado') {
          addPericia(obj.pericias[0], 2, obj.nome);
        } else {
          obj.pericias.forEach(p => {
            if (p === 'ESCOLHA') {
              if (item.escolha) addPericia(item.escolha, 1, `${obj.nome} (Escolha)`);
            } else {
              addPericia(p, 1, obj.nome);
            }
          });
        }
      });

      // Verifica se a árvore pertence à raiz única do personagem (Herança Singular ou Raiz Dupla)
      // Árvore Padrão e árvores extras (raizesExtras) não recebem esse bônus
      const ehArvoreDaRaizUnica = (arv) => {
        if (!arv || ehArvorePadrao(arv)) return false;
        const temRaizUnica = h.tipo === 'heranca' || h.tipo === 'dupla';
        if (!temRaizUnica || !h.r1) return false;
        return arv.raizAssociada === h.r1;
      };

      // 3. Árvores de Evolução (Base + Mesa)
      const addHabilidadeDeObj = (id, titulo, c, singAtiva, herancaSing, origemRaiz = 'Geral', bonusRaizUnicaRec = 0) => {
        const bonusSing = singAtiva ? (parseInt(herancaSing?.bonusExtra) || 0) : 0;
        const redPeSing = singAtiva ? (parseInt(herancaSing?.reducaoPe) || 0) : 0;

        if (c.efTipo && ['hp', 'san', 'pef', 'pem'].includes(c.efTipo)) {
          bonusRecArvore[c.efTipo] += (parseInt(c.efVal) || 0) + bonusSing + bonusRaizUnicaRec;
        }
        habilidades.push({
          id,
          nome: titulo,
          raiz: origemRaiz,
          cat: c.cat || 'passivo',
          f: Math.max(0, (parseInt(c.f) || 0) - redPeSing),
          m: Math.max(0, (parseInt(c.m) || 0) - redPeSing),
          ef: c.efTipo === 'teste' ? { k: 'teste', v: (parseInt(c.efVal) || 0) + bonusSing } : null,
          critMod: parseInt(c.critMod) || 0,
          desc: singAtiva && herancaSing?.descricao
            ? `${c.descricao || ''} [★ Herança: ${herancaSing.descricao}]`
            : (c.descricao || '')
        });
      };

      const arvoresDisponiveis = obterArvoresMescladas();
      Object.entries(f.nosDesbloqueados || {}).forEach(([arvId, nosIds]) => {
        const arv = arvoresDisponiveis.find(a => a.id === arvId);
        if (!arv) return;
        const temSingular = h.tipo === 'heranca' && h.r1 === arv.raizAssociada;
        const bonusRaizUnicaRec = ehArvoreDaRaizUnica(arv) ? 2 : 0;
        const origemRaiz = ehArvorePadrao(arv) ? 'Padrão' : (arv.raizAssociada || arv.nome || 'Árvore');

        (nosIds || []).forEach(noId => {
          const no = (arv.nos || []).find(n => n.id === noId);
          if (!no) return;

          const singAtiva = temSingular && Boolean(no.herancaSingular);
          const bonusSing = singAtiva ? (parseInt(no.herancaSingular?.bonusExtra) || 0) : 0;

          if (no.tipoRecompensa === 'atributo' || no.tipoRecompensa === 'ambiguo') {
            const esc = (f.escolhasAmbiguas || {})[no.id] || 'a';
            const opt = (no.opcoesAmbiguas || []).find(o => o.idOpcao === esc) || no.opcoesAmbiguas?.[0];
            if (opt) {
              const tipoOpt = opt.tipo || (opt.attr ? 'atributo' : (opt.periciaNome ? 'pericia' : (opt.habilidade ? 'habilidade' : 'narrativo')));
              if (tipoOpt === 'atributo' && opt.attr && attrArvore[opt.attr] !== undefined) {
                attrArvore[opt.attr] += (parseInt(opt.val) || 1) + bonusSing;
              } else if (tipoOpt === 'pericia' && opt.periciaNome) {
                addPericia(opt.periciaNome, (parseInt(opt.periciaVal) || 1) + bonusSing, no.titulo);
              } else if (tipoOpt === 'habilidade' && opt.habilidade) {
                addHabilidadeDeObj(`${no.id}_${esc}`, opt.habilidade.nome || no.titulo, opt.habilidade, singAtiva, no.herancaSingular, origemRaiz, bonusRaizUnicaRec);
              }
            }
          }

          if (no.conteudo?.bonusPericia) {
            Object.entries(no.conteudo.bonusPericia).forEach(([pNome, pVal]) => {
              addPericia(pNome, (parseInt(pVal) || 0) + bonusSing, no.titulo);
            });
          }

          if (no.tipoRecompensa === 'habilidade') {
            addHabilidadeDeObj(no.id, no.titulo, no.conteudo || {}, singAtiva, no.herancaSingular, origemRaiz, bonusRaizUnicaRec);
          }
        });
      });

      // 4. Conversões de Maestria (5 Perícia -> +1 Atributo)
      (f.conversoesMaestria || []).forEach(c => {
        if (c.pericia && pericias[c.pericia]) {
          pericias[c.pericia].val = Math.max(0, pericias[c.pericia].val - 5);
          pericias[c.pericia].fontes.push('Maestria (-5)');
        }
      });

      const attr = {};
      ATRIBUTOS.forEach(([k]) => {
        attr[k] = (attrBase[k] || 0) + (attrArvore[k] || 0) + (attrMaestria[k] || 0);
      });

      const b = h.tipo === 'auto' ? BONUS_ORFAO : (RAIZES[h.r1] || [0, 0, 0, 0]);
      const maxRec = {
        hp: 10 + attr.vigor * 3 + (b[0] || 0) + bonusRecArvore.hp,
        san: 10 + attr.impeto * 3 + (b[1] || 0) + bonusRecArvore.san,
        pef: 5 + attr.destreza + attr.vigor + (b[2] || 0) + bonusRecArvore.pef,
        pem: 5 + attr.impeto + attr.erudicao + (b[3] || 0) + bonusRecArvore.pem
      };

      let rd = 0, penDesl = 0;
      (f.inventario || []).forEach(it => {
        if (!it.equipado) return;
        if (it.categoria === 'armadura') {
          rd += parseInt(it.rd) || 0;
          penDesl += parseInt(it.penalidadeDesl) || 0;
        }
        if (it.categoria === 'escudo' && it.peso === 'pesado') penDesl -= 1;
        if (it.habilidade?.nome) {
          habilidades.push({
            id: `item_${it.uid}`,
            nome: `${it.habilidade.nome} (${it.nome})`,
            raiz: 'Equipamento',
            cat: 'ativo',
            f: 0,
            m: 0,
            custoTxt: it.habilidade.custo || '',
            ef: null,
            critMod: 0,
            desc: it.habilidade.efeito || ''
          });
        }
      });

      return {
        estagio,
        teto,
        attrBase,
        attr,
        pericias,
        habilidades,
        maxRec,
        rd,
        desl: Math.max(1, 5 + attr.destreza + penDesl)
      };
    }

    /* ============================================================ */
    /* CABEÇALHO LIMPO: RAÍZES + CHIPS DE PASSATEMPOS               */
    /* ============================================================ */
    function construirCabecalho() {
      const f = fichaDoc;
      const travado = Boolean(f.criacaoFinalizada);
      const h = f.raizesHeranca || { tipo: 'heranca', r1: '', r2: '', secEscolhida: '', secEscolhida2: '' };
      const profissoes = obterProfissoesMescladas();

      getEl('#nome').value = f.nome || '';
      getEl('#pt-badge').textContent = f.pontosEvolucao || 0;

      const badge = getEl('#badge-etapa');
      badge.textContent = travado ? '🔒 Ficha Ativa' : '✏ Em Criação';
      getEl('#btn-finalizar').hidden = travado;

      const bonus = h.tipo === 'auto' ? BONUS_ORFAO : (RAIZES[h.r1] || [0, 0, 0, 0]);
      const nomesStatus = ['HP', 'SAN', 'PE-F', 'PE-M'];
      const txtBonusStatus = (h.tipo === 'auto' ? 'Órfão: ' : 'Recursos: ') +
        nomesStatus.map((nome, i) => `${nome} ${bonus[i] >= 0 ? '+' : ''}${bonus[i]}`).join(' · ');

      let chipsRaizHtml = '';
      if (h.tipo === 'auto') {
        chipsRaizHtml = `<span class="chip acc">Autodidata / Órfão</span>`;
      } else {
        const prof1 = profissoes[h.r1];
        const sec1 = prof1?.sec?.includes(h.secEscolhida) ? h.secEscolhida : (prof1?.sec?.[0] || '');
        const ptsSec1 = h.tipo === 'heranca' ? '+2' : '+1';

        chipsRaizHtml += `
          <span class="chip acc">
            ${h.tipo === 'singular' ? '1ª' : 'Raiz'}: <b>${h.r1 || 'Nenhuma'}</b>
            ${prof1 && h.tipo !== 'dupla' ? `
              · Sec:
              <select id="sel-sec-r1" ${travado ? 'disabled' : ''} style="padding:1px 5px; font-size:11px">
                ${prof1.sec.map(s => `<option value="${s}" ${s === sec1 ? 'selected' : ''}>${s} (${ptsSec1})</option>`).join('')}
              </select>
            ` : ''}
          </span>
        `;

        if (h.tipo === 'singular') {
          const prof2 = profissoes[h.r2];
          const sec2 = prof2?.sec?.includes(h.secEscolhida2) ? h.secEscolhida2 : (prof2?.sec?.[0] || '');
          chipsRaizHtml += `
            <span class="chip" style="border-color:#4fb0e0">
              2ª: <b>${h.r2 || 'Nenhuma'}</b>
              ${prof2 ? `
                · Sec:
                <select id="sel-sec-r2" ${travado ? 'disabled' : ''} style="padding:1px 5px; font-size:11px">
                  ${prof2.sec.map(s => `<option value="${s}" ${s === sec2 ? 'selected' : ''}>${s} (+1)</option>`).join('')}
                </select>
              ` : ''}
            </span>
          `;
        }
      }

      getEl('#linha-raizes').innerHTML = `
        <label for="tipo">Condição</label>
        <select id="tipo" ${travado ? 'disabled' : ''}>
          <option value="singular" ${h.tipo === 'singular' ? 'selected' : ''}>Raiz Singular (Misto · 2 Raízes)</option>
          <option value="heranca" ${h.tipo === 'heranca' ? 'selected' : ''}>Herança Singular (Foco · +3/+2)</option>
          <option value="dupla" ${h.tipo === 'dupla' ? 'selected' : ''}>Raiz Dupla (Tradição · Ambas Sec.)</option>
          <option value="auto" ${h.tipo === 'auto' ? 'selected' : ''}>Autodidata / Órfão (+2 Passatempos)</option>
        </select>
        ${chipsRaizHtml}
        ${!travado && h.tipo !== 'auto' ? `<button class="btn on" onclick="abrirModalSeletorRaizes()">🧭 Escolher Raízes & Ver Árvores</button>` : ''}
        ${!travado && h.tipo === 'auto' ? `<button class="btn" onclick="abrirModalArvores('explorar')">👁 Estudar Árvores</button>` : ''}
        <span class="chip">${txtBonusStatus}</span>
        <span class="chip">RD: ${computado.rd} · DESL: ${computado.desl}m · Teto: ${computado.teto}</span>
      `;

      if (!travado) {
        getEl('#tipo').onchange = async e => {
          const novoTipo = e.target.value;
          const upd = { "raizesHeranca.tipo": novoTipo };
          if (novoTipo !== 'singular') {
            upd["raizesHeranca.r2"] = '';
            upd["raizesHeranca.secEscolhida2"] = '';
          }
          await updateDoc(doc(db, "fichas", fichaId), upd);
        };

        const selSec1 = getEl('#sel-sec-r1');
        if (selSec1) {
          selSec1.onchange = async () => {
            await updateDoc(doc(db, "fichas", fichaId), { "raizesHeranca.secEscolhida": selSec1.value });
          };
        }

        const selSec2 = getEl('#sel-sec-r2');
        if (selSec2) {
          selSec2.onchange = async () => {
            await updateDoc(doc(db, "fichas", fichaId), { "raizesHeranca.secEscolhida2": selSec2.value });
          };
        }
      }

      // Linha 3: Chips Simples de Passatempos Infantis
      const listaPass = obterListaPassatemposSelecionados();
      const lim = calcularLimitesPassatempos();
      const catPass = new Map(obterCatalogoPassatempos().map(p => [p.nome, p]));
      const listaPericias = mesaDados?.periciasDisponiveis || PERICIAS_LIVRO;

      const chipsPassHtml = listaPass.length
        ? listaPass.map((item, idx) => {
            const obj = catPass.get(item.nome);
            const bonusTxt = obj ? obj.desc : (item.tipo === 'focado' ? '+2' : '+1/+1');
            const ehEscolha = obj?.pericias?.includes('ESCOLHA') || item.nome === 'Estudo Dirigido';
            const selEscolhaHtml = ehEscolha ? `
              <select data-pass-esc="${idx}" ${travado ? 'disabled' : ''} style="padding:1px 5px; font-size:11px">
                <option value="">+1 Escolha...</option>
                ${listaPericias.filter(p => p !== 'Erudição').map(p => `<option value="${p}" ${p === item.escolha ? 'selected' : ''}>+1 ${p}</option>`).join('')}
              </select>
            ` : '';

            return `
              <span class="chip">
                <span>${item.nome}</span>
                <span style="color:var(--acc)">(${bonusTxt})</span>
                ${selEscolhaHtml}
                ${!travado ? `<button class="x" onclick="removerPassatempo(${idx})" title="Remover">✕</button>` : ''}
              </span>
            `;
          }).join('')
        : `<span class="mut" style="font-size:12px">Nenhum passatempo selecionado.</span>`;

      getEl('#linha-passatempos').innerHTML = `
        <div class="form-group" style="flex:1">
          <span class="form-lbl">Passatempos (${lim.totalUsado}/${lim.totalMax}):</span>
          ${chipsPassHtml}
        </div>
        ${!travado ? `
          <button class="btn ${lim.totalUsado < lim.totalMax ? 'on' : ''}" onclick="abrirModalPassatempos()">
            ${lim.totalUsado < lim.totalMax ? '+ Escolher Passatempos' : '✎ Gerenciar Passatempos'}
          </button>
        ` : ''}
      `;

      if (!travado) {
        document.querySelectorAll('[data-pass-esc]').forEach(sel => {
          sel.onchange = async () => {
            const idx = parseInt(sel.dataset.passEsc);
            const novaLista = [...obterListaPassatemposSelecionados()];
            if (novaLista[idx]) {
              novaLista[idx] = { ...novaLista[idx], escolha: sel.value };
              await updateDoc(doc(db, "fichas", fichaId), { "passatempos.lista": novaLista });
            }
          };
        });
      }
    }

    getEl('#nome').onchange = async e => {
      const v = e.target.value.trim();
      if (v) await updateDoc(doc(db, "fichas", fichaId), { nome: v });
    };

    window.finalizarCriacaoFicha = async () => {
      if (!confirm("Finalizar a criação da ficha? Atributos iniciais, raízes, perícias secundárias e passatempos ficarão travados permanentemente.")) return;
      const h = fichaDoc.raizesHeranca || {};
      const profissoes = obterProfissoesMescladas();
      const sec1 = profissoes[h.r1]?.sec?.includes(h.secEscolhida)
        ? h.secEscolhida
        : (profissoes[h.r1]?.sec?.[0] || '');
      const sec2 = h.tipo === 'singular' && profissoes[h.r2]
        ? (profissoes[h.r2].sec.includes(h.secEscolhida2) ? h.secEscolhida2 : profissoes[h.r2].sec[0])
        : '';

      await updateDoc(doc(db, "fichas", fichaId), {
        criacaoFinalizada: true,
        "raizesHeranca.secEscolhida": sec1,
        "raizesHeranca.secEscolhida2": sec2,
        "passatempos.lista": obterListaPassatemposSelecionados(),
        recursosAtuais: { ...computado.maxRec }
      });
    };

    /* ============================================================ */
    /* MODAL DE SELEÇÃO DE RAÍZES (COM RECURSOS, PERÍCIAS E ÁRVORE) */
    /* ============================================================ */
    window.abrirModalSeletorRaizes = () => {
      const h = fichaDoc.raizesHeranca || { tipo: 'heranca', r1: '', r2: '' };
      const listaRaizes = Object.keys(RAIZES).filter(r => r !== 'Órfão');
      const ehSingular = h.tipo === 'singular';
      const profissoes = obterProfissoesMescladas();
      const arvores = obterArvoresMescladas();

      const cardsHtml = listaRaizes.map(nomeRaiz => {
        const bonusRec = RAIZES[nomeRaiz] || [0, 0, 0, 0];
        const prof = profissoes[nomeRaiz];
        const isPri = h.r1 === nomeRaiz;
        const isSec = ehSingular && h.r2 === nomeRaiz;

        const fmtRec = (lbl, v) => `${lbl} <b style="color:${v > 0 ? '#4cc36f' : v < 0 ? '#e05555' : 'var(--mut)'}">${v >= 0 ? '+' + v : v}</b>`;
        const recLinha = `${fmtRec('HP', bonusRec[0])} · ${fmtRec('SAN', bonusRec[1])} · ${fmtRec('PE-F', bonusRec[2])} · ${fmtRec('PE-M', bonusRec[3])}`;

        const perLinha = prof
          ? `Principais: <b>${prof.main.join(', ')}</b><br>Mundo: <b>${prof.world}</b> · Sec: <b>${prof.sec.join(' / ')}</b>`
          : 'Perícias customizadas da mesa';

        const arvRaiz = arvores.find(a => a.raizAssociada === nomeRaiz);

        return `
          <div class="raiz-card ${isPri ? 'r-pri' : isSec ? 'r-sec' : ''}">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:6px">
              <b class="cz" style="color:var(--acc); font-size:13px">${nomeRaiz}</b>
              <div style="display:flex; gap:4px">
                ${isPri ? '<span class="tag" style="border-color:var(--acc); color:var(--acc)">1ª Primária</span>' : ''}
                ${isSec ? '<span class="tag" style="border-color:#4fb0e0; color:#4fb0e0">2ª Secundária</span>' : ''}
              </div>
            </div>
            <div style="font-family:monospace; font-size:11px; background:var(--card); padding:4px 7px; border-radius:6px; border:1px solid var(--line)">
              ${recLinha}
            </div>
            <div style="font-size:12px; color:var(--mut)">${perLinha}</div>
            <div style="display:flex; gap:5px; flex-wrap:wrap; margin-top:auto; padding-top:4px">
              <button class="btn ${isPri ? 'pri' : ''}" onclick="definirRaizPersonagem(1, '${nomeRaiz}')">
                ${ehSingular ? 'Definir 1ª (Recursos)' : 'Escolher Raiz'}
              </button>
              ${ehSingular ? `
                <button class="btn ${isSec ? 'on' : ''}" onclick="definirRaizPersonagem(2, '${nomeRaiz}')" ${isPri ? 'disabled' : ''}>
                  Definir 2ª (Perícias)
                </button>
              ` : ''}
              ${arvRaiz ? `<button class="btn" style="margin-left:auto" onclick="verArvoreDaRaiz('${arvRaiz.id}')">👁 Árvore</button>` : ''}
            </div>
          </div>
        `;
      }).join('');

      abrirModal(
        `Escolher Raízes · <span class="tag">${ehSingular ? '1ª define Recursos + Perícias · 2ª define Perícias' : 'Define Recursos e Perícias'}</span>`,
        `<div class="raiz-grid">${cardsHtml}</div>`,
        false,
        'raizes'
      );
    };

    window.definirRaizPersonagem = async (slot, nomeRaiz) => {
      const h = fichaDoc.raizesHeranca || {};
      const profissoes = obterProfissoesMescladas();
      const primeiraSec = profissoes[nomeRaiz]?.sec?.[0] || '';
      const upd = {};

      if (slot === 1) {
        upd["raizesHeranca.r1"] = nomeRaiz;
        upd["raizesHeranca.secEscolhida"] = primeiraSec;
        if (h.r2 === nomeRaiz) {
          upd["raizesHeranca.r2"] = '';
          upd["raizesHeranca.secEscolhida2"] = '';
        }
      } else {
        upd["raizesHeranca.r2"] = nomeRaiz;
        upd["raizesHeranca.secEscolhida2"] = primeiraSec;
      }

      await updateDoc(doc(db, "fichas", fichaId), upd);
    };

    window.verArvoreDaRaiz = (arvId) => {
      arvoreAtivaId = arvId;
      abrirModalArvores('explorar');
    };

    /* ============================================================ */
    /* MODAL DE PASSATEMPOS (FILTRO DINÂMICO POR LIMITE & SELEÇÃO)  */
    /* ============================================================ */
    window.abrirModalPassatempos = () => {
      const catalogo = obterCatalogoPassatempos();
      const selecionados = obterListaPassatemposSelecionados();
      const nomesJaEscolhidos = new Set(selecionados.map(s => s.nome));
      const lim = calcularLimitesPassatempos();

      const disponiveis = catalogo.filter(p => {
        if (nomesJaEscolhidos.has(p.nome)) return false;
        if (p.tipo === 'focado' && !lim.podeMaisFocado) return false;
        if (p.tipo === 'misto' && !lim.podeMaisMisto) return false;
        return true;
      });

      const regraInfo = lim.isOrfao
        ? `Autodidata: ${lim.totalUsado}/${lim.totalMax} escolhidos (Base + 2 escolhas livres entre Focado/Misto)`
        : `Selecionados: ${lim.totalUsado}/${lim.totalMax} (Focados: ${lim.usadosFoc}/${regras.passatemposFocados ?? 1} · Mistos: ${lim.usadosMis}/${regras.passatemposMistos ?? 1})`;

      const cardsHtml = disponiveis.length
        ? disponiveis.map(p => `
            <div class="pass-card" onclick="adicionarPassatempo('${p.nome.replace(/'/g, "\\'")}', '${p.tipo}')">
              <div class="pass-card-top">
                <span class="pass-card-title">${p.nome}</span>
                <span class="tag">${p.tipo === 'focado' ? 'FOCADO' : 'MISTO'}</span>
              </div>
              <div class="pass-card-desc">${p.desc}</div>
            </div>
          `).join('')
        : `<p class="mut" style="padding:12px">Todos os espaços de passatempos disponíveis já foram preenchidos! Remova um chip no cabeçalho se quiser trocar.</p>`;

      abrirModal(
        `Passatempos Infantis · <span class="chip">${regraInfo}</span>`,
        `<div class="pass-grid">${cardsHtml}</div>`,
        false,
        'passatempos'
      );
    };

    window.adicionarPassatempo = async (nome, tipo) => {
      const lim = calcularLimitesPassatempos();
      if (lim.totalUsado >= lim.totalMax) return mostrarToast('Limite de passatempos atingido!');
      if (tipo === 'focado' && !lim.podeMaisFocado) return mostrarToast('Sem vagas para Passatempo Focado!');
      if (tipo === 'misto' && !lim.podeMaisMisto) return mostrarToast('Sem vagas para Passatempo Misto!');

      const novaLista = [...obterListaPassatemposSelecionados(), { nome, tipo, escolha: '' }];
      await updateDoc(doc(db, "fichas", fichaId), { "passatempos.lista": novaLista });
    };

    window.removerPassatempo = async (idx) => {
      const novaLista = [...obterListaPassatemposSelecionados()];
      novaLista.splice(idx, 1);
      await updateDoc(doc(db, "fichas", fichaId), { "passatempos.lista": novaLista });

    /* ---------- Recursos ---------- */
    function construirInterfaceRecursos() {
      getEl('#res').innerHTML = ESTRUTURA_RECURSOS.map(([chave, nome, cor]) => `
        <div class="res">
          <div class="rt"><span style="color:${cor}">${nome}</span><span id="v-${chave}"></span></div>
          <div class="bar"><i id="b-${chave}" style="background:${cor}"></i></div>
          <div class="ctl">
            <button class="btn sg sub" id="sg-${chave}" onclick="alternarSinalRecurso('${chave}')" title="Alternar subtrair / somar">−</button>
            <input type="number" min="0" id="in-${chave}" placeholder="0" onkeydown="if(event.key==='Enter') aplicarAlteracaoRecurso('${chave}')">
            <button class="btn pri" onclick="aplicarAlteracaoRecurso('${chave}')">Aplicar</button>
            <button class="btn" style="margin-left:auto" onclick="restaurarRecursoMax('${chave}')">Máx</button>
          </div>
        </div>
      `).join('');
    }

    window.alternarSinalRecurso = (chave) => {
      sinalRecursos[chave] *= -1;
      const btn = getEl('#sg-' + chave);
      btn.textContent = sinalRecursos[chave] < 0 ? '−' : '+';
      btn.className = 'btn sg ' + (sinalRecursos[chave] < 0 ? 'sub' : 'add');
    };

    window.aplicarAlteracaoRecurso = async (chave) => {
      const input = getEl('#in-' + chave);
      const valor = Math.abs(parseInt(input.value) || 0);
      if (!valor) return;
      input.value = '';

      const cur = obterRecursosAtuais();
      cur[chave] = Math.min(maximosRecursos[chave], Math.max(0, cur[chave] + sinalRecursos[chave] * valor));
      await updateDoc(doc(db, "fichas", fichaId), { recursosAtuais: cur });
    };

    window.restaurarRecursoMax = async (chave) => {
      const cur = obterRecursosAtuais();
      cur[chave] = maximosRecursos[chave];
      await updateDoc(doc(db, "fichas", fichaId), { recursosAtuais: cur });
    };

    function obterRecursosAtuais() {
      const r = fichaDoc.recursosAtuais || {};
      return {
        hp: r.hp ?? maximosRecursos.hp,
        san: r.san ?? maximosRecursos.san,
        pef: r.pef ?? maximosRecursos.pef,
        pem: r.pem ?? maximosRecursos.pem
      };
    }

    function atualizarValoresRecursos() {
      const cur = obterRecursosAtuais();
      ESTRUTURA_RECURSOS.forEach(([chave]) => {
        getEl('#v-' + chave).textContent = `${cur[chave]} / ${maximosRecursos[chave]}`;
        getEl('#b-' + chave).style.width = Math.max(0, (cur[chave] / maximosRecursos[chave]) * 100) + '%';
      });
    }

    /* ---------- Sigilo / Roda de Atributos ---------- */
    function construirRodaAtributos() {
      const raio = 35, centroX = 50, centroY = 51.7;
      const pontos = ATRIBUTOS.map((_, i) => {
        const angulo = i * 2 * Math.PI / 7 - Math.PI / 2;
        return [centroX + raio * Math.cos(angulo), centroY + raio * Math.sin(angulo)];
      });

      let linhasConexao = '';
      pontos.forEach((p, i) => {
        const proximo = pontos[(i + 1) % 7];
        const salto = pontos[(i + 2) % 7];
        linhasConexao += `<line x1="${p[0]}" y1="${p[1]}" x2="${proximo[0]}" y2="${proximo[1]}" stroke-width="1.2"/>
                          <line x1="${p[0]}" y1="${p[1]}" x2="${salto[0]}" y2="${salto[1]}" stroke-width=".6" opacity=".4"/>`;
      });

      const travado = Boolean(fichaDoc.criacaoFinalizada);
      const isOrfao = fichaDoc.raizesHeranca?.tipo === 'auto';
      const ptsMax = (regras.pontosAtributoIniciais || 5) + (isOrfao ? 1 : 0);
      const ptsGastos = Object.values(computado.attrBase).reduce((a, b) => a + (b || 0), 0);

      getEl('#info-pts-attr').textContent = travado
        ? `Teto ${computado.teto}`
        : `Distribuir: ${ptsMax - ptsGastos}/${ptsMax}`;

      const nosHtml = ATRIBUTOS.map((attr, i) => `
        <div class="node" data-k="${attr[0]}" style="left:${pontos[i][0]}%; top:${pontos[i][1]}%" title="${attr[0].toUpperCase()} (Base: ${computado.attrBase[attr[0]]})">
          <b class="c-${attr[2]}">${attr[1]}</b>
          <input type="number" min="0" max="${computado.teto}" value="${computado.attr[attr[0]]}" ${travado ? 'disabled' : ''}>
        </div>
      `).join('');

      getEl('#wheel').innerHTML = `
        <svg viewBox="0 0 100 100" stroke="var(--acc)" fill="none">
          <circle cx="${centroX}" cy="${centroY}" r="${raio}" stroke-width=".4" opacity=".3"/>
          ${linhasConexao}
        </svg>
        <div class="ctr"><b id="wsum">${Object.values(computado.attr).reduce((a, b) => a + b, 0)}</b>total</div>
        ${nosHtml}
      `;

      document.querySelectorAll('.node').forEach(no => {
        no.onclick = () => { if (modoArmado === 'attr') selecionarAtributo(no.dataset.k); };
        const inp = no.querySelector('input');
        inp.onchange = async e => {
          if (travado) return;
          const key = no.dataset.k;
          const bonusNaoBase = computado.attr[key] - computado.attrBase[key];
          let novoTotal = Math.max(bonusNaoBase, Math.min(computado.teto, parseInt(e.target.value) || 0));
          let novoBase = novoTotal - bonusNaoBase;

          const outrosGastos = ptsGastos - (computado.attrBase[key] || 0);
          if (outrosGastos + novoBase > ptsMax) {
            novoBase = Math.max(0, ptsMax - outrosGastos);
            mostrarToast(`Limite de ${ptsMax} pontos iniciais!`);
          }
          await updateDoc(doc(db, "fichas", fichaId), { [`atributosBase.${key}`]: novoBase });
        };
      });
    }

    window.converterMaestria = async (pericia) => {
      const disp = ATRIBUTOS.filter(([k]) => (computado.attr[k] || 0) < computado.teto);
      if (!disp.length) return mostrarToast(`Todos atributos estão no teto (${computado.teto})!`);

      const escolha = prompt(
        `Converter 5 pontos de "${pericia}" em +1 Atributo (Teto atual: ${computado.teto}):\n\nDigite a chave:\n` +
        disp.map(([k, sig]) => `${k} (${sig} - atual ${computado.attr[k]})`).join('\n')
      );
      if (!escolha) return;
      const key = escolha.trim().toLowerCase();
      if (!disp.some(([k]) => k === key)) return mostrarToast('Atributo inválido ou no teto.');

      const convs = [...(fichaDoc.conversoesMaestria || []), { pericia, atributo: key }];
      await updateDoc(doc(db, "fichas", fichaId), { conversoesMaestria: convs });
      mostrarToast(`+1 em ${obterSiglaAtributo(key)} via Maestria!`);
    };

            <select id="hab-raiz-sel" style="font-size:11px; max-width:135px" title="Filtrar por Raiz / Origem">
              <option value="todas" ${filtroHabilidades.raiz === 'todas' ? 'selected' : ''}>Todas as Raízes</option>

            ${(filtroHabilidades.busca || filtroHabilidades.raiz !== 'todas' || filtroHabilidades.apenasAtivas || filtroHabilidades.apenasComPe)
              ? `<button class="btn" id="btn-hab-limpar" style="font-size:10px; padding:3px 6px; margin-left:auto" title="Limpar filtros">✕</button>`
              : ''}
          </div>

      const inpBusca = getEl('#hab-search-inp');

    /* ============================================================ */
    /* INVENTÁRIO: TRANSFORMAÇÃO DINÂMICA DE BLOCOS NA MESMA LINHA  */
    /* ============================================================ */
    function construirLayoutBlocosInventario() {
      const vig = computado.attr.vigor || 0;
      const cap = { pesado: vig, medio: vig + 1, leve: vig + 2, miudeza: 10 };
      const inv = fichaDoc.inventario || [];

      const blocosBase = {
        pesado:  Array.from({ length: cap.pesado },  (_, i) => ({ origKey: `pesado_${i}`,  origPeso: 'pesado',  modo: 'orig', slots: [{ peso: 'pesado', item: null }] })),
        medio:   Array.from({ length: cap.medio },   (_, i) => ({ origKey: `medio_${i}`,   origPeso: 'medio',   modo: 'orig', slots: [{ peso: 'medio',  item: null }] })),
        leve:    Array.from({ length: cap.leve },    (_, i) => ({ origKey: `leve_${i}`,    origPeso: 'leve',    modo: 'orig', slots: [{ peso: 'leve',   item: null }] })),
        miudeza: Array.from({ length: cap.miudeza }, (_, i) => ({ origKey: `miudeza_${i}`, origPeso: 'miudeza', modo: 'orig', slots: [{ peso: 'miudeza',item: null }] }))
      };

      const todosBlocos = [...blocosBase.pesado, ...blocosBase.medio, ...blocosBase.leve, ...blocosBase.miudeza];
      const naoAlocados = [];
      const excedentes = [];

      const ativarConversaoBloco = (blk) => {
        if (blk.origPeso === 'pesado' && blk.modo === 'orig') {
          blk.modo = 'conv';
          blk.slots = [{ peso: 'medio', item: null }, { peso: 'leve', item: null }];
          return true;
        }
        if (blk.origPeso === 'medio' && blk.modo === 'orig') {
          blk.modo = 'conv';
          blk.slots = [{ peso: 'leve', item: null }, { peso: 'leve', item: null }];
          return true;
        }
        return false;
      };

      inv.forEach(it => {
        if (it.slotKey && typeof it.subIdx === 'number') {
          const blk = todosBlocos.find(b => b.origKey === it.slotKey);
          if (blk) {
            if (blk.modo === 'orig' && blk.origPeso !== it.peso && !blk.slots[0].item) {
              ativarConversaoBloco(blk);
            }
            const slotAlvo = blk.slots[it.subIdx];
            if (slotAlvo && !slotAlvo.item && slotAlvo.peso === it.peso) {
              slotAlvo.item = it;
              return;
            }
          }
        }
        naoAlocados.push(it);
      });

      naoAlocados.forEach(it => {
        for (const blk of todosBlocos) {
          const s = blk.slots.find(x => !x.item && x.peso === it.peso);
          if (s) {
            s.item = it;
            return;
          }
        }

        if (it.peso === 'medio') {
          const blkP = blocosBase.pesado.find(b => b.modo === 'orig' && !b.slots[0].item);
          if (blkP && ativarConversaoBloco(blkP)) {
            blkP.slots[0].item = it;
            return;
          }
        }

        if (it.peso === 'leve') {
          const blkM = blocosBase.medio.find(b => b.modo === 'orig' && !b.slots[0].item);
          if (blkM && ativarConversaoBloco(blkM)) {
            blkM.slots[0].item = it;
            return;
          }
          const blkP = blocosBase.pesado.find(b => b.modo === 'orig' && !b.slots[0].item);
          if (blkP && ativarConversaoBloco(blkP)) {
            blkP.slots[1].item = it;
            return;
          }
        }

        excedentes.push(it);
      });

      todosBlocos.forEach(blk => {
        if (blk.modo === 'conv' && blk.slots.every(s => !s.item)) {
          blk.modo = 'orig';
          blk.slots = [{ peso: blk.origPeso, item: null }];
        }
      });

      return { cap, blocosBase, excedentes };
    }
